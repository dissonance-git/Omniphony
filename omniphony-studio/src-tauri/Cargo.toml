[package]
name = "omniphony-studio"
version = "0.3.3"
edition = "2021"

[[bin]]
name = "omniphony-studio"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SOFA database browser (sofacoustics.org): tiny blocking HTTP client, rustls.
ureq = "2"
# Read SOFA global attributes (License, AuthorContact, Organization) for the
# per-file license display required before using downloaded HRTF sets.
sofar = "0.3"
# Native file-open dialog for importing local SOFA files.
tauri-plugin-dialog = "2"
# 0.11+ required: rosc 0.10's UDP decoder fails on OSC blob args (ReadError(Eof)),
# which silently dropped the gain-table chunks. 0.10-encoded blobs (from the
# renderer) decode fine under 0.11.
rosc = "0.11"
flate2 = "1"
socket2 = "0.5"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
# Overlapped pipe I/O for the mpv IPC bridge so writes can't park the
# writer thread when mpv's 4 KB IPC reader buffer fills under heavy
# decode load (see mpv_overlay::windows_pipe).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",            # CreateFileW / CreateEventW take SECURITY_ATTRIBUTES
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
