name: Omniphony renderer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omniphony-renderer-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  portable-core:
    name: Portable renderer core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Normalize Rust formatting for CI
        run: cargo fmt --all

      - name: Report formatting drift
        shell: bash
        run: |
          if ! git diff --quiet -- '*.rs'; then
            echo "::warning::rustfmt changed committed Rust source; compiler/tests will run on the normalized worktree"
            git diff --stat -- '*.rs'
          fi

      - name: Test portable PCM stream contract
        run: cargo test -p audio_contract

      - name: Test native-host realtime PCM ABI
        run: cargo test -p realtime_ffi

      - name: Test DSP measurement harness
        run: cargo test -p dsp_fixtures

      # This inherited test assumes the HRIR worker cannot finish before the
      # requesting thread observes the old pointer. That is scheduler timing,
      # not a renderer invariant; deterministic matching/stale tests remain.
      - name: Test renderer core
        run: >-
          cargo test -p renderer --
          --skip binaural::tests::hrir_source_switch_lands_asynchronously_without_blocking_render

  windows-core:
    name: Windows native app compile
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Diagnose Windows runner
        run: |
          Write-Host "OS=$([System.Environment]::OSVersion.VersionString)"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Get-Command rustup -ErrorAction Stop | Format-List Source
          Get-Command cargo -ErrorAction Stop | Format-List Source
          Get-Command rustc -ErrorAction Stop | Format-List Source

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Normalize Rust formatting for CI
        run: cargo fmt --all

      - name: Report formatting drift
        run: |
          git diff --quiet -- '*.rs'
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'rustfmt changed committed Rust source; compiler/checks will run on the normalized worktree'
            git diff --stat -- '*.rs'
            $global:LASTEXITCODE = 0
          }

      - name: Check all native Windows host binaries
        run: cargo check -p windows_host --bins

  windows-live-artifact:
    name: Windows x64 Omniphony app prototype
    runs-on: windows-latest
    needs: [portable-core, windows-core]
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Normalize Rust formatting for CI
        run: cargo fmt --all

      - name: Test live bridge and headless engine boundaries
        run: cargo test -p reference_bridge -p orender_engine

      - name: Build native Windows prototype
        run: cargo build --profile release-deploy -p reference_bridge -p windows_host

      - name: Collect native Windows prototype
        run: |
          $dist = Join-Path $PWD 'dist\windows-x64'
          $reference = Join-Path $dist 'reference-demo'
          New-Item -ItemType Directory -Path $reference -Force | Out-Null

          Copy-Item 'target\release-deploy\reference_bridge.dll' $dist -Force
          Copy-Item 'target\release-deploy\omniphony_live.exe' $dist -Force
          Copy-Item 'target\release-deploy\omniphony_worker.exe' $dist -Force
          Copy-Item 'target\release-deploy\omniphony_app.exe' (Join-Path $dist 'Omniphony.exe') -Force
          Copy-Item 'assets\binaural-baselines\upstream-demo-reference.yaml' (Join-Path $reference 'upstream-demo-reference.yaml') -Force
          Copy-Item 'assets\binaural-baselines\stereo-music-prototype.yaml' (Join-Path $reference 'stereo-music-prototype.yaml') -Force
          Copy-Item '..\layouts\7.1.4.yaml' (Join-Path $reference '7.1.4.yaml') -Force

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          title Omniphony WASAPI Diagnostics
          omniphony_live.exe --list-devices
          echo.
          pause
          '@ | Set-Content (Join-Path $dist 'LIST-DEVICES.cmd') -Encoding ascii

          @'
          Omniphony for Headphones - native app prototype

          OPEN THIS:

              Omniphony.exe

          The normal prototype is now STEREO-MUSIC FIRST. The app supervises a
          hidden audio worker; no microphone/input-device picker is part of normal use.

          CURRENT UI

              ON / OFF      Omniphony versus dry comparison
              Quit          stop the worker and close the app
              status line   running / switching / failed state

          PROTOTYPE ON/OFF BEHAVIOR

          Clicking ON/OFF intentionally restarts the hidden worker in the requested
          state. A short interruption is expected. Destroying the old worker also
          destroys its old capture/output queues, so queued wet audio cannot leak
          after OFF. A polished implementation can later make this sample-aligned.

          If the hidden worker fails, the app stays open and writes diagnostics to:

              omniphony.log

          CURRENT TEMPORARY MUSIC ROUTE

              foobar / Windows applications
                -> existing Hi-Fi Cable render endpoint
                -> self-excluding Windows process loopback
                -> request 48 kHz 2ch first even if the temporary endpoint is 7.1
                -> stereo-music Omniphony presentation
                -> automatically preferred FiiO physical output
                -> headphones

          This is migration scaffolding, not the final platform route.

          IMPORTANT: ONE PHYSICAL PATH ONLY

          Keep the existing HeSuVi / Hi-Fi / ASIO software INSTALLED for reversibility,
          but do not leave an old route physically forwarding to the FiiO while
          Omniphony is also sending to the FiiO.

          FOR THE CURRENT STEREO-MUSIC TEST

          1. Keep Hi-Fi Cable installed and Windows/foobar routed to it.
          2. Disable/bypass HeSuVi / Equalizer APO virtualization.
          3. STOP/BYPASS ASIO Bridge or any old route independently forwarding to FiiO.
          4. Disable foobar's 5.1 upmix. Feed ordinary stereo music.
          5. Leave the FiiO connected; Omniphony automatically prefers it.

          The music preset is deliberately NOT the upstream 7.1.4 demo preset.
          It currently uses:

              stereo capture first
              wider front-side L/R presentation
              SAF/KEMAR HRTF
              very light early reflections (0.12)
              no late reverb
              no distance air-absorption

          upstream-demo-reference.yaml remains bundled as a known-spatial regression
          control. It is no longer the normal live-music runtime preset.

          Diagnostic escape hatches only:

              LIST-DEVICES.cmd
              omniphony_live.exe --output "FiiO"
              omniphony_live.exe --rich-bed

          --rich-bed preserves the earlier 8/6-channel-first loopback path for plumbing
          tests. It is NOT the final mixed-source architecture. The intended future
          platform host keeps stereo music and native surround/object sources as
          independent logical streams rather than forcing the whole OS mix through one
          global channel layout.

          PRODUCT ARCHITECTURE

              Omniphony.exe / platform shell
                -> platform worker / audio adapter
                -> portable Omniphony core
                -> binaural stereo output

          Windows is the first host, not part of the portable renderer identity.
          '@ | Set-Content (Join-Path $dist 'LIVE-README.txt')

          foreach ($required in @(
            'Omniphony.exe',
            'omniphony_worker.exe',
            'omniphony_live.exe',
            'reference_bridge.dll',
            'LIST-DEVICES.cmd',
            'reference-demo\upstream-demo-reference.yaml',
            'reference-demo\stereo-music-prototype.yaml',
            'reference-demo\7.1.4.yaml',
            'LIVE-README.txt'
          )) {
            if (!(Test-Path (Join-Path $dist $required))) {
              throw "required native prototype artifact was not collected: $required"
            }
          }

          Get-ChildItem $dist -File -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [System.IO.Path]::GetRelativePath($dist, $_.FullName)
            "$hash  $relative"
          } | Set-Content (Join-Path $dist 'SHA256SUMS.txt')

          Get-ChildItem $dist -Recurse | Format-Table FullName, Length

      - name: Upload native Windows prototype
        uses: actions/upload-artifact@v6
        with:
          name: omniphony-headphones-native-prototype-windows-x64-${{ github.sha }}
          path: omniphony-renderer/dist/windows-x64/
          if-no-files-found: error
          retention-days: 14
