name: Omniphony renderer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not kill the only useful diagnostic run while the fork is being refactored
# through a sequence of small commits. Once CI is routinely green we can switch
# this back to cancel-in-progress to save runner time.
concurrency:
  group: omniphony-renderer-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.87.0

jobs:
  portable-core:
    name: Portable renderer core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use rustup directly instead of a third-party setup action. This makes
      # policy/marketplace restrictions impossible to confuse with Rust errors.
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test DSP measurement harness
        run: cargo test -p dsp_fixtures

      - name: Test renderer core
        run: cargo test -p renderer

  windows-core:
    name: Windows renderer core
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose Windows runner
        run: |
          Write-Host "OS=$([System.Environment]::OSVersion.VersionString)"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Get-Command rustup -ErrorAction Stop | Format-List Source
          Get-Command cargo -ErrorAction Stop | Format-List Source
          Get-Command rustc -ErrorAction Stop | Format-List Source
          if (Test-Path "$env:ProgramFiles\LLVM") {
            Get-ChildItem "$env:ProgramFiles\LLVM\bin" -Filter 'libclang.dll' -ErrorAction SilentlyContinue |
              Select-Object -First 1 | Format-List FullName
          }

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test DSP measurement harness
        run: cargo test -p dsp_fixtures

      - name: Test renderer core
        run: cargo test -p renderer

  windows-listening-artifact:
    name: Windows x64 listening artifact
    runs-on: windows-latest
    needs: windows-core
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Locate libclang
        run: |
          $roots = @(
            "$env:ProgramFiles\LLVM",
            "${env:ProgramFiles(x86)}\LLVM"
          )
          $libclang = $null
          foreach ($root in $roots) {
            if ($root -and (Test-Path $root)) {
              $libclang = Get-ChildItem $root -Recurse -Filter libclang.dll -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($libclang) { break }
            }
          }
          if (-not $libclang) {
            throw 'libclang.dll was not found on the Windows runner'
          }
          "LIBCLANG_PATH=$($libclang.DirectoryName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "LIBCLANG_PATH=$($libclang.DirectoryName)"

      - name: Compile workspace tests
        run: cargo test --workspace --features asio --no-run

      - name: Build release renderer
        run: cargo build --profile release-deploy --features asio -p omniphony-renderer -p reference_bridge -p orender_ffi

      - name: Smoke-test CLI
        run: |
          $exe = 'target\release-deploy\orender.exe'
          if (!(Test-Path $exe)) { throw "Expected renderer not found: $exe" }
          & $exe --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "orender --help failed with $LASTEXITCODE" }
          & $exe --version | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "orender --version failed with $LASTEXITCODE" }

      - name: Collect artifacts
        run: |
          $dist = Join-Path $PWD 'dist\windows-x64'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          $candidates = @(
            'target\release-deploy\orender.exe',
            'target\release-deploy\reference_bridge.dll',
            'target\release-deploy\orender.dll'
          )

          foreach ($file in $candidates) {
            if (Test-Path $file) {
              Copy-Item $file $dist -Force
            }
          }

          if (!(Test-Path (Join-Path $dist 'orender.exe'))) {
            throw 'orender.exe was not collected'
          }

          Get-ChildItem $dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content (Join-Path $dist 'SHA256SUMS.txt')

          Get-ChildItem $dist | Format-Table Name, Length

      - name: Upload Windows renderer
        uses: actions/upload-artifact@v4
        with:
          name: omniphony-windows-x64-${{ github.sha }}
          path: omniphony-renderer/dist/windows-x64/
          if-no-files-found: error
          retention-days: 14
