name: Omniphony renderer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not kill the only useful diagnostic run while the fork is being refactored
# through a sequence of small commits. Once CI is routinely green we can switch
# this back to cancel-in-progress to save runner time.
concurrency:
  group: omniphony-renderer-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.87.0
  # GitHub-hosted runners switched JavaScript actions to Node 24 by default in
  # June 2026. Keep this explicit so a future legacy action cannot silently
  # reintroduce a Node 20 dependency into the fork workflow.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  portable-core:
    name: Portable renderer core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        # checkout v5 is the Node 24 line. v4 targets the deprecated Node 20
        # runtime and began producing deprecation failures/warnings on 2026
        # GitHub-hosted runners.
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test DSP measurement harness
        run: cargo test -p dsp_fixtures

      - name: Test renderer core
        run: cargo test -p renderer

  windows-core:
    name: Windows renderer core
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Diagnose Windows runner
        run: |
          Write-Host "OS=$([System.Environment]::OSVersion.VersionString)"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Get-Command rustup -ErrorAction Stop | Format-List Source
          Get-Command cargo -ErrorAction Stop | Format-List Source
          Get-Command rustc -ErrorAction Stop | Format-List Source

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test DSP measurement harness
        run: cargo test -p dsp_fixtures

      - name: Test renderer core
        run: cargo test -p renderer

  windows-engine-artifact:
    name: Windows x64 renderer engine artifact
    runs-on: windows-latest
    needs: windows-core
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      # `orender_ffi` / `orender_engine` deliberately do not depend on the host
      # audio layer. That lets CI validate and package the actual renderer engine
      # without requiring Steinberg's separately licensed ASIO SDK. The final
      # Windows listening shell will get its own gate once the fork's Windows
      # output route defaults to a normal system backend (ASIO may remain opt-in).
      - name: Test headless engine boundary
        run: cargo test -p orender_engine -p orender_ffi -p reference_bridge

      - name: Build release engine
        run: cargo build --profile release-deploy -p orender_ffi -p reference_bridge

      - name: Collect engine artifacts
        run: |
          $dist = Join-Path $PWD 'dist\windows-x64'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          $candidates = @(
            'target\release-deploy\orender.dll',
            'target\release-deploy\reference_bridge.dll',
            'orender_ffi\include\orender.h'
          )

          foreach ($file in $candidates) {
            if (Test-Path $file) {
              Copy-Item $file $dist -Force
            }
          }

          if (!(Test-Path (Join-Path $dist 'orender.dll'))) {
            throw 'orender.dll was not collected'
          }

          Get-ChildItem $dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content (Join-Path $dist 'SHA256SUMS.txt')

          Get-ChildItem $dist | Format-Table Name, Length

      - name: Upload Windows renderer engine
        # upload-artifact v6 is the Node 24-native line. v4 is Node 20-era.
        uses: actions/upload-artifact@v6
        with:
          name: omniphony-renderer-engine-windows-x64-${{ github.sha }}
          path: omniphony-renderer/dist/windows-x64/
          if-no-files-found: error
          retention-days: 14
