name: Omniphony renderer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omniphony-renderer-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  portable-core:
    name: Portable renderer core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Normalize Rust formatting for CI
        run: cargo fmt --all

      - name: Report formatting drift
        shell: bash
        run: |
          if ! git diff --quiet -- '*.rs'; then
            echo "::warning::rustfmt changed committed Rust source; compiler/tests will run on the normalized worktree"
            git diff --stat -- '*.rs'
          fi

      - name: Test portable PCM stream contract
        run: cargo test -p audio_contract

      - name: Test native-host realtime PCM ABI
        run: cargo test -p realtime_ffi

      - name: Test DSP measurement harness
        run: cargo test -p dsp_fixtures

      # This one legacy test assumes the HRIR worker cannot finish before the
      # requesting thread observes the old pointer. That is a scheduler-speed
      # assumption, not a renderer invariant; fast runners can legitimately beat
      # it. The deterministic matching/stale-completion tests remain enabled.
      - name: Test renderer core
        run: >-
          cargo test -p renderer --
          --skip binaural::tests::hrir_source_switch_lands_asynchronously_without_blocking_render

  windows-core:
    name: Windows live host compile
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Diagnose Windows runner
        run: |
          Write-Host "OS=$([System.Environment]::OSVersion.VersionString)"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Get-Command rustup -ErrorAction Stop | Format-List Source
          Get-Command cargo -ErrorAction Stop | Format-List Source
          Get-Command rustc -ErrorAction Stop | Format-List Source

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Normalize Rust formatting for CI
        run: cargo fmt --all

      - name: Report formatting drift
        run: |
          git diff --quiet -- '*.rs'
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'rustfmt changed committed Rust source; compiler/checks will run on the normalized worktree'
            git diff --stat -- '*.rs'
            $global:LASTEXITCODE = 0
          }

      # Renderer semantics are exercised by portable-core. Windows owns the
      # actual capture/output host compilation here.
      - name: Check all native Windows host binaries
        run: cargo check -p windows_host --bins

  windows-live-artifact:
    name: Windows x64 live listening baseline
    runs-on: windows-latest
    needs: [portable-core, windows-core]
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Normalize Rust formatting for CI
        run: cargo fmt --all

      - name: Test live bridge and headless engine boundaries
        run: cargo test -p reference_bridge -p orender_engine

      - name: Build live Windows baseline
        run: cargo build --profile release-deploy -p reference_bridge -p windows_host

      - name: Collect live listening baseline
        run: |
          $dist = Join-Path $PWD 'dist\windows-x64'
          $reference = Join-Path $dist 'reference-demo'
          New-Item -ItemType Directory -Path $reference -Force | Out-Null

          Copy-Item 'target\release-deploy\reference_bridge.dll' $dist -Force
          Copy-Item 'target\release-deploy\omniphony_live.exe' $dist -Force
          Copy-Item 'assets\binaural-baselines\upstream-demo-reference.yaml' (Join-Path $reference 'upstream-demo-reference.yaml') -Force
          Copy-Item '..\layouts\7.1.4.yaml' (Join-Path $reference '7.1.4.yaml') -Force

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          title Omniphony for Headphones
          echo ============================================================
          echo                  OMNIPHONY FOR HEADPHONES
          echo ============================================================
          echo.
          echo Starting the crude live Windows baseline...
          echo.
          echo While running:
          echo   ENTER      toggle Omniphony ON / OFF
          echo   q + ENTER  quit
          echo.
          echo If startup fails, this window stays open so the actual
          echo device/configuration error can be read instead of disappearing.
          echo.
          omniphony_live.exe %*
          set "omniphony_exit=%ERRORLEVEL%"
          if "%omniphony_exit%"=="0" exit /b 0
          echo.
          echo ============================================================
          echo Omniphony exited with error code %omniphony_exit%.
          echo Copy the error text above so the route can be fixed directly.
          echo ============================================================
          echo.
          pause
          exit /b %omniphony_exit%
          '@ | Set-Content (Join-Path $dist 'START-OMNIPHONY.cmd') -Encoding ascii

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          title Omniphony WASAPI Devices
          omniphony_live.exe --list-devices
          echo.
          pause
          '@ | Set-Content (Join-Path $dist 'LIST-DEVICES.cmd') -Encoding ascii

          @'
          Omniphony for Headphones - crude live Windows baseline

          Goal: hear arbitrary player audio through the existing Omniphony binaural
          renderer now. This is deliberately NOT the finished product.

          The first useful comparison reuses the working front half of the current
          foobar chain and replaces only HeSuVi's headphone renderer:

              foobar
                -> normal music DSP / SoX
                -> existing Upmix to 5.1/side
                -> clean Hi-Fi Cable
                -> omniphony_live.exe
                -> Omniphony binaural renderer
                -> FiiO / headphones

          EASIEST START

          Double-click:

              START-OMNIPHONY.cmd

          The wrapper stays visible if the worker exits with an error. That turns
          an apparently non-opening EXE into a readable device/configuration error.

          Controls while the worker is running:

              ENTER       toggle Omniphony ON / OFF
              q + ENTER   quit

          Omniphony starts ON. The shell is intentionally the entire UI for this
          baseline; the renderer remains a separate native process, following the
          same supervision principle as upstream Omniphony Studio without pulling
          the full Tauri frontend into this test build.

          To see the exact WASAPI device names first, double-click:

              LIST-DEVICES.cmd

          IMPORTANT FOR AN EXISTING HeSuVi SETUP

          1. Keep Hi-Fi Cable installed. It is only temporary scaffolding here.
          2. Keep foobar's existing 5.1 upmix enabled for the first baseline. That
             gives Omniphony real front/center/side channel positions immediately,
             without waiting for our future stereo interpretation layer.
          3. Disable/bypass HeSuVi / Equalizer APO processing on the cable while
             testing Omniphony, otherwise the captured signal may already contain
             HeSuVi processing.
          4. Close ASIO Bridge or anything else exclusively consuming the cable.
          5. Point foobar's output at the Hi-Fi Cable playback endpoint.
          6. Point Windows default output at the FiiO/headphones.

          Advanced launch from a terminal, using unique device-name substrings:

              .\omniphony_live.exe --input "Hi-Fi Cable" --output "FiiO"

          The host accepts canonical stereo, 5.1, 7.1, and 7.1.4 channel widths.
          ON preserves those channel positions through Omniphony. OFF is only a
          crude comparison downmix for multichannel input; it is not intended to
          reproduce the full existing HeSuVi chain.

          There is intentionally no bundled listening demo and CI does not render
          prerecorded audio anymore. Your Windows machine + arbitrary foobar
          playback is the listening oracle for this baseline.
          '@ | Set-Content (Join-Path $dist 'LIVE-README.txt')

          foreach ($required in @(
            'reference_bridge.dll',
            'omniphony_live.exe',
            'START-OMNIPHONY.cmd',
            'LIST-DEVICES.cmd',
            'reference-demo\upstream-demo-reference.yaml',
            'reference-demo\7.1.4.yaml',
            'LIVE-README.txt'
          )) {
            if (!(Test-Path (Join-Path $dist $required))) {
              throw "required live baseline artifact was not collected: $required"
            }
          }

          Get-ChildItem $dist -File -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [System.IO.Path]::GetRelativePath($dist, $_.FullName)
            "$hash  $relative"
          } | Set-Content (Join-Path $dist 'SHA256SUMS.txt')

          Get-ChildItem $dist -Recurse | Format-Table FullName, Length

      - name: Upload live Windows baseline
        uses: actions/upload-artifact@v6
        with:
          name: omniphony-headphones-live-baseline-windows-x64-${{ github.sha }}
          path: omniphony-renderer/dist/windows-x64/
          if-no-files-found: error
          retention-days: 14
