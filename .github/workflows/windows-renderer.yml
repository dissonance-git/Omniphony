name: Omniphony renderer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit on a branch is relevant during rapid iteration. Cancel
# superseded runs so a burst of development commits does not leave stale Windows
# builds queued behind the current product head.
concurrency:
  group: omniphony-renderer-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  portable-core:
    name: Portable renderer core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Normalize Rust formatting for CI
        run: cargo fmt --all

      - name: Report formatting drift
        shell: bash
        run: |
          if ! git diff --quiet -- '*.rs'; then
            echo "::warning::rustfmt changed committed Rust source; compiler/tests will run on the normalized worktree"
            git diff --stat -- '*.rs'
          fi

      - name: Test portable PCM stream contract
        run: cargo test -p audio_contract

      - name: Test native-host realtime PCM ABI
        run: cargo test -p realtime_ffi

      - name: Test DSP measurement harness
        run: cargo test -p dsp_fixtures

      - name: Test renderer core
        run: cargo test -p renderer

  windows-core:
    name: Windows renderer core
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Diagnose Windows runner
        run: |
          Write-Host "OS=$([System.Environment]::OSVersion.VersionString)"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Get-Command rustup -ErrorAction Stop | Format-List Source
          Get-Command cargo -ErrorAction Stop | Format-List Source
          Get-Command rustc -ErrorAction Stop | Format-List Source

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Normalize Rust formatting for CI
        run: cargo fmt --all

      - name: Report formatting drift
        run: |
          git diff --quiet -- '*.rs'
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'rustfmt changed committed Rust source; compiler/tests will run on the normalized worktree'
            git diff --stat -- '*.rs'
            $global:LASTEXITCODE = 0
          }

      - name: Test portable PCM stream contract
        run: cargo test -p audio_contract

      - name: Test native-host realtime PCM ABI
        run: cargo test -p realtime_ffi

      - name: Test DSP measurement harness
        run: cargo test -p dsp_fixtures

      - name: Test renderer core
        run: cargo test -p renderer

      - name: Check native Windows WASAPI host and listener
        run: cargo check -p windows_host

  windows-engine-artifact:
    name: Windows x64 renderer engine artifact
    runs-on: windows-latest
    needs: [portable-core, windows-core]
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: omniphony-renderer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Normalize Rust formatting for CI
        run: cargo fmt --all

      - name: Test headless engine boundary
        run: cargo test -p orender_engine -p orender_ffi -p reference_bridge

      - name: Build release engine and Windows listening boundaries
        run: cargo build --profile release-deploy -p orender_ffi -p reference_bridge -p realtime_ffi -p windows_host

      - name: Collect Windows listening prototype
        run: |
          $dist = Join-Path $PWD 'dist\windows-x64'
          $reference = Join-Path $dist 'reference-demo'
          New-Item -ItemType Directory -Path $reference -Force | Out-Null

          $candidates = @(
            'target\release-deploy\orender.dll',
            'target\release-deploy\reference_bridge.dll',
            'target\release-deploy\omniphony_realtime.dll',
            'target\release-deploy\windows_host.exe',
            'target\release-deploy\omniphony_listen.exe',
            'orender_ffi\include\orender.h',
            'realtime_ffi\include\omniphony_realtime.h'
          )

          foreach ($file in $candidates) {
            if (Test-Path $file) {
              Copy-Item $file $dist -Force
            }
          }

          Copy-Item 'assets\binaural-baselines\upstream-demo-reference.yaml' (Join-Path $reference 'upstream-demo-reference.yaml') -Force
          Copy-Item '..\layouts\7.1.4.yaml' (Join-Path $reference '7.1.4.yaml') -Force
          Copy-Item 'assets\demo\spatial-demo.wav' (Join-Path $reference 'spatial-demo.wav') -Force

          @'
          Omniphony for Headphones — internal P0.1 listening prototype

          This is not an installer or a system-wide audio replacement yet.

          Set the Windows default output device to the headphones/DAC you want to test
          and keep volume conservative on first playback.

          Native output check:
              .\windows_host.exe --smoke-output

          Bundled protected reference:
              .\windows_host.exe --reference-demo

          Real source material:
              .\omniphony_listen.exe "C:\path\to\test.wav"

          The real-material listener currently accepts uncompressed WAV material handled
          by reference_bridge. Stereo is conservatively treated as an L/R channel bed;
          it is NOT yet the future intelligent full-sphere stereo presentation. True
          5.1/7.1/7.1.4 WAV material already carries richer channel-position truth and is
          especially useful for testing the renderer.

          This prototype renders the complete input file before playback. Continuous
          bounded realtime file/system streaming is the next transport step.
          '@ | Set-Content (Join-Path $dist 'LISTEN-README.txt')

          foreach ($required in @(
            'orender.dll',
            'reference_bridge.dll',
            'omniphony_realtime.dll',
            'windows_host.exe',
            'omniphony_listen.exe',
            'reference-demo\upstream-demo-reference.yaml',
            'reference-demo\7.1.4.yaml',
            'reference-demo\spatial-demo.wav'
          )) {
            if (!(Test-Path (Join-Path $dist $required))) {
              throw "required listening artifact was not collected: $required"
            }
          }

          Get-ChildItem $dist -File -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [System.IO.Path]::GetRelativePath($dist, $_.FullName)
            "$hash  $relative"
          } | Set-Content (Join-Path $dist 'SHA256SUMS.txt')

          Get-ChildItem $dist -Recurse | Format-Table FullName, Length

      - name: Validate packaged protected reference render
        run: |
          Push-Location 'dist\windows-x64'
          try {
            .\windows_host.exe --render-reference-only
            if ($LASTEXITCODE -ne 0) {
              throw "packaged reference validation exited with code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      - name: Validate packaged real-material render path
        run: |
          Push-Location 'dist\windows-x64'
          try {
            .\omniphony_listen.exe --render-only .\reference-demo\spatial-demo.wav
            if ($LASTEXITCODE -ne 0) {
              throw "packaged file-listener validation exited with code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload Windows renderer engine
        uses: actions/upload-artifact@v6
        with:
          name: omniphony-headphones-p0-1-windows-x64-${{ github.sha }}
          path: omniphony-renderer/dist/windows-x64/
          if-no-files-found: error
          retention-days: 14
