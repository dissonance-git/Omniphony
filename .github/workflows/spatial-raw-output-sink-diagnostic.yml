name: Spatial RAW output sink diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spatial-raw-output-sink-diagnostic.yml'
      - 'omniphony-renderer/windows_installer/spatial_provider_probe/OmniphonySpatialRawOutputSink*'
      - 'omniphony-renderer/windows_installer/spatial_provider_probe/OmniphonySpatialRawOutputPump*'
      - 'omniphony-renderer/windows_installer/spatial_provider_probe/OmniphonySpatialStereoQueue*'
      - 'omniphony-renderer/windows_installer/spatial_provider_probe/OmniphonySpatialClosedGateEgressProbe.cpp'
      - 'omniphony-renderer/windows_installer/spatial_provider_probe/CMakeLists.txt'

permissions:
  contents: write

jobs:
  compile-contract:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup VS2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Verify RAW lifecycle contract
        id: contract
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'omniphony-renderer\windows_installer\spatial_provider_probe'
          $header = Get-Content (Join-Path $root 'OmniphonySpatialRawOutputSink.h') -Raw
          $source = Get-Content (Join-Path $root 'OmniphonySpatialRawOutputSink.cpp') -Raw
          $pumpHeader = Get-Content (Join-Path $root 'OmniphonySpatialRawOutputPump.h') -Raw
          $pumpSource = Get-Content (Join-Path $root 'OmniphonySpatialRawOutputPump.cpp') -Raw
          $queueHeader = Get-Content (Join-Path $root 'OmniphonySpatialStereoQueue.h') -Raw
          $physicalProbe = Get-Content (Join-Path $root 'OmniphonySpatialClosedGateEgressProbe.cpp') -Raw

          foreach ($needle in @(
            'AUDCLNT_STREAMOPTIONS_RAW',
            'AUDCLNT_STREAMFLAGS_EVENTCALLBACK',
            'InitializeSharedAudioStream',
            'IAudioRenderClient',
            'SetEventHandle'
          )) {
            if (-not $source.Contains($needle)) {
              throw "Missing RAW sink contract token: $needle"
            }
          }

          if ($source -match '(?m)->Start\s*\(' -or $header -match '(?m)^\s*HRESULT\s+Start\s*\(') {
            throw 'Install-preflight RAW sink must not expose or call Start().'
          }
          if (-not $header.Contains('IsStarted() const noexcept')) {
            throw 'RAW sink must expose explicit started-state observability.'
          }
          if (-not $header.Contains('requestedPeriodFrames = 0')) {
            throw 'RAW output sink must default to endpoint-owned cadence rather than forcing the 480-frame render quantum.'
          }
          foreach ($needle in @('TryWrite', 'Read', 'DroppedFrames', 'UnderrunFrames')) {
            if (-not $queueHeader.Contains($needle)) {
              throw "Missing clock-domain queue contract token: $needle"
            }
          }
          foreach ($needle in @('Start()', 'DrainOnce()', 'WaitAndDrain', 'Stop()')) {
            if (-not $pumpHeader.Contains($needle)) {
              throw "Missing closed-gate pump contract token: $needle"
            }
          }
          foreach ($needle in @('GetCurrentPadding', 'GetBuffer', 'ReleaseBuffer', 'AUDCLNT_BUFFERFLAGS_SILENT')) {
            if (-not $pumpSource.Contains($needle)) {
              throw "Missing endpoint-event drain contract token: $needle"
            }
          }
          foreach ($needle in @(
            'CreateOmniphonyStaticProbeStreamWithRealtimeBridgeAndQueue',
            'OmniphonySpatialRawOutputPump',
            'AvSetMmThreadCharacteristicsW',
            'SPATIAL_CLOSED_GATE_EGRESS_PROVIDER_REGISTERED 0',
            'SPATIAL_CLOSED_GATE_EGRESS_PROVIDER_SELECTED 0',
            'SPATIAL_CLOSED_GATE_EGRESS_PUBLIC_PROVIDER_GATE_OPENED 0'
          )) {
            if (-not $physicalProbe.Contains($needle)) {
              throw "Missing finite physical egress diagnostic safety token: $needle"
            }
          }
          Write-Host 'SPATIAL_RAW_OUTPUT_SINK_INERT_PUBLIC_CONTRACT_OK 1'
          Write-Host 'SPATIAL_RAW_OUTPUT_CLOCK_DOMAIN_CONTRACT_OK 1'
          Write-Host 'SPATIAL_RAW_OUTPUT_PUMP_SOURCE_CONTRACT_OK 1'
          Write-Host 'SPATIAL_CLOSED_GATE_EGRESS_SOURCE_CONTRACT_OK 1'

      - name: Configure spatial provider targets
        id: configure
        continue-on-error: true
        shell: pwsh
        run: |
          cmake `
            -S "$env:GITHUB_WORKSPACE\omniphony-renderer\windows_installer\spatial_provider_probe" `
            -B "$env:GITHUB_WORKSPACE\build\spatial-provider" `
            -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }

      - name: Build RAW output cadence targets
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE\build\spatial-provider" `
            --config Release `
            --target OmniphonySpatialRawOutputSinkProbe OmniphonySpatialStereoQueueSmoke OmniphonySpatialRawOutputPumpSmoke OmniphonySpatialClosedGateEgressProbe `
            --verbose
          if ($LASTEXITCODE -ne 0) { throw "Spatial egress probe build failed: $LASTEXITCODE" }

      - name: Run registry-free clock-domain queue smoke
        id: queue_smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $probe = "$env:GITHUB_WORKSPACE\build\spatial-provider\Release\OmniphonySpatialStereoQueueSmoke.exe"
          if (-not (Test-Path -LiteralPath $probe)) {
            throw "Stereo queue smoke binary missing: $probe"
          }
          $output = @(& $probe 2>&1 | ForEach-Object { "$_" })
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "Stereo queue smoke failed: $LASTEXITCODE" }
          if (-not ($output -contains 'SPATIAL_STEREO_QUEUE_OK 1')) {
            throw 'Stereo queue smoke did not emit success marker.'
          }
          if (-not ($output -contains 'SPATIAL_STEREO_QUEUE_VARIABLE_CONSUMER_PERIODS 1')) {
            throw 'Stereo queue smoke did not prove variable consumer periods.'
          }

      - name: Run registry-free active-pump contract smoke
        id: pump_smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $probe = "$env:GITHUB_WORKSPACE\build\spatial-provider\Release\OmniphonySpatialRawOutputPumpSmoke.exe"
          if (-not (Test-Path -LiteralPath $probe)) {
            throw "RAW pump smoke binary missing: $probe"
          }
          $output = @(& $probe 2>&1 | ForEach-Object { "$_" })
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "RAW pump contract smoke failed: $LASTEXITCODE" }
          foreach ($marker in @(
            'SPATIAL_RAW_OUTPUT_PUMP_CONTRACT_OK 1',
            'SPATIAL_RAW_OUTPUT_PUMP_PHYSICAL_ENDPOINT_OPENED 0',
            'SPATIAL_RAW_OUTPUT_PUMP_STREAM_STARTED 0',
            'SPATIAL_RAW_OUTPUT_PUMP_PUBLIC_PROVIDER_GATE_OPENED 0'
          )) {
            if (-not ($output -contains $marker)) {
              throw "RAW pump smoke missing marker: $marker"
            }
          }

      - name: Verify manual physical probe binaries without running them
        id: binary
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $sinkProbe = "$env:GITHUB_WORKSPACE\build\spatial-provider\Release\OmniphonySpatialRawOutputSinkProbe.exe"
          $egressProbe = "$env:GITHUB_WORKSPACE\build\spatial-provider\Release\OmniphonySpatialClosedGateEgressProbe.exe"
          foreach ($probe in @($sinkProbe, $egressProbe)) {
            if (-not (Test-Path -LiteralPath $probe)) {
              throw "Expected spatial output diagnostic binary missing: $probe"
            }
          }
          Write-Host 'SPATIAL_RAW_OUTPUT_SINK_PROBE_BUILT 1'
          Write-Host 'SPATIAL_RAW_OUTPUT_SINK_PROBE_STARTED 0'
          Write-Host 'SPATIAL_CLOSED_GATE_EGRESS_PROBE_BUILT 1'
          Write-Host 'SPATIAL_CLOSED_GATE_EGRESS_PROBE_RUN_IN_CI 0'

      - name: Write diagnostic record
        if: always()
        shell: pwsh
        run: |
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE 'ci-diagnostics'
          New-Item -ItemType Directory -Force $diagnostics | Out-Null
          $contract = '${{ steps.contract.outcome }}'
          $configure = '${{ steps.configure.outcome }}'
          $build = '${{ steps.build.outcome }}'
          $queueSmoke = '${{ steps.queue_smoke.outcome }}'
          $pumpSmoke = '${{ steps.pump_smoke.outcome }}'
          $binary = '${{ steps.binary.outcome }}'
          if (-not $build) { $build = 'skipped' }
          if (-not $queueSmoke) { $queueSmoke = 'skipped' }
          if (-not $pumpSmoke) { $pumpSmoke = 'skipped' }
          if (-not $binary) { $binary = 'skipped' }
          $overall = if (
            $contract -eq 'success' -and
            $configure -eq 'success' -and
            $build -eq 'success' -and
            $queueSmoke -eq 'success' -and
            $pumpSmoke -eq 'success' -and
            $binary -eq 'success'
          ) { 'success' } else { 'failure' }
          [ordered]@{
            schema = 'omniphony.windows.spatial-raw-output-sink-diagnostic.v4'
            head_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            overall = $overall
            contract = $contract
            configure = $configure
            build = $build
            queue_smoke = $queueSmoke
            pump_smoke = $pumpSmoke
            binary = $binary
            endpoint_period_owned_by_sink = $true
            renderer_quantum_frames = 480
            active_pump_compiled = ($build -eq 'success')
            closed_gate_egress_probe_compiled = ($build -eq 'success')
            closed_gate_egress_probe_run_in_ci = $false
            physical_endpoint_opened = $false
            stream_started = $false
            public_provider_gate_opened = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8 `
            (Join-Path $diagnostics 'spatial-raw-output-sink.json')

      - name: Publish diagnostic record
        if: always()
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $record = 'ci-diagnostics/spatial-raw-output-sink.json'
          if (-not (Test-Path $record)) {
            throw 'Spatial RAW output sink diagnostic record was not produced.'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $record
          if (git diff --cached --quiet) {
            Write-Host 'Spatial RAW output sink diagnostic record is unchanged.'
            exit 0
          }
          git commit -m 'build(windows): record spatial raw output sink diagnostic'
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic commit failed: $LASTEXITCODE" }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic rebase failed: $LASTEXITCODE" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic push failed: $LASTEXITCODE" }

      - name: Enforce diagnostic result
        if: always()
        shell: pwsh
        run: |
          $record = Get-Content "$env:GITHUB_WORKSPACE\ci-diagnostics\spatial-raw-output-sink.json" -Raw | ConvertFrom-Json
          if ($record.overall -ne 'success') {
            throw "Spatial RAW output diagnostic failed: contract=$($record.contract) configure=$($record.configure) build=$($record.build) queue=$($record.queue_smoke) pump=$($record.pump_smoke) binary=$($record.binary)"
          }
