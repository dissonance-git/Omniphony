name: Bootstrap foobar dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-foobar-deps.yml'

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - name: Install archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full unzip

      - name: Fetch official foobar2000 SDK 2025-03-07
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deps/foobar-sdk
          curl --fail --location --retry 4 \
            'https://www.foobar2000.org/downloads/SDK-2025-03-07.7z' \
            -o SDK-2025-03-07.7z
          7z x -y SDK-2025-03-07.7z -odeps/foobar-sdk >/dev/null
          test -d deps/foobar-sdk/foobar2000/SDK
          test -d deps/foobar-sdk/pfc
          test -d deps/foobar-sdk/libPPUI
          find deps/foobar-sdk -maxdepth 2 -type d | sort | head -40

      - name: Fetch WTL 10.0.10320
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            'https://sourceforge.net/projects/wtl/files/WTL%2010/WTL%2010.0.10320%20Release/WTL10_10320_Release.zip/download' \
            -o WTL10_10320_Release.zip
          mkdir -p deps/wtl
          unzip -q WTL10_10320_Release.zip -d deps/wtl
          test -f deps/wtl/Include/atlapp.h || test -f deps/wtl/WTL10_10320_Release/Include/atlapp.h

      - name: Fetch pinned libvgm
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags https://github.com/ValleyBell/libvgm.git deps/libvgm
          git -C deps/libvgm checkout --detach 61fc6725644886abc3168e240e4e51588d74bdf7
          test "$(git -C deps/libvgm rev-parse HEAD)" = '61fc6725644886abc3168e240e4e51588d74bdf7'
          test -f deps/libvgm/emu/cores/ym3438.c
          test -f deps/libvgm/player/vgmplayer.cpp
          rm -rf deps/libvgm/.git

      - name: Normalize dependency layout
        shell: bash
        run: |
          set -euo pipefail
          if [ -d deps/wtl/WTL10_10320_Release ]; then
            mv deps/wtl/WTL10_10320_Release deps/wtl-normalized
            rm -rf deps/wtl
            mv deps/wtl-normalized deps/wtl
          fi
          test -f deps/wtl/Include/atlapp.h
          du -sh deps/*

      - name: Upload public dependency bundle
        uses: actions/upload-artifact@v4
        with:
          name: foobar-public-build-deps
          path: deps/
          compression-level: 6
          retention-days: 1
          if-no-files-found: error
