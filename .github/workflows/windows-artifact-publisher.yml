name: Publish Omniphony Windows installer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-artifact-publisher.yml'
  workflow_run:
    workflows: ['Omniphony for Windows installer']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish current OmniphonySetup.exe
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest installer run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          # workflow_run events can complete out of order when several main
          # pushes are validating concurrently. Always resolve the newest run
          # created for main instead of trusting the event that happened to
          # finish last, otherwise an older artifact can roll "current" back.
          latest="$(gh api "repos/$repo/actions/workflows/windows-installer.yml/runs?branch=main&per_page=1")"
          run_id="$(jq -r '.workflow_runs[0].id // empty' <<< "$latest")"
          run_status="$(jq -r '.workflow_runs[0].status // empty' <<< "$latest")"
          run_conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<< "$latest")"
          head_sha="$(jq -r '.workflow_runs[0].head_sha // empty' <<< "$latest")"
          if [[ -z "$run_id" || -z "$head_sha" ]]; then
            echo 'No usable Windows installer workflow run exists yet.' >&2
            exit 1
          fi

          artifact_name="omniphony-windows-setup-$head_sha"
          {
            echo "RUN_ID=$run_id"
            echo "RUN_STATUS=$run_status"
            echo "RUN_CONCLUSION=$run_conclusion"
            echo "HEAD_SHA=$head_sha"
            echo "ARTIFACT_NAME=$artifact_name"
          } >> "$GITHUB_ENV"

          printf 'installer run=%s status=%s conclusion=%s sha=%s event=%s\n' \
            "$run_id" "$run_status" "$run_conclusion" "$head_sha" "$GITHUB_EVENT_NAME"

      - name: Record installer run locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          path='builds/windows-current-build.json'
          mkdir -p /tmp/omniphony-build

          jq -n \
            --arg schema 'omniphony.windows.current-build.v1' \
            --argjson run_id "$RUN_ID" \
            --arg status "$RUN_STATUS" \
            --arg conclusion "$RUN_CONCLUSION" \
            --arg head_sha "$HEAD_SHA" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg release_tag 'windows-current' \
            --arg asset_name 'OmniphonySetup.exe' \
            '{Schema:$schema,RunId:$run_id,Status:$status,Conclusion:$conclusion,HeadSha:$head_sha,ArtifactName:$artifact_name,ReleaseTag:$release_tag,AssetName:$asset_name}' \
            > /tmp/omniphony-build/record.json

          encoded="$(base64 -w0 /tmp/omniphony-build/record.json)"
          existing="$(gh api "repos/$repo/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            jq -n --arg message 'build(windows): record installer workflow state' --arg content "$encoded" --arg sha "$existing" --arg branch 'main' \
              '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/omniphony-build/payload.json
          else
            jq -n --arg message 'build(windows): record installer workflow state' --arg content "$encoded" --arg branch 'main' \
              '{message:$message,content:$content,branch:$branch}' > /tmp/omniphony-build/payload.json
          fi
          gh api --method PUT "repos/$repo/contents/$path" --input /tmp/omniphony-build/payload.json > /dev/null

      - name: Download successful installer artifact
        if: env.RUN_STATUS == 'completed' && env.RUN_CONCLUSION == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist
          test -f dist/OmniphonySetup.exe
          exe_sha="$(sha256sum dist/OmniphonySetup.exe | awk '{print $1}')"
          echo "EXE_SHA256=$exe_sha" >> "$GITHUB_ENV"
          ls -l dist/OmniphonySetup.exe
          echo "OmniphonySetup.exe sha256=$exe_sha"

      - name: Publish rolling installer release
        if: env.RUN_STATUS == 'completed' && env.RUN_CONCLUSION == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          notes="Rolling Omniphony for Windows 0.1 tray-only installer.\n\nBuilt from $HEAD_SHA after the Current renderer and APO validation suite passed.\n\nSHA-256: $EXE_SHA256"

          if gh release view windows-current --repo "$repo" >/dev/null 2>&1; then
            gh release upload windows-current dist/OmniphonySetup.exe --repo "$repo" --clobber
            gh release edit windows-current --repo "$repo" \
              --title 'Omniphony for Windows 0.1 - Current' \
              --notes "$notes"
          else
            gh release create windows-current dist/OmniphonySetup.exe --repo "$repo" \
              --target "$HEAD_SHA" \
              --title 'Omniphony for Windows 0.1 - Current' \
              --notes "$notes" \
              --prerelease
          fi

      - name: Record published installer
        if: env.RUN_STATUS == 'completed' && env.RUN_CONCLUSION == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          path='builds/windows-current-build.json'
          direct_url="https://github.com/$repo/releases/download/windows-current/OmniphonySetup.exe"
          mkdir -p /tmp/omniphony-published

          jq -n \
            --arg schema 'omniphony.windows.current-build.v1' \
            --argjson run_id "$RUN_ID" \
            --arg status 'published' \
            --arg conclusion 'success' \
            --arg head_sha "$HEAD_SHA" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg release_tag 'windows-current' \
            --arg asset_name 'OmniphonySetup.exe' \
            --arg exe_sha256 "$EXE_SHA256" \
            --arg direct_url "$direct_url" \
            '{Schema:$schema,RunId:$run_id,Status:$status,Conclusion:$conclusion,HeadSha:$head_sha,ArtifactName:$artifact_name,ReleaseTag:$release_tag,AssetName:$asset_name,ExeSha256:$exe_sha256,DirectUrl:$direct_url}' \
            > /tmp/omniphony-published/record.json

          encoded="$(base64 -w0 /tmp/omniphony-published/record.json)"
          existing="$(gh api "repos/$repo/contents/$path?ref=main" --jq '.sha')"
          jq -n --arg message 'build(windows): publish current installer locator' --arg content "$encoded" --arg sha "$existing" --arg branch 'main' \
            '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/omniphony-published/payload.json
          gh api --method PUT "repos/$repo/contents/$path" --input /tmp/omniphony-published/payload.json > /dev/null
