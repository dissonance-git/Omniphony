name: Dispatch corrected Windows installer once

on:
  workflow_run:
    workflows: ['Omniphony for Windows installer']
    types: [completed]

permissions:
  actions: write
  contents: write

jobs:
  dispatch-corrected:
    if: ${{ github.event.workflow_run.head_sha == '971b510de016b0bbf55fabe670e4c5b155c0fe2d' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove one-shot bridge from main
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/dispatch-corrected-windows-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove corrected Windows dispatch bridge'
          git push origin HEAD:main

      - name: Dispatch installer from clean corrected main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run windows-installer.yml --ref main --repo "${{ github.repository }}"
