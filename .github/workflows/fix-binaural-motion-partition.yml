name: Fix direct-binaural motion partitioning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-binaural-motion-partition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup override set 1.88.0
        working-directory: omniphony-renderer

      - name: Apply callback-invariant motion fix
        run: python3 .github/ci/fix_binaural_motion_partition.py

      - name: Format touched Rust files
        run: |
          rustfmt --edition 2024 \
            omniphony-renderer/renderer/src/spatial_renderer/mod.rs \
            omniphony-renderer/renderer/src/spatial_renderer/construction.rs \
            omniphony-renderer/renderer/src/binaural/mod.rs \
            omniphony-renderer/dsp_fixtures/src/binaural_block_size.rs

      - name: Verify patch scope
        run: |
          git diff --check
          git diff --stat
          test "$(git diff --name-only | wc -l)" -eq 4
          git diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          omniphony-renderer/dsp_fixtures/src/binaural_block_size.rs
          omniphony-renderer/renderer/src/binaural/mod.rs
          omniphony-renderer/renderer/src/spatial_renderer/construction.rs
          omniphony-renderer/renderer/src/spatial_renderer/mod.rs
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Run callback-partition contracts
        id: focused
        shell: bash
        run: |
          set +e
          cargo test -p dsp_fixtures binaural_block_size:: -- --nocapture 2>&1 | tee /tmp/binaural-motion.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: omniphony-renderer

      - name: Record focused failure breadcrumb
        if: steps.focused.outputs.status != '0'
        run: |
          {
            echo "BINAURAL_MOTION_PARTITION_FAILURE"
            echo "head=${GITHUB_SHA}"
            echo
            tail -n 320 /tmp/binaural-motion.log
          } > .github/ci/binaural-motion-partition-failure.txt
          git config user.name "omniphony-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/ci/binaural-motion-partition-failure.txt
          git commit -m "ci: record binaural motion partition failure"
          git push origin HEAD:main

      - name: Stop after focused failure
        if: steps.focused.outputs.status != '0'
        run: exit 1

      - name: Test convolver continuity
        run: cargo test -p renderer binaural::convolver::tests:: -- --nocapture
        working-directory: omniphony-renderer

      - name: Test renderer core
        run: >-
          cargo test -p renderer --
          --skip binaural::tests::hrir_source_switch_lands_asynchronously_without_blocking_render
        working-directory: omniphony-renderer

      - name: Test full DSP fixture suite
        run: cargo test -p dsp_fixtures
        working-directory: omniphony-renderer

      - name: Test native Current realtime ABI
        run: cargo test -p realtime_ffi
        working-directory: omniphony-renderer

      - name: Compile release performance gates
        run: cargo check --release -p renderer --features perf-gate --tests
        working-directory: omniphony-renderer

      - name: Publish validated fix
        run: |
          git config user.name "omniphony-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            omniphony-renderer/renderer/src/spatial_renderer/mod.rs \
            omniphony-renderer/renderer/src/spatial_renderer/construction.rs \
            omniphony-renderer/renderer/src/binaural/mod.rs \
            omniphony-renderer/dsp_fixtures/src/binaural_block_size.rs
          git commit -m "fix(binaural): make moving HRTFs callback-partition invariant"
          git push origin HEAD:main
