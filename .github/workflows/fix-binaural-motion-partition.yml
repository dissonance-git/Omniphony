name: Integrate useful upstream renderer mechanisms

on:
  schedule:
    - cron: '28 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether integration already landed
        id: guard
        shell: bash
        run: |
          if test -f omniphony-renderer/orender_engine/src/channel_objects.rs; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply upstream shared channel-object stage
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "omniphony-ci"
          git config user.email "actions@users.noreply.github.com"
          git fetch --no-tags https://github.com/mgth/Omniphony.git ec9a8e3aa5890dae4469a381bf69fce1e7c6ff5a
          if ! git cherry-pick --no-commit FETCH_HEAD; then
            {
              echo "UPSTREAM_CHANNEL_OBJECT_CHERRY_PICK_FAILED"
              echo "head=${GITHUB_SHA}"
              echo
              git status --short
              echo
              git diff --name-only --diff-filter=U
            } > /tmp/upstream-sync-failure.txt
            git cherry-pick --abort || true
            cp /tmp/upstream-sync-failure.txt ci-diagnostics/upstream-renderer-sync-failure.txt
            git add ci-diagnostics/upstream-renderer-sync-failure.txt
            git commit -m "ci: record upstream renderer sync conflict"
            git push origin HEAD:main
            exit 1
          fi

      - name: Finish renderer-owned host geometry
        if: steps.guard.outputs.skip != 'true'
        run: python3 .github/ci/upstream_renderer_sync.py

      - name: Verify and publish source integration
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f omniphony-renderer/orender_engine/src/channel_objects.rs
          grep -q 'ChannelObjectStages' omniphony-renderer/orender_engine/src/channel_objects.rs
          grep -q 'channel_objects: orender_engine::channel_objects::ChannelObjectStages' omniphony-renderer/src/cli/decode/state.rs
          grep -q 'renderer.output_channel_count()' omniphony-renderer/src/cli/decode/handler.rs
          grep -q 'let output_channels = rendered.n_channels;' omniphony-renderer/src/cli/decode/sample_write.rs
          git rm -f .github/workflows/upstream-renderer-good-sync.yml .github/ci/upstream_renderer_sync.py || true
          git add -A
          git commit -m "renderer: unify channel object staging across hosts"
          git push origin HEAD:main
