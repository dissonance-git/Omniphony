name: Windows APO dependency audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-apo-dependency-audit.yml'
      - 'omniphony-renderer/.cargo/**'
      - 'omniphony-renderer/realtime_ffi/**'
      - 'omniphony-renderer/orender_engine/**'
      - 'omniphony-renderer/renderer/**'
      - 'omniphony-renderer/reference_bridge/**'
      - 'omniphony-renderer/bridge_api/**'
      - 'omniphony-renderer/Cargo.toml'
      - 'omniphony-renderer/Cargo.lock'
      - 'omniphony-renderer/windows_installer/endpoint_apo/**'

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.88.0

jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate production APO package isolation contract
        shell: pwsh
        run: python omniphony-renderer/windows_installer/endpoint_apo/production/check_package_contract.py

      - name: Test production extension generator
        shell: pwsh
        run: python -m unittest discover -s omniphony-renderer/windows_installer/endpoint_apo/production -p 'test_*.py' -v

      - name: Parse production PowerShell tooling
        shell: pwsh
        run: |
          $paths = @(
            'omniphony-renderer/windows_installer/endpoint_apo/production/Capture-TargetAudioDriver.ps1',
            'omniphony-renderer/windows_installer/endpoint_apo/production/Build-ProductionApoPackages.ps1',
            'omniphony-renderer/windows_installer/endpoint_apo/production/Install-ProductionApoPackages.ps1',
            'omniphony-renderer/windows_installer/endpoint_apo/production/Uninstall-ProductionApoPackages.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }
              throw "$path has $($errors.Count) PowerShell parse error(s)"
            }
            Write-Host "PRODUCTION_POWERSHELL_PARSE_OK $path"
          }

      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          Set-Location "$env:GITHUB_WORKSPACE\omniphony-renderer"
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Ensure Windows 11 WDK
        shell: pwsh
        run: |
          choco install windowsdriverkit11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "WDK installation failed: $LASTEXITCODE" }

      - name: Generate synthetic production extension INF
        shell: pwsh
        run: |
          $production = 'omniphony-renderer/windows_installer/endpoint_apo/production'
          $capture = Join-Path $production 'testdata/target-audio-synthetic.json'
          $extensionInf = Join-Path $env:RUNNER_TEMP 'OmniphonyApoExtension.inf'
          python (Join-Path $production 'generate_extension_inf.py') $capture $extensionInf
          if ($LASTEXITCODE -ne 0) { throw "production extension generation failed: $LASTEXITCODE" }
          if (-not (Test-Path $extensionInf)) { throw 'production extension generator produced no INF' }
          Write-Host "PRODUCTION_EXTENSION_SYNTHETIC_OK $extensionInf"

      - name: Verify production APO INFs with InfVerif
        shell: pwsh
        run: |
          $source = 'omniphony-renderer/windows_installer/endpoint_apo/production/OmniphonyApoComponent.inx'
          $componentInf = Join-Path $env:RUNNER_TEMP 'OmniphonyApoComponent.inf'
          $extensionInf = Join-Path $env:RUNNER_TEMP 'OmniphonyApoExtension.inf'
          Copy-Item $source $componentInf -Force
          if (-not (Test-Path $extensionInf)) { throw 'generated production extension INF is missing' }

          $kitsRoot = 'C:\Program Files (x86)\Windows Kits\10'
          $infverif = Get-ChildItem $kitsRoot -Recurse -Filter 'InfVerif.exe' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\InfVerif\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 |
            ForEach-Object FullName
          if (-not $infverif) { throw 'x64 InfVerif.exe not found in Windows Kits' }
          Write-Host "InfVerif=$infverif"

          foreach ($inf in @($componentInf, $extensionInf)) {
            Write-Host "INFVERIF_TARGET $inf"
            & $infverif /w /v $inf
            if ($LASTEXITCODE -ne 0) { throw "production INF failed InfVerif /w: $inf exit=$LASTEXITCODE" }
          }
          Write-Host 'PRODUCTION_APO_INFVERIF_OK 1'

      - name: Build AudioDG runtime binaries
        shell: pwsh
        run: |
          cmake -S omniphony-renderer/windows_installer/endpoint_apo -B build/apo -A x64
          if ($LASTEXITCODE -ne 0) { throw "APO CMake configure failed: $LASTEXITCODE" }
          cmake --build build/apo --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "APO build failed: $LASTEXITCODE" }

          Set-Location "$env:GITHUB_WORKSPACE\omniphony-renderer"
          cargo build --release -p realtime_ffi
          if ($LASTEXITCODE -ne 0) { throw "realtime_ffi release build failed: $LASTEXITCODE" }
          if (-not (Test-Path 'target/release/omniphony_realtime.dll')) {
            throw 'realtime_ffi did not produce target/release/omniphony_realtime.dll'
          }

      - name: Build synthetic DriverStore packages and catalogs
        shell: pwsh
        run: |
          $production = 'omniphony-renderer/windows_installer/endpoint_apo/production'
          $capture = Join-Path $production 'testdata/target-audio-synthetic.json'
          $apo = (Resolve-Path 'build/apo/Release/OmniphonyAPO.dll').Path
          $realtime = (Resolve-Path 'omniphony-renderer/target/release/omniphony_realtime.dll').Path
          $output = Join-Path $env:RUNNER_TEMP 'omniphony-production-package-ci'
          & (Join-Path $production 'Build-ProductionApoPackages.ps1') `
            -CaptureJson $capture `
            -ApoDll $apo `
            -RealtimeDll $realtime `
            -OutputRoot $output `
            -Inf2CatOs '10_CO_X64,10_NI_X64'
          if ($LASTEXITCODE -ne 0) { throw "production package staging failed: $LASTEXITCODE" }

          foreach ($required in @(
            'component/OmniphonyApoComponent.inf',
            'component/OmniphonyApo.cat',
            'component/OmniphonyAPO.dll',
            'component/omniphony_realtime.dll',
            'extension/OmniphonyApoExtension.inf',
            'extension/OmniphonyApoExtension.cat',
            'package-manifest.json'
          )) {
            $path = Join-Path $output $required
            if (-not (Test-Path $path -PathType Leaf)) { throw "production package missing: $required" }
          }
          Write-Host 'PRODUCTION_PACKAGE_CATALOG_BUILD_OK 1'

      - name: Audit AudioDG import tables
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          $dumpbin = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Recurse -Filter dumpbin.exe -File |
            Where-Object { $_.FullName -match '\\Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }

          $binaries = @(
            (Resolve-Path 'build/apo/Release/OmniphonyAPO.dll').Path,
            (Resolve-Path 'omniphony-renderer/target/release/omniphony_realtime.dll').Path
          )
          $forbidden = @(
            'AudioBaseProcessingObject.dll',
            'VCRUNTIME140.dll',
            'VCRUNTIME140_1.dll',
            'MSVCP140.dll'
          )
          foreach ($dll in $binaries) {
            Write-Host "AUDIT_BINARY $dll"
            $deps = (& $dumpbin.FullName /DEPENDENTS $dll 2>&1 | Out-String)
            Write-Host $deps
            foreach ($name in $forbidden) {
              if ($deps -match [regex]::Escape($name)) {
                throw "AudioDG binary $dll has external VC runtime dependency: $name"
              }
            }
          }
          Write-Host 'AUDIODG_DEPENDENCY_AUDIT_OK 1'
