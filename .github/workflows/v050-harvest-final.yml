name: v0.5 renderer harvest final

on:
  push:
    paths:
      - '.github/workflows/v050-harvest-final.yml'

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust
        working-directory: omniphony-renderer
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0

      - name: Apply remaining v0.5 renderer gains
        run: |
          python .github/scripts/v050_harvest_final.py
          git diff --check

      - name: Focused renderer validation
        working-directory: omniphony-renderer
        run: |
          cargo test -p renderer delay_line::tests::bypass_history_matches_full_processing_when_delay_turns_on
          cargo test -p renderer spatial_renderer::tests::interp_survives_speaker_cascade_width_switch
          cargo test -p dsp_fixtures repeated_synthetic_binaural_fixture_is_deterministic
          cargo test -p renderer binaural::validation::itd_is_antisymmetric_about_the_median_plane -- --nocapture
          cargo test -p renderer spatial_renderer::golden_tests -- --nocapture

      - name: Commit validated harvest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add omniphony-renderer/renderer/src/delay_line.rs \
                  omniphony-renderer/renderer/src/binaural/mod.rs \
                  omniphony-renderer/renderer/src/spatial_renderer/mod.rs \
                  omniphony-renderer/renderer/src/spatial_renderer/speaker_stage.rs \
                  omniphony-renderer/renderer/src/spatial_renderer/tests.rs \
                  omniphony-renderer/dsp_fixtures/src/scene.rs
          git commit -m 'perf(renderer): finish v0.5 validation and output gains'
          git push origin HEAD:main
