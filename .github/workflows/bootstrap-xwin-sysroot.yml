name: Bootstrap xwin sysroots

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-xwin-sysroot.yml'

jobs:
  sysroot:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify xwin
        shell: bash
        run: |
          set -euo pipefail
          version=0.10.0
          prefix="xwin-${version}-x86_64-unknown-linux-musl"
          url="https://github.com/Jake-Shadle/xwin/releases/download/${version}/${prefix}.tar.gz"
          curl --fail --location --retry 4 "$url" -o xwin.tar.gz
          echo 'd870eb4b2f390878af6da1ccd3cf321d22fcb72720984853b4be732ae597fc88  xwin.tar.gz' | sha256sum -c -
          tar -xzf xwin.tar.gz
          "${prefix}/xwin" --version
          echo "XWIN=$PWD/${prefix}/xwin" >> "$GITHUB_ENV"

      - name: Build x64 clang-cl winsysroot
        shell: bash
        run: |
          set -euo pipefail
          "$XWIN" --accept-license --cache-dir "$PWD/.xwin-cache" --arch x86_64 \
            splat --use-winsysroot-style --preserve-ms-arch-notation \
            --output "$PWD/winsysroot-x64"
          test -f winsysroot-x64/VC/Tools/MSVC/*/lib/x64/libcmt.lib
          test -f winsysroot-x64/Windows\ Kits/10/Lib/*/um/x64/kernel32.lib
          du -sh winsysroot-x64

      - name: Build x86 clang-cl winsysroot
        shell: bash
        run: |
          set -euo pipefail
          "$XWIN" --accept-license --cache-dir "$PWD/.xwin-cache" --arch x86 \
            splat --use-winsysroot-style --preserve-ms-arch-notation \
            --output "$PWD/winsysroot-x86"
          test -f winsysroot-x86/VC/Tools/MSVC/*/lib/x86/libcmt.lib
          test -f winsysroot-x86/Windows\ Kits/10/Lib/*/um/x86/kernel32.lib
          du -sh winsysroot-x86

      - name: Install portable NASM helper
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nasm
          mkdir -p linux-tools
          cp "$(command -v nasm)" linux-tools/nasm
          nasm -v

      - name: Upload x64 winsysroot
        uses: actions/upload-artifact@v4
        with:
          name: xwin-winsysroot-x64
          path: winsysroot-x64/
          compression-level: 6
          retention-days: 1
          if-no-files-found: error

      - name: Upload x86 winsysroot
        uses: actions/upload-artifact@v4
        with:
          name: xwin-winsysroot-x86
          path: winsysroot-x86/
          compression-level: 6
          retention-days: 1
          if-no-files-found: error

      - name: Upload NASM helper
        uses: actions/upload-artifact@v4
        with:
          name: nasm-linux-x64
          path: linux-tools/nasm
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
