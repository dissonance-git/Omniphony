name: Port Current-shell full-sphere validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/port-current-shell-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup override set 1.88.0
        working-directory: omniphony-renderer

      - name: Add Current-shell validation
        run: python3 .github/ci/port_current_shell_validation.py

      - name: Format touched validation module
        run: rustfmt --edition 2024 omniphony-renderer/renderer/src/spatial_vbap/panner/native_validation.rs

      - name: Verify patch scope
        run: |
          git diff --check
          git diff --stat
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "omniphony-renderer/renderer/src/spatial_vbap/panner/native_validation.rs"

      - name: Run Current-shell focused gates
        id: focused
        shell: bash
        run: |
          set +e
          cargo test -p renderer current_headphone_shell_ -- --nocapture 2>&1 | tee /tmp/current-shell.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: omniphony-renderer

      - name: Record focused failure breadcrumb
        if: steps.focused.outputs.status != '0'
        run: |
          {
            echo "CURRENT_SHELL_FOCUSED_FAILURE"
            echo "head=${GITHUB_SHA}"
            echo
            tail -n 260 /tmp/current-shell.log
          } > .github/ci/current-shell-validation-failure.txt
          git config user.name "omniphony-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/ci/current-shell-validation-failure.txt
          git commit -m "ci: record Current-shell validation failure"
          git push origin HEAD:main

      - name: Stop after focused failure
        if: steps.focused.outputs.status != '0'
        run: exit 1

      - name: Re-run native VBAP validation module
        id: native
        shell: bash
        run: |
          set +e
          cargo test -p renderer spatial_vbap::panner::native_validation:: -- --nocapture 2>&1 | tee /tmp/current-shell-native.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: omniphony-renderer

      - name: Record native-suite failure breadcrumb
        if: steps.native.outputs.status != '0'
        run: |
          {
            echo "CURRENT_SHELL_NATIVE_SUITE_FAILURE"
            echo "head=${GITHUB_SHA}"
            echo
            tail -n 260 /tmp/current-shell-native.log
          } > .github/ci/current-shell-validation-failure.txt
          git config user.name "omniphony-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/ci/current-shell-validation-failure.txt
          git commit -m "ci: record Current-shell native-suite failure"
          git push origin HEAD:main

      - name: Stop after native-suite failure
        if: steps.native.outputs.status != '0'
        run: exit 1

      - name: Run DSP fixtures
        run: cargo test -p dsp_fixtures
        working-directory: omniphony-renderer

      - name: Publish validated product-geometry gates
        run: |
          git config user.name "omniphony-ci"
          git config user.email "actions@users.noreply.github.com"
          git add omniphony-renderer/renderer/src/spatial_vbap/panner/native_validation.rs
          git commit -m "test(dsp): validate Current 22-direction shell over full sphere"
          git push origin HEAD:main
