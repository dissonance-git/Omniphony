name: One-shot stream reset stabilization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-stream-reset-stabilization.yml

permissions:
  contents: write

concurrency:
  group: oneshot-stream-reset-stabilization
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Apply bounded stream-lifetime reset patch
        shell: python
        run: |
          from pathlib import Path

          root = Path("omniphony-renderer")
          delay = root / "renderer/src/delay_line.rs"
          conv = root / "renderer/src/binaural/convolver.rs"
          refl = root / "renderer/src/binaural/reflections.rs"
          reverb = root / "renderer/src/binaural/reverb.rs"
          binaural = root / "renderer/src/binaural/mod.rs"
          components = root / "renderer/src/spatial_renderer/components.rs"
          spatial = root / "renderer/src/spatial_renderer/mod.rs"
          fixture_lib = root / "dsp_fixtures/src/lib.rs"
          reset_fixture = root / "dsp_fixtures/src/stream_reset.rs"

          def replace_exact(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one source fragment, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"patched {label}")

          def insert_before(path: Path, marker: str, addition: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one marker, found {count}")
              path.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")
              print(f"patched {label}")

          # DelayLine: zero history and timing state without freeing its fixed ring.
          marker = "    /// Process one sample through the delay line.\n"
          addition = '''    /// Reset stream-lifetime history in place. Capacity is retained so a\n    /// decoder seek/track restart cannot leak old delayed samples into the new\n    /// stream and does not allocate or free on the realtime thread.\n    pub fn reset_runtime_state(&mut self) {\n        self.buf.fill(0.0);\n        self.write_pos = 0;\n        self.current = 0.0;\n        self.target = 0.0;\n    }\n\n'''
          insert_before(delay, marker, addition, "DelayLine in-place reset")

          # EarConvolver: history and transfer transition are stream state; arrays stay allocated.
          marker = "    /// Push one input sample and return the filtered output.\n"
          addition = '''    /// Reset stream-lifetime FIR history without reallocating. The next HRIR\n    /// installation is treated as the first transfer function of the new stream,\n    /// so it installs immediately rather than crossfading from stale geometry.\n    pub fn reset_runtime_state(&mut self) {\n        self.hist.fill(0.0);\n        self.pos = 0;\n        self.coeffs.fill(0.0);\n        self.prev_coeffs.fill(0.0);\n        self.initialized = false;\n        self.fade_pos = 0;\n        self.fade_len = 0;\n    }\n\n'''
          insert_before(conv, marker, addition, "EarConvolver in-place reset")

          # Early reflections: preserve the ring allocation, remove old acoustic energy/targets.
          marker = "    /// Write one input sample and return the summed (left, right) reflection\n"
          addition = '''    /// Reset one logical stream while retaining the preallocated reflection ring.\n    pub fn reset_runtime_state(&mut self) {\n        self.ring.fill(0.0);\n        self.write_pos = 0;\n        self.taps_l = Default::default();\n        self.taps_r = Default::default();\n    }\n\n'''
          insert_before(refl, marker, addition, "ReflectionBank in-place reset")

          # FDN: clear stored acoustic energy but retain line/predelay allocations and room params.
          marker = "    /// Start the next fixed-length modulation segment. This is called by sample\n"
          addition = '''    /// Reset stored acoustic history at a discontinuous stream boundary while\n    /// retaining all delay-line allocations and the currently configured room.\n    pub fn reset_runtime_state(&mut self) {\n        for line in &mut self.lines {\n            line.fill(0.0);\n        }\n        self.pos = [0; N];\n        self.damp_state = [0.0; N];\n        self.cur_delay = self.base_len;\n        self.mod_step = [0.0; N];\n        self.mod_samples_left = 0;\n        self.xover_state = Default::default();\n        self.predelay.fill(0.0);\n        self.pre_pos = 0;\n    }\n\n'''
          insert_before(reverb, marker, addition, "FDN in-place reset")

          # ChannelState: reset semantic/audio state while keeping interpolation scratch capacity.
          marker = "    /// Advance the gain slew by one block toward `target`; returns the\n"
          addition = '''    pub(super) fn reset_runtime_state(&mut self) {\n        self.initialized = false;\n        self.gain_db = -128;\n        self.slewed_gain = 0.0;\n        self.ramp = ChannelRampState::default();\n        self.interp_prev_gains.clear();\n    }\n\n'''
          insert_before(components, marker, addition, "ChannelState in-place reset")

          # Binaural per-channel state reset. Keep HRIR provider/grid and worker alive.
          marker = "/// Tagged result from the asynchronous HRIR worker.\n"
          addition = '''impl ChannelDsp {\n    fn reset_runtime_state(&mut self) {\n        self.delay_l.reset_runtime_state();\n        self.delay_r.reset_runtime_state();\n        self.conv_l.reset_runtime_state();\n        self.conv_r.reset_runtime_state();\n        if let Some(bank) = self.refl.as_mut() {\n            bank.reset_runtime_state();\n        }\n        self.air_state = 0.0;\n        self.air_coeff = 0.0;\n    }\n}\n\n'''
          insert_before(binaural, marker, addition, "ChannelDsp in-place reset")

          marker = "    /// Identity of the active HRIR grid (tests observe the async swap with it).\n"
          addition = '''    /// Reset one discontinuous audio stream while preserving expensive immutable\n    /// configuration: the selected HRIR grid and rebuild worker remain alive,\n    /// while every sample-history state is cleared in place.\n    pub fn reset_runtime_state(&mut self) {\n        for channel in &mut self.channels {\n            if let Some(dsp) = channel.as_mut() {\n                dsp.reset_runtime_state();\n            }\n        }\n        self.channel_gain_boundary.fill(0.0);\n        if let Some(fdn) = self.fdn.as_mut() {\n            fdn.reset_runtime_state();\n        }\n        self.reverb_bus.fill(0.0);\n    }\n\n'''
          insert_before(binaural, marker, addition, "BinauralRenderer stream reset")

          # SpatialRenderer reset request: zero all stream history in place on the render thread.
          old = '''        if self\n            .reset_requested\n            .swap(false, std::sync::atomic::Ordering::Acquire)\n        {\n            self.channel_states.clear();\n        }\n'''
          new = '''        if self\n            .reset_requested\n            .swap(false, std::sync::atomic::Ordering::Acquire)\n        {\n            // A new logical stream owns a new audio history. Preserve allocated\n            // storage/configuration, but clear every state that can contain old\n            // samples or an old trajectory. This keeps reset bounded and avoids\n            // allocator work in the realtime callback.\n            for state in &mut self.channel_states {\n                state.reset_runtime_state();\n            }\n            for delay in &mut self.delay_lines {\n                delay.reset_runtime_state();\n            }\n            for slot in &mut self.crossover_filter_states {\n                if let Some(states) = slot.as_mut() {\n                    for state in states {\n                        *state = BiquadState::default();\n                    }\n                }\n            }\n            self.binaural.reset_runtime_state();\n        }\n'''
          replace_exact(spatial, old, new, "whole-renderer stream reset")

          # Reset per-stream dialnorm atomically when the discontinuity is requested.
          old = '''    pub fn reset_runtime_state(&self) {\n        self.reset_requested\n            .store(true, std::sync::atomic::Ordering::Release);\n        self.first_render\n            .store(true, std::sync::atomic::Ordering::Relaxed);\n    }\n'''
          new = '''    pub fn reset_runtime_state(&self) {\n        // Dialogue normalization belongs to the old stream unless the new one\n        // explicitly publishes its own value. Keep session-level master/auto-gain\n        // policy, but return per-stream loudness correction to neutral immediately.\n        self.loudness_gain\n            .store(1.0f32.to_bits(), std::sync::atomic::Ordering::Relaxed);\n        self.reset_requested\n            .store(true, std::sync::atomic::Ordering::Release);\n        self.first_render\n            .store(true, std::sync::atomic::Ordering::Relaxed);\n    }\n'''
          replace_exact(spatial, old, new, "per-stream loudness reset")

          # Activate an end-to-end regression that leaves direct/room history hot,
          # resets the logical stream, then makes a new silent-but-active channel.
          lib_text = fixture_lib.read_text(encoding="utf-8")
          marker = "pub mod scene;\n"
          if lib_text.count(marker) != 1:
              raise SystemExit("fixture module marker changed")
          fixture_lib.write_text(lib_text.replace(marker, marker + "pub mod stream_reset;\n", 1), encoding="utf-8")

          if reset_fixture.exists():
              raise SystemExit("stream_reset fixture already exists")
          reset_fixture.write_text(r'''//! Always-on stream-boundary fidelity regressions.\n//!\n//! A decoder seek, track change or explicit stream restart is a discontinuity in\n//! the canonical audio timeline. Old FIR/delay/reflection/reverb energy must not\n//! leak into the first samples of the next stream, but immutable renderer/HRTF\n//! configuration should stay warm.\n\nuse crate::scene::{SAMPLE_RATE, build_renderer_binaural, pseudo};\nuse renderer::live_params::{OutputMode, RampMode};\nuse renderer::spatial_renderer::SpatialChannelEvent;\nuse renderer::speaker_layout::SpeakerLayout;\n\nfn object_event() -> SpatialChannelEvent {\n    SpatialChannelEvent {\n        channel_idx: 0,\n        is_bed: false,\n        gain_db: Some(0),\n        ramp_length: Some(0),\n        size: Some([0.0, 0.0, 0.0]),\n        position: Some([0.55, 0.82, 0.18]),\n        sample_pos: Some(0),\n    }\n}\n\n#[test]\nfn stream_reset_clears_previous_binaural_audio_history() {\n    let mut renderer = build_renderer_binaural(\n        SpeakerLayout::preset("7.1.4").expect("known preset"),\n        true,\n        false,\n    );\n    {\n        let control = renderer.renderer_control();\n        control.set_requested_ramp_mode(RampMode::Sample);\n        let mut live = control.live.write();\n        live.ramp_mode = RampMode::Sample;\n        live.binaural.output_mode = OutputMode::Binaural;\n        live.binaural.reflections.enabled = true;\n        live.binaural.reflections.level = 0.7;\n        live.binaural.reverb.enabled = true;\n        live.binaural.reverb.level = 0.5;\n        live.binaural.reverb.rt60_s = 0.6;\n        live.binaural.reverb.predelay_ms = 0.0;\n    }\n\n    let event = object_event();\n    let block = 128usize;\n    let total = 2_560usize;\n    let mut reuse = Vec::new();\n    for start in (0..total).step_by(block) {\n        let pcm: Vec<f32> = (0..block)\n            .map(|s| pseudo((50_000 + start + s) as u64) * 0.35)\n            .collect();\n        let events: &[SpatialChannelEvent] = if start == 0 {\n            std::slice::from_ref(&event)\n        } else {\n            &[]\n        };\n        let frame = renderer\n            .render_frame(&pcm, 1, events, reuse, false)\n            .expect("fill direct and room history");\n        reuse = frame.samples;\n        reuse.clear();\n    }\n\n    renderer.reset_runtime_state();\n\n    // Keep the new stream's channel logically active while feeding exact silence.\n    // Without a whole-pipeline reset, old FIR/ITD/reflection/FDN history can leak\n    // into this buffer even though the new PCM contains no energy.\n    let silence = vec![0.0f32; 1_024];\n    let frame = renderer\n        .render_frame(\n            &silence,\n            1,\n            std::slice::from_ref(&event),\n            reuse,\n            false,\n        )\n        .expect("render first silent block of new stream");\n\n    let peak = frame\n        .samples\n        .iter()\n        .fold(0.0f32, |m, &x| m.max(x.abs()));\n    eprintln!("post-reset stale-history peak={peak:.9}");\n    assert!(\n        peak <= 1.0e-8,\n        "old audio history leaked across stream reset: peak={peak:.9}"\n    );\n    assert_eq!(SAMPLE_RATE, 48_000);\n}\n''', encoding="utf-8")
          print("created stream reset end-to-end fixture")

      - name: Format patched Rust
        working-directory: omniphony-renderer
        run: cargo fmt --all

      - name: Prove existing gain callback invariant
        working-directory: omniphony-renderer
        run: cargo test -p dsp_fixtures binaural_gain_is_invariant_to_host_block_size -- --nocapture

      - name: Test DSP measurement and always-on fixtures
        working-directory: omniphony-renderer
        run: cargo test -p dsp_fixtures -- --nocapture

      - name: Test renderer core
        working-directory: omniphony-renderer
        run: cargo test -p renderer

      - name: Validate patch cleanliness
        run: |
          git diff --check
          git diff --stat

      - name: Commit only after tests pass and head is still current
        shell: bash
        run: |
          base_sha=$(git rev-parse HEAD)
          git fetch origin main
          remote_sha=$(git rev-parse origin/main)
          if [ "$remote_sha" != "$base_sha" ]; then
            echo "main advanced from $base_sha to $remote_sha; refusing to push a stale realtime patch"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            omniphony-renderer/renderer/src/delay_line.rs \
            omniphony-renderer/renderer/src/binaural/convolver.rs \
            omniphony-renderer/renderer/src/binaural/reflections.rs \
            omniphony-renderer/renderer/src/binaural/reverb.rs \
            omniphony-renderer/renderer/src/binaural/mod.rs \
            omniphony-renderer/renderer/src/spatial_renderer/components.rs \
            omniphony-renderer/renderer/src/spatial_renderer/mod.rs \
            omniphony-renderer/dsp_fixtures/src/lib.rs \
            omniphony-renderer/dsp_fixtures/src/stream_reset.rs
          git diff --cached --quiet && { echo "no stabilization patch produced"; exit 1; }
          git commit -m "fix(rt): reset stream-lifetime DSP state in place"
          git push origin HEAD:main
