name: One-shot finalize output device recovery v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-finalize-device-recovery-v2.yml

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: 1.88.0

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"

      - name: Patch playback failure handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('omniphony-renderer/windows_host/src/music_worker_evidence.rs')
          s = p.read_text(encoding='utf-8')

          pairs = [
              (
                  '    let playback_underrun_frames = Arc::new(AtomicU64::new(0));\n    let (play_tx, play_rx) = sync_channel::<Vec<f32>>(PLAYBACK_QUEUE_BLOCKS);\n',
                  '    let playback_underrun_frames = Arc::new(AtomicU64::new(0));\n    let playback_failed = Arc::new(AtomicBool::new(false));\n    let (play_tx, play_rx) = sync_channel::<Vec<f32>>(PLAYBACK_QUEUE_BLOCKS);\n'
              ),
              (
                  '        play_rx,\n        Arc::clone(&playback_underrun_frames),\n    )?;\n',
                  '        play_rx,\n        Arc::clone(&playback_underrun_frames),\n        Arc::clone(&playback_failed),\n    )?;\n'
              ),
              (
                  '    while !quit.load(Ordering::Relaxed) {\n        let Some(input) = loopback.next_block()? else {\n',
                  '    while !quit.load(Ordering::Relaxed) {\n        if playback_failed.load(Ordering::Acquire) {\n            bail!("WASAPI playback stream failed; supervisor will restart the audio engine");\n        }\n        let Some(input) = loopback.next_block()? else {\n'
              ),
              (
                  '    rx: Receiver<Vec<f32>>,\n    underrun_frames: Arc<AtomicU64>,\n) -> anyhow::Result<cpal::Stream> {\n',
                  '    rx: Receiver<Vec<f32>>,\n    underrun_frames: Arc<AtomicU64>,\n    stream_failed: Arc<AtomicBool>,\n) -> anyhow::Result<cpal::Stream> {\n'
              ),
              (
                  '    rx: Receiver<Vec<f32>>,\n    underrun_frames: Arc<AtomicU64>,\n) -> anyhow::Result<cpal::Stream>\nwhere\n',
                  '    rx: Receiver<Vec<f32>>,\n    underrun_frames: Arc<AtomicU64>,\n    stream_failed: Arc<AtomicBool>,\n) -> anyhow::Result<cpal::Stream>\nwhere\n'
              ),
              (
                  '    let err_fn = |err| eprintln!("WASAPI playback stream error: {err}");\n',
                  '    let err_fn = move |err| {\n        eprintln!("WASAPI playback stream error: {err}");\n        stream_failed.store(true, Ordering::Release);\n    };\n'
              ),
          ]
          for old, new in pairs:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected exactly one source fragment, found {n}: {old[:80]!r}')
              s = s.replace(old, new, 1)

          for ty in ['i8','i16','i32','i64','u8','u16','u32','u64','f32','f64']:
              old = f'build_typed_playback::<{ty}>(device, config, rx, underrun_frames)'
              new = f'build_typed_playback::<{ty}>(device, config, rx, underrun_frames, Arc::clone(&stream_failed))'
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected one dispatch for {ty}, found {n}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Format source
        working-directory: omniphony-renderer
        run: cargo fmt --all

      - name: Commit recovery handoff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omniphony-renderer/windows_host/src/music_worker_evidence.rs
          git diff --cached --check
          git commit -m "fix(windows): restart after playback device failure"
          git push origin HEAD:main
