name: One-shot cymbal fatigue split

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(ci): stage cymbal fatigue split'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Split metallic edge from air support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('omniphony-renderer/renderer/src/music_field.rs')
          text = path.read_text()

          replacements = [
              (
                  'const CROSSOVER_HZ: [f32; 3] = [320.0, 1_200.0, 5_000.0];',
                  'const CROSSOVER_HZ: [f32; 4] = [320.0, 1_200.0, 5_000.0, 9_000.0];',
              ),
              (
                  '''/// Static top-band support trim. The previous candidate used instantaneous
/// sample-energy normalization, which is itself a gain-modulation mechanism.
/// A fixed scale cannot pump; slower scene controls own all audible movement.
const HIGH_BAND_SUPPORT_SCALE: f32 = 0.52;''',
                  '''/// Cascaded rendering can make cymbal edge and bright percussion accumulate
/// across several virtual speakers before HRTF filtering. Give the metallic
/// 5-9 kHz region its own smaller budget while retaining a little true upper
/// air above 9 kHz for openness and externalization. These are static scales:
/// no source-dependent gain riding and therefore no treble pumping.
const EDGE_SUPPORT_SCALE: f32 = 0.34;
const AIR_SUPPORT_SCALE: f32 = 0.46;''',
              ),
              ('const PRESENCE_SUPPORT_SCALE: f32 = 0.86;', 'const PRESENCE_SUPPORT_SCALE: f32 = 0.80;'),
              (
                  '''    low_5000: OnePoleLowPass,
}''',
                  '''    low_5000: OnePoleLowPass,
    low_9000: OnePoleLowPass,
}''',
              ),
              (
                  '''            low_5000: OnePoleLowPass::new(sample_rate_hz, CROSSOVER_HZ[2]),
        }''',
                  '''            low_5000: OnePoleLowPass::new(sample_rate_hz, CROSSOVER_HZ[2]),
            low_9000: OnePoleLowPass::new(sample_rate_hz, CROSSOVER_HZ[3]),
        }''',
              ),
              (
                  '''    /// The four outputs sum algebraically to `sample`: adjacent bands are
    /// differences of parallel low-pass states rather than independent filters.
    fn split(&mut self, sample: f32) -> [f32; 4] {
        let a = self.low_320.process(sample);
        let b = self.low_1200.process(sample);
        let c = self.low_5000.process(sample);
        [a, b - a, c - b, sample - c]
    }''',
                  '''    /// The five outputs sum algebraically to `sample`: adjacent bands are
    /// differences of parallel low-pass states rather than independent filters.
    fn split(&mut self, sample: f32) -> [f32; 5] {
        let a = self.low_320.process(sample);
        let b = self.low_1200.process(sample);
        let c = self.low_5000.process(sample);
        let d = self.low_9000.process(sample);
        [a, b - a, c - b, d - c, sample - d]
    }''',
              ),
              ('            for band in 1..4 {\n                let control = self.controls[band - 1];',
               '            for band in 1..5 {\n                // 5-9 kHz and >9 kHz share the same slowly moving analysis\n                // control; only their static support budgets differ.\n                let control = self.controls[if band >= 4 { 2 } else { band - 1 }];'),
              (
                  '''                } else if band == 3 {
                    HIGH_BAND_SUPPORT_SCALE
                } else {
                    1.0
                };''',
                  '''                } else if band == 3 {
                    EDGE_SUPPORT_SCALE
                } else if band == 4 {
                    AIR_SUPPORT_SCALE
                } else {
                    1.0
                };''',
              ),
              (
                  '''    fn high_band_trim_is_static() {
        assert!(HIGH_BAND_SUPPORT_SCALE > 0.0);
        assert!(HIGH_BAND_SUPPORT_SCALE <= 1.0);
        assert!(LOW_MID_SUPPORT_SCALE > 0.0);
        assert!(LOW_MID_SUPPORT_SCALE <= 1.0);
    }''',
                  '''    fn high_band_trim_is_static() {
        assert!(LOW_MID_SUPPORT_SCALE > 0.0);
        assert!(LOW_MID_SUPPORT_SCALE <= 1.0);
        assert!(PRESENCE_SUPPORT_SCALE > 0.0);
        assert!(PRESENCE_SUPPORT_SCALE <= 1.0);
        assert!(EDGE_SUPPORT_SCALE > 0.0);
        assert!(AIR_SUPPORT_SCALE > 0.0);
        assert!(EDGE_SUPPORT_SCALE < AIR_SUPPORT_SCALE);
        assert!(AIR_SUPPORT_SCALE < PRESENCE_SUPPORT_SCALE);
    }''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected source fragment:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          cargo fmt --manifest-path omniphony-renderer/Cargo.toml --all
          cd omniphony-renderer
          cargo test -p renderer music_field::tests

      - name: Commit fatigue-safe split and remove one-shot
        shell: bash
        run: |
          rm .github/workflows/oneshot-fatigue-edge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(audio): separate cymbal edge from upper air'
          git push
