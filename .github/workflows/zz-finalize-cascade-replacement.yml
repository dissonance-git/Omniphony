name: Finalize cascade replacement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove unrelated upstream demo backend registrations and tame support-only presence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          build = Path('omniphony-renderer/orender_engine/src/renderer_build.rs')
          text = build.read_text()
          text = '\n'.join(
              line for line in text.splitlines()
              if 'control.register_backend(Box::new(example_backend::ExampleFactory))' not in line
              and 'control.register_backend(Box::new(script_backend::ScriptFactory))' not in line
          ) + '\n'
          text = text.replace(
              '        // Register the demonstration backend so `backend_id = "example"` resolves.\n'
              '        // User-scriptable (Lua) backend; selecting `backend_id = "script"` routes\n'
              '        // a rebuild through it, reading its `.lua` path from the param store.\n'
              '        // Resolved after registration so any registered backend (not just the\n'
              '        // historical concrete ones) is accepted as a hybrid inner model; a nested\n'
              '        // hybrid or an unregistered id falls back to the default.\n',
              '        // This fork keeps the built-in/registered renderer frontier only.\n'
              '        // Cascaded binaural does not depend on upstream demo/script backends.\n'
              '        // A nested hybrid or an unregistered id falls back to the default.\n',
              1,
          )
          if 'example_backend::ExampleFactory' in text or 'script_backend::ScriptFactory' in text:
              raise SystemExit('optional backend registration survived patch')
          build.write_text(text)

          music = Path('omniphony-renderer/renderer/src/music_field.rs')
          text = music.read_text()
          if 'const HIGH_BAND_SUPPORT_SCALE: f32 = 0.72;' in text:
              text = text.replace(
                  'const HIGH_BAND_SUPPORT_SCALE: f32 = 0.72;',
                  'const HIGH_BAND_SUPPORT_SCALE: f32 = 0.58;',
                  1,
              )
          elif 'const HIGH_BAND_SUPPORT_SCALE: f32 = 0.58;' not in text:
              raise SystemExit('unexpected high-band support scale')

          if 'const PRESENCE_SUPPORT_SCALE: f32 = 0.90;' not in text:
              anchor = 'const LOW_MID_SUPPORT_SCALE: f32 = 0.82;\n'
              insert = (
                  'const LOW_MID_SUPPORT_SCALE: f32 = 0.82;\n'
                  '/// Cascaded virtual-speaker -> HRTF rendering adds a second spectral-spatial\n'
                  '/// shaping stage. Keep the 1.2-5 kHz presence band slightly direct-dominant\n'
                  '/// so bright partials do not become hard-edged while the master retains all\n'
                  '/// authored attack and clarity.\n'
                  'const PRESENCE_SUPPORT_SCALE: f32 = 0.90;\n'
              )
              if anchor not in text:
                  raise SystemExit('low-mid scale anchor not found')
              text = text.replace(anchor, insert, 1)

          pattern = re.compile(
              r'(let static_band_scale = if band == 1 \{\s*LOW_MID_SUPPORT_SCALE\s*\})'
              r'\s*else if band == 3 \{\s*HIGH_BAND_SUPPORT_SCALE\s*\}'
          )
          if 'else if band == 2' not in text:
              text, count = pattern.subn(
                  r'\1 else if band == 2 {\n                    PRESENCE_SUPPORT_SCALE\n                } else if band == 3 {\n                    HIGH_BAND_SUPPORT_SCALE\n                }',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'presence scale insertion count={count}')
          music.write_text(text)
          PY
          cd omniphony-renderer
          cargo fmt --all
      - name: Commit integration and listening correction
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add omniphony-renderer/orender_engine/src/renderer_build.rs omniphony-renderer/renderer/src/music_field.rs
          git commit -m 'tune(audio): retain cascade bass and soften upper support'
          git push origin HEAD:main
