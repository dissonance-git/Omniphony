name: Windows native endpoint APO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-endpoint-apo.yml'
      - 'omniphony-renderer/windows_installer/endpoint_apo/**'
      - 'omniphony-renderer/windows_installer/OmniphonyEndpointCtl.cpp'
      - 'omniphony-renderer/windows_installer/OmniphonyEndpointCtl.vcxproj'
      - 'omniphony-renderer/realtime_ffi/**'
      - 'omniphony-renderer/renderer/**'
      - 'omniphony-renderer/orender_engine/**'
      - 'omniphony-renderer/reference_bridge/**'
      - 'omniphony-renderer/bridge_api/**'
      - 'omniphony-renderer/Cargo.toml'
      - 'omniphony-renderer/Cargo.lock'

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.88.0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-apoprobe:
    name: Build and activate x64 endpoint APO
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record source revision
        shell: pwsh
        run: |
          Write-Host "source=$(git rev-parse HEAD)"
          git status --short

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          Set-Location "$env:GITHUB_WORKSPACE\omniphony-renderer"
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Cache Rust dependencies and endpoint build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            omniphony-renderer/target
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-endpoint-apo-${{ hashFiles('omniphony-renderer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-endpoint-apo-
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Build and test realtime ABI
        shell: pwsh
        working-directory: omniphony-renderer
        run: |
          cargo test -p realtime_ffi
          if ($LASTEXITCODE -ne 0) { throw "realtime_ffi tests failed: $LASTEXITCODE" }
          cargo build --release -p realtime_ffi
          if ($LASTEXITCODE -ne 0) { throw "realtime_ffi release build failed: $LASTEXITCODE" }
          if (-not (Test-Path 'target/release/omniphony_realtime.dll')) {
            throw 'realtime_ffi did not produce target/release/omniphony_realtime.dll'
          }

      - name: Setup VS2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Ensure Windows 11 WDK
        shell: pwsh
        run: |
          choco install windowsdriverkit11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "WDK installation failed: $LASTEXITCODE" }

      - name: Configure endpoint APO
        shell: pwsh
        run: |
          cmake -S omniphony-renderer/windows_installer/endpoint_apo `
                -B build/endpoint_apo `
                -A x64
          if ($LASTEXITCODE -ne 0) { throw "APO CMake configure failed: $LASTEXITCODE" }

      - name: Build endpoint APO and controls
        shell: pwsh
        run: |
          cmake --build build/endpoint_apo --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "APO build failed: $LASTEXITCODE" }

          $project = 'omniphony-renderer/windows_installer/OmniphonyEndpointCtl.vcxproj'
          msbuild $project /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "EndpointCtl build failed: $LASTEXITCODE" }

      - name: Verify protected AudioDG packaging contract
        shell: pwsh
        run: |
          $dll = (Resolve-Path 'build/endpoint_apo/Release/OmniphonyAPO.dll').Path
          $mt = (Get-Command mt.exe -ErrorAction Stop).Source
          $probe = Join-Path $env:RUNNER_TEMP 'omniphony-embedded-manifest.xml'
          Remove-Item $probe -Force -ErrorAction SilentlyContinue
          & $mt "-inputresource:$dll;#2" "-out:$probe" 2>$null
          if ($LASTEXITCODE -eq 0 -or (Test-Path $probe)) {
            throw 'OmniphonyAPO.dll contains an embedded manifest; protected AudioDG can reject it.'
          }
          Write-Host 'APO_MANIFEST_OK embedded=0'

      - name: Validate realtime DLL ABI
        shell: pwsh
        run: |
          $smoke = (Resolve-Path 'build/endpoint_apo/Release/OmniphonyRealtimeSmoke.exe').Path
          $realtime = (Resolve-Path 'omniphony-renderer/target/release/omniphony_realtime.dll').Path
          & $smoke $realtime
          if ($LASTEXITCODE -ne 0) { throw "Realtime DLL smoke failed: $LASTEXITCODE" }

      - name: Register and activate APO
        shell: pwsh
        run: |
          $release = (Resolve-Path 'build/endpoint_apo/Release').Path
          $realtime = (Resolve-Path 'omniphony-renderer/target/release/omniphony_realtime.dll').Path
          Copy-Item $realtime (Join-Path $release 'omniphony_realtime.dll') -Force

          $dll = (Resolve-Path 'build/endpoint_apo/Release/OmniphonyAPO.dll').Path
          $smoke = (Resolve-Path 'build/endpoint_apo/Release/OmniphonyApoSmoke.exe').Path
          $regsvr32 = "$env:WINDIR\System32\regsvr32.exe"
          try {
            $register = Start-Process -FilePath $regsvr32 -ArgumentList @('/s', $dll) -Wait -PassThru
            if ($register.ExitCode -ne 0) { throw "regsvr32 registration failed: $($register.ExitCode)" }
            & $smoke
            if ($LASTEXITCODE -ne 0) { throw "APO COM smoke failed: $LASTEXITCODE" }
          }
          finally {
            $unregister = Start-Process -FilePath $regsvr32 -ArgumentList @('/u', '/s', $dll) -Wait -PassThru
            if ($unregister.ExitCode -ne 0) {
              Write-Warning "regsvr32 cleanup returned $($unregister.ExitCode)"
            }
          }

      - name: Assemble test artifact
        shell: pwsh
        run: |
          $dist = 'dist/Omniphony-APO'
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item 'build/endpoint_apo/Release/OmniphonyAPO.dll' $dist
          Copy-Item 'build/endpoint_apo/Release/OmniphonyApoCtl.exe' $dist
          Copy-Item 'build/endpoint_apo/Release/OmniphonyApoSmoke.exe' $dist
          Copy-Item 'build/endpoint_apo/Release/OmniphonyRealtimeSmoke.exe' $dist
          Copy-Item 'build/endpoint_apo/Release/OmniphonyMixProbe.exe' $dist
          Copy-Item 'build/endpoint_apo/Release/OmniphonyProductionProbe.exe' $dist
          Copy-Item 'omniphony-renderer/target/release/omniphony_realtime.dll' $dist
          Copy-Item 'omniphony-renderer/windows_installer/build/endpoint_ctl/OmniphonyEndpointCtl.exe' $dist
          Copy-Item 'omniphony-renderer/windows_installer/endpoint_apo/Install-OmniphonyAPO.ps1' $dist
          Copy-Item 'omniphony-renderer/windows_installer/endpoint_apo/Uninstall-OmniphonyAPO.ps1' $dist
          Copy-Item 'omniphony-renderer/windows_installer/endpoint_apo/production' (Join-Path $dist 'production') -Recurse
          Copy-Item 'omniphony-renderer/windows_installer/endpoint_apo/README.md' $dist
          @"
          Omniphony native APO Current listening candidate
          Source: $env:GITHUB_SHA
          Target: Windows 11 x64
          APO CLSID: {A9333BFE-39C1-40FD-B4B0-ECC591410B47}
          Realtime ABI: 0.3
          Processing: Current model + primary Noire X personal output correction
          Current host latency: 40 ms / 1920 frames at 48 kHz
          Failure behavior: time-aligned delayed-dry fallback
          Final safety: retained stereo-linked -1.0 dBFS peak ceiling
          Protected AudioDG: embedded manifest disabled
          Production handoff: production/Finish-ProductionInstall.ps1
          Runtime install path: Program Files\Omniphony\APO
          Physical gate: post-restart WASAPI GetMixFormat probe
          "@ | Set-Content -Encoding utf8 "$dist/BUILD-METADATA.txt"

      - name: Upload endpoint APO artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniphony-apo-current-x64-${{ github.sha }}
          path: dist/Omniphony-APO
          if-no-files-found: error
          retention-days: 14
