name: Publish private foobar VGM + SPC bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-foobar-publisher.yml'

permissions:
  actions: read
  contents: write

jobs:
  build-and-publish:
    name: Build and publish current foobar bundle
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RETRO_TOKEN: ${{ secrets.RETRO_VGM_READ_TOKEN }}

    steps:
      - name: Require private Retro VGM read token
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RETRO_TOKEN)) {
            throw 'Missing repository secret RETRO_VGM_READ_TOKEN. Add a read-only token that can read dissonance-git/retro-vgm-compiler.'
          }

      - name: Checkout private Retro VGM source
        uses: actions/checkout@v4
        with:
          repository: dissonance-git/retro-vgm-compiler
          ref: main
          token: ${{ secrets.RETRO_VGM_READ_TOKEN }}
          path: retro-vgm-compiler
          persist-credentials: false

      - name: Capture exact Retro VGM revision
        shell: pwsh
        run: |
          $sha = (git -C retro-vgm-compiler rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "Invalid Retro VGM commit: $sha" }
          "RETRO_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Retro VGM source commit: $sha"

      - name: Ensure native build tools
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
          }
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }
          git --version
          python --version
          cmake --version
          cargo --version
          nasm -v
          7z | Select-Object -First 2

      - name: Build and audit private components
        shell: pwsh
        working-directory: retro-vgm-compiler
        run: |
          ./tools/build_private_foobar_components.ps1

      - name: Verify expected publication payload
        shell: pwsh
        working-directory: retro-vgm-compiler
        run: |
          $root = 'dist/private-components'
          $required = @(
            'private-foobar-vgm-spc.zip',
            'foo_input_vgm.private.fb2k-component',
            'foo_snesapu.private.fb2k-component',
            'SHA256SUMS.txt',
            'build-manifest.json',
            'README.txt'
          )
          foreach ($name in $required) {
            $path = Join-Path $root $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing publication payload: $path" }
          }
          Get-Content (Join-Path $root 'SHA256SUMS.txt')
          Get-Content (Join-Path $root 'build-manifest.json')

      - name: Upload verified Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-foobar-vgm-spc-${{ env.RETRO_SHA }}
          path: |
            retro-vgm-compiler/dist/private-components/private-foobar-vgm-spc.zip
            retro-vgm-compiler/dist/private-components/foo_input_vgm.private.fb2k-component
            retro-vgm-compiler/dist/private-components/foo_snesapu.private.fb2k-component
            retro-vgm-compiler/dist/private-components/SHA256SUMS.txt
            retro-vgm-compiler/dist/private-components/build-manifest.json
            retro-vgm-compiler/dist/private-components/README.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish rolling foobar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $dist = Join-Path $PWD 'retro-vgm-compiler/dist/private-components'
          $zip = Join-Path $dist 'private-foobar-vgm-spc.zip'
          $vgm = Join-Path $dist 'foo_input_vgm.private.fb2k-component'
          $spc = Join-Path $dist 'foo_snesapu.private.fb2k-component'
          $hashes = Join-Path $dist 'SHA256SUMS.txt'
          $manifest = Join-Path $dist 'build-manifest.json'
          $zipSha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "ZIP_SHA256=$zipSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $notes = @"
Rolling private foobar2000 VGM + SPC bundle built on GitHub Windows.

Retro VGM source commit: $env:RETRO_SHA
Workflow run: $env:GITHUB_RUN_ID
ZIP SHA-256: $zipSha

The release contains compiled binaries/packages only. The private Retro VGM source is checked out only inside the runner and is not published by this workflow.
"@

          gh release view foobar-current --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload foobar-current $zip $vgm $spc $hashes $manifest --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload rolling foobar release assets' }
            gh release edit foobar-current --repo $repo --title 'Omniphony foobar VGM + SPC - Current' --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update rolling foobar release metadata' }
          } else {
            gh release create foobar-current $zip $vgm $spc $hashes $manifest --repo $repo --target $env:GITHUB_SHA --title 'Omniphony foobar VGM + SPC - Current' --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create rolling foobar release' }
          }

      - name: Record current foobar build locator
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $path = 'builds/foobar-current-build.json'
          $direct = "https://github.com/$repo/releases/download/foobar-current/private-foobar-vgm-spc.zip"
          $record = [ordered]@{
            Schema = 'omniphony.foobar.current-build.v1'
            Status = 'published'
            Conclusion = 'success'
            RunId = [int64]$env:GITHUB_RUN_ID
            HostCommit = $env:GITHUB_SHA
            RetroVgmCommit = $env:RETRO_SHA
            ReleaseTag = 'foobar-current'
            AssetName = 'private-foobar-vgm-spc.zip'
            ZipSha256 = $env:ZIP_SHA256
            DirectUrl = $direct
          } | ConvertTo-Json -Compress

          $tmp = Join-Path $env:RUNNER_TEMP 'foobar-current-build.json'
          [IO.File]::WriteAllText($tmp, $record + "`n", [Text.UTF8Encoding]::new($false))
          $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($tmp))

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$repo/contents/$path?ref=main"
          $existingSha = $null
          try {
            $existing = Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
            $existingSha = [string]$existing.sha
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }

          $body = [ordered]@{
            message = 'build(foobar): publish current bundle locator'
            content = $encoded
            branch = 'main'
          }
          if ($existingSha) { $body.sha = $existingSha }
          $json = $body | ConvertTo-Json -Compress
          Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/contents/$path" -Method Put -ContentType 'application/json' -Body $json | Out-Null
