name: Apply grounded sphere tuning

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_grounded_sphere.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply grounded sphere tuning
        run: python .github/scripts/apply_grounded_sphere.py
      - name: Format and validate patch
        working-directory: omniphony-renderer
        run: |
          cargo fmt --all
          git diff --check
          cargo test -p renderer -- --skip binaural::tests::hrir_source_switch_lands_asynchronously_without_blocking_render
      - name: Commit source tuning
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omniphony-renderer/renderer/src/music_foundation.rs \
                  omniphony-renderer/renderer/src/music_field.rs \
                  omniphony-renderer/renderer/src/binaural/diffuse_compensation.rs
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "tune(audio): ground the System H sphere"
          git push origin HEAD:main
