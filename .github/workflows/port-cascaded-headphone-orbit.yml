name: Port cascaded headphone orbit gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/port-cascaded-headphone-orbit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup override set 1.88.0
        working-directory: omniphony-renderer

      - name: Add cascaded headphone orbit gate
        run: python3 .github/ci/port_cascaded_headphone_orbit.py

      - name: Format touched fixture
        run: rustfmt --edition 2024 omniphony-renderer/dsp_fixtures/src/end_to_end_spatial.rs

      - name: Verify patch scope
        run: |
          git diff --check
          git diff --stat
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "omniphony-renderer/dsp_fixtures/src/end_to_end_spatial.rs"

      - name: Run cascaded headphone orbit gate
        id: focused
        shell: bash
        run: |
          set +e
          cargo test -p dsp_fixtures current_shell_cascaded_binaural_orbit_stays_continuous -- --nocapture 2>&1 | tee /tmp/cascaded-orbit.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: omniphony-renderer

      - name: Record focused failure breadcrumb
        if: steps.focused.outputs.status != '0'
        run: |
          {
            echo "CASCADED_HEADPHONE_ORBIT_FAILURE"
            echo "head=${GITHUB_SHA}"
            echo
            tail -n 280 /tmp/cascaded-orbit.log
          } > .github/ci/cascaded-headphone-orbit-failure.txt
          git config user.name "omniphony-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/ci/cascaded-headphone-orbit-failure.txt
          git commit -m "ci: record cascaded headphone orbit failure"
          git push origin HEAD:main

      - name: Stop after focused failure
        if: steps.focused.outputs.status != '0'
        run: exit 1

      - name: Run full DSP fixture suite
        run: cargo test -p dsp_fixtures
        working-directory: omniphony-renderer

      - name: Re-run Current-shell VBAP gates
        run: cargo test -p renderer current_headphone_shell_ -- --nocapture
        working-directory: omniphony-renderer

      - name: Compile release perf gate
        run: cargo check --release -p renderer --features perf-gate --tests
        working-directory: omniphony-renderer

      - name: Publish validated gate
        run: |
          git config user.name "omniphony-ci"
          git config user.email "actions@users.noreply.github.com"
          git add omniphony-renderer/dsp_fixtures/src/end_to_end_spatial.rs
          git commit -m "test(dsp): gate Current-shell cascaded headphone orbit"
          git push origin HEAD:main
