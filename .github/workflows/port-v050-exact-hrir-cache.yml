name: Port v0.5 exact HRIR cache

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/port-v050-exact-hrir-cache.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"

      - name: Port upstream exact cache without replacing fork behavior
        shell: bash
        run: |
          git fetch --no-tags https://github.com/mgth/Omniphony.git 7347cb9487a34090aa7d3dfac32148434e8471f0
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.')
          hrir_path = root / 'omniphony-renderer/renderer/src/binaural/hrir.rs'
          mod_path = root / 'omniphony-renderer/renderer/src/binaural/mod.rs'

          # hrir.rs has no Windows/Current-specific behavior in our fork. Take
          # upstream v0.5's direction-key implementation and its focused tests.
          hrir = subprocess.check_output(
              ['git', 'show', 'FETCH_HEAD:omniphony-renderer/renderer/src/binaural/hrir.rs'],
              text=True,
          )
          hrir = hrir.replace(
              '/// rather than by argument — and `subdiv = None`\n'
              '/// ([`HrirUpdateLattice::Exact`](crate::live_params::HrirUpdateLattice::Exact))\n'
              '/// degenerates to an exact-direction cache that skips only when nothing\n',
              '/// rather than by argument. With `subdiv = None`, the key degenerates\n'
              '/// to an exact-direction cache that skips only when nothing\n',
          )
          hrir_path.write_text(hrir, encoding='utf-8')

          text = mod_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'use hrir::{HRIR_LEN, HrirPair, HrirSet, ParametricPinnaHrir};',
              'use hrir::{DirectionKey, HRIR_LEN, HrirPair, HrirSet, ParametricPinnaHrir};',
              'DirectionKey import',
          )
          replace_once(
              '    /// Air-absorption smoothing coefficient for the current block\n'
              '    /// (0 = bypass, →1 = heavy low-pass). Updated per block from distance.\n'
              '    air_coeff: f32,\n'
              '}',
              '    /// Air-absorption smoothing coefficient for the current block\n'
              '    /// (0 = bypass, →1 = heavy low-pass). Updated per block from distance.\n'
              '    air_coeff: f32,\n'
              '    /// Exact direction whose HRIR kernels are currently loaded, tagged\n'
              '    /// with the active grid generation so source swaps cannot reuse stale kernels.\n'
              '    last_dir: Option<(u32, DirectionKey)>,\n'
              '}',
              'ChannelDsp last_dir field',
          )
          replace_once(
              '            air_state: 0.0,\n'
              '            air_coeff: 0.0,\n'
              '        }',
              '            air_state: 0.0,\n'
              '            air_coeff: 0.0,\n'
              '            last_dir: None,\n'
              '        }',
              'ChannelDsp last_dir init',
          )
          replace_once(
              '        self.air_state = 0.0;\n'
              '        self.air_coeff = 0.0;\n'
              '    }',
              '        self.air_state = 0.0;\n'
              '        self.air_coeff = 0.0;\n'
              '        self.last_dir = None;\n'
              '    }',
              'ChannelDsp last_dir reset',
          )
          replace_once(
              '    /// Reusable HRIR scratch so `at()` writes in place (no per-channel alloc).\n'
              '    hrir_scratch: HrirPair,\n'
              '    /// Shared late-reverb tail; allocated lazily while enabled.\n',
              '    /// Reusable HRIR scratch so `at()` writes in place (no per-channel alloc).\n'
              '    hrir_scratch: HrirPair,\n'
              '    /// Bumped whenever a newly built HRIR grid becomes active.\n'
              '    /// This invalidates every channel cache without walking the channel vector.\n'
              '    hrir_generation: u32,\n'
              '    /// Shared late-reverb tail; allocated lazily while enabled.\n',
              'BinauralRenderer generation field',
          )
          replace_once(
              '            hrir_scratch: HrirPair {\n'
              '                left: [0.0; HRIR_LEN],\n'
              '                right: [0.0; HRIR_LEN],\n'
              '            },\n'
              '            fdn: None,',
              '            hrir_scratch: HrirPair {\n'
              '                left: [0.0; HRIR_LEN],\n'
              '                right: [0.0; HRIR_LEN],\n'
              '            },\n'
              '            hrir_generation: 0,\n'
              '            fdn: None,',
              'BinauralRenderer generation init',
          )
          replace_once(
              '            if built.source == self.source {\n'
              '                self.hrir = std::sync::Arc::clone(&built.set);\n'
              '            } else {',
              '            if built.source == self.source {\n'
              '                self.hrir = std::sync::Arc::clone(&built.set);\n'
              '                // Same direction on a different HRTF set is a different kernel.\n'
              '                self.hrir_generation = self.hrir_generation.wrapping_add(1);\n'
              '            } else {',
              'grid generation bump',
          )

          old_render = '''            // Per-frame HRIR + ITD update (continuous: delay/convolver state persists).\n            self.hrir.at(\n                az_rad.to_degrees(),\n                el_rad.to_degrees(),\n                &mut self.hrir_scratch,\n            );\n            let (itd_l, itd_r) = itd::ear_delays_seconds(az_rad, el_rad, head_radius_m);\n\n            let dsp = self.channels[c].get_or_insert_with(|| ChannelDsp::new(self.sample_rate));\n            // Kernel changes (moving object / head) crossfade over the block\n            // — capped at HRIR_LEN samples for large offline blocks — so the\n            // transfer function never jumps at a block boundary (issue #155).\n            let fade = sample_length.min(HRIR_LEN);\n            dsp.conv_l.set_coeffs_smooth(&self.hrir_scratch.left, fade);\n            dsp.conv_r.set_coeffs_smooth(&self.hrir_scratch.right, fade);\n            dsp.delay_l.set_target_ms(itd_l * 1000.0, self.sample_rate);\n            dsp.delay_r.set_target_ms(itd_r * 1000.0, self.sample_rate);\n'''
          new_render = '''            // ITD remains continuous and cheap. HRIR interpolation is much more\n            // expensive, so cache the exact direction that produced the loaded kernels.\n            // `None` means no angular quantisation: unchanged directions are bit-identical\n            // skips, while any real movement still rebuilds exactly as before.\n            let (itd_l, itd_r) = itd::ear_delays_seconds(az_rad, el_rad, head_radius_m);\n            let dir = (\n                self.hrir_generation,\n                self.hrir\n                    .quantize_direction(az_rad.to_degrees(), el_rad.to_degrees(), None),\n            );\n\n            let rate = self.sample_rate;\n            let dsp = self.channels[c].get_or_insert_with(|| ChannelDsp::new(rate));\n            if dsp.last_dir != Some(dir) {\n                self.hrir.at_key(dir.1, &mut self.hrir_scratch);\n                // Kernel changes (moving object / head) crossfade over the block\n                // — capped at HRIR_LEN samples for large offline blocks — so the\n                // transfer function never jumps at a block boundary (issue #155).\n                let fade = sample_length.min(HRIR_LEN);\n                dsp.conv_l.set_coeffs_smooth(&self.hrir_scratch.left, fade);\n                dsp.conv_r.set_coeffs_smooth(&self.hrir_scratch.right, fade);\n                dsp.last_dir = Some(dir);\n            }\n            dsp.delay_l.set_target_ms(itd_l * 1000.0, self.sample_rate);\n            dsp.delay_r.set_target_ms(itd_r * 1000.0, self.sample_rate);\n'''
          replace_once(old_render, new_render, 'exact HRIR render cache')

          mod_path.write_text(text, encoding='utf-8')
          PY

          cargo fmt --all

      - name: Verify imported cache and Current sphere gates
        working-directory: omniphony-renderer
        shell: bash
        run: |
          cargo check -p renderer
          cargo test -p renderer binaural::hrir --lib
          cargo test -p renderer --test system_h_layout

      - name: Commit verified port to main
        shell: bash
        run: |
          rm .github/workflows/port-v050-exact-hrir-cache.yml
          git config user.name "dissonance"
          git config user.email "ustreamusa@aim.com"
          git add -A
          git commit -m "perf(binaural): cache exact HRIR directions from v0.5"
          git pull --rebase origin main
          git push origin HEAD:main
