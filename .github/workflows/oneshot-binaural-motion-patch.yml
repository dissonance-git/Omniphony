name: One-shot binaural motion trajectory patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-binaural-motion-patch.yml

permissions:
  contents: write

concurrency:
  group: oneshot-binaural-motion-patch
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.87.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Apply exact motion-trajectory patch
        shell: python
        run: |
          from pathlib import Path

          root = Path("omniphony-renderer")
          spatial = root / "renderer/src/spatial_renderer/mod.rs"
          construction = root / "renderer/src/spatial_renderer/construction.rs"
          binaural = root / "renderer/src/binaural/mod.rs"
          fixture = root / "dsp_fixtures/src/binaural_block_size.rs"

          def replace_exact(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one source fragment, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"patched {label}")

          replace_exact(
              spatial,
              "    binaural_pos_buf: Vec<[f64; 3]>,\n    binaural_gain_buf: Vec<f32>,\n",
              "    binaural_pos_buf: Vec<[f64; 3]>,\n    /// End-of-block position for the same canonical ChannelState trajectory.\n    /// Together with `binaural_pos_buf` this describes a sample-time segment;\n    /// host callback size must not become object-motion quantization.\n    binaural_pos_end_buf: Vec<[f64; 3]>,\n    binaural_gain_buf: Vec<f32>,\n",
              "SpatialRenderer trajectory scratch field",
          )

          replace_exact(
              construction,
              "            binaural_pos_buf: Vec::new(),\n            binaural_gain_buf: Vec::new(),\n",
              "            binaural_pos_buf: Vec::new(),\n            binaural_pos_end_buf: Vec::new(),\n            binaural_gain_buf: Vec::new(),\n",
              "SpatialRenderer trajectory scratch initialization",
          )

          replace_exact(
              spatial,
              "            self.binaural_pos_buf\n                .resize(input_channel_count, [0.0, 1.0, 0.0]);\n            self.binaural_gain_buf.resize(input_channel_count, 0.0);\n",
              "            self.binaural_pos_buf\n                .resize(input_channel_count, [0.0, 1.0, 0.0]);\n            self.binaural_pos_end_buf\n                .resize(input_channel_count, [0.0, 1.0, 0.0]);\n            self.binaural_gain_buf.resize(input_channel_count, 0.0);\n",
              "binaural trajectory scratch resize",
          )

          old_ramp = '''                    let output_position = {
                        let progress = state.ramp.current_progress().unwrap_or(RampProgress {
                            elapsed_samples: 0,
                            total_samples: 0,
                        });
                        let ramp_strategy = create_ramp_strategy(state.ramp.ramp_mode);
                        ramp_strategy.evaluate(
                            &state.ramp,
                            progress,
                            render_ctx,
                            current_frame,
                            input_pcm,
                            input_channel_count,
                            events,
                        )
                    };
                    self.binaural_pos_buf[channel_idx] = output_position;
                    self.binaural_gain_buf[channel_idx] = state.current_gain;
                    state.ramp.commit_output_position(output_position);
                    state.ramp.advance_ramp(sample_length as u32);
'''
          new_ramp = '''                    let output_position_start = {
                        let progress = state.ramp.current_progress().unwrap_or(RampProgress {
                            elapsed_samples: 0,
                            total_samples: 0,
                        });
                        let ramp_strategy = create_ramp_strategy(state.ramp.ramp_mode);
                        ramp_strategy.evaluate(
                            &state.ramp,
                            progress,
                            render_ctx,
                            current_frame,
                            input_pcm,
                            input_channel_count,
                            events,
                        )
                    };
                    self.binaural_pos_buf[channel_idx] = output_position_start;
                    self.binaural_gain_buf[channel_idx] = state.current_gain;

                    // Advance the one canonical ChannelState ramp, then publish
                    // its next sample-boundary position as the other endpoint of
                    // the segment. The binaural stage consumes this segment; it
                    // does not invent a second motion authority.
                    state.ramp.advance_ramp(sample_length as u32);
                    let output_position_end = {
                        let progress = state.ramp.current_progress().unwrap_or(RampProgress {
                            elapsed_samples: 0,
                            total_samples: 0,
                        });
                        let ramp_strategy = create_ramp_strategy(state.ramp.ramp_mode);
                        ramp_strategy.evaluate(
                            &state.ramp,
                            progress,
                            render_ctx,
                            current_frame,
                            input_pcm,
                            input_channel_count,
                            events,
                        )
                    };
                    self.binaural_pos_end_buf[channel_idx] = output_position_end;
                    state.ramp.commit_output_position(output_position_end);
'''
          replace_exact(spatial, old_ramp, new_ramp, "canonical binaural position segment publication")

          replace_exact(
              spatial,
              "            self.binaural.render_frame(\n                input_pcm,\n                input_channel_count,\n                sample_length,\n                &params,\n                &self.binaural_pos_buf,\n                &self.binaural_gain_buf,\n                &self.binaural_direct_buf,\n                &mut out,\n            );\n",
              "            self.binaural.render_frame_trajectories(\n                input_pcm,\n                input_channel_count,\n                sample_length,\n                &params,\n                &self.binaural_pos_buf,\n                &self.binaural_pos_end_buf,\n                &self.binaural_gain_buf,\n                &self.binaural_direct_buf,\n                &mut out,\n            );\n",
              "binaural trajectory render call",
          )

          replace_exact(
              spatial,
              "            self.channel_states.clear();\n        }\n\n        // Resize output_buffer if needed and clear it\n",
              "            self.channel_states.clear();\n            self.binaural.reset_runtime_state();\n        }\n\n        // Resize output_buffer if needed and clear it\n",
              "whole-trajectory runtime reset",
          )

          replace_exact(
              binaural,
              "    /// Identity of the active HRIR grid (tests observe the async swap with it).\n",
              "    /// Reset stream-lifetime DSP/trajectory state while keeping the selected HRIR\n    /// provider and rebuild worker alive. SpatialRenderer calls this at the same\n    /// logical-stream boundary where it clears canonical ChannelState ramps.\n    pub fn reset_runtime_state(&mut self) {\n        self.channels.clear();\n        self.channel_gain_boundary.clear();\n        self.fdn = None;\n        self.reverb_bus.clear();\n    }\n\n    /// Identity of the active HRIR grid (tests observe the async swap with it).\n",
              "binaural stream reset",
          )

          old_sig = '''    #[allow(clippy::too_many_arguments)]
    pub fn render_frame(
        &mut self,
        input_pcm: &[f32],
        input_channel_count: usize,
        sample_length: usize,
        params: &BinauralFrameParams,
        chan_pos: &[[f64; 3]],
        chan_gain: &[f32],
        chan_direct: &[bool],
        out: &mut [f32],
    ) {
        let BinauralFrameParams {
'''
          new_sig = '''    #[allow(clippy::too_many_arguments)]
    pub fn render_frame(
        &mut self,
        input_pcm: &[f32],
        input_channel_count: usize,
        sample_length: usize,
        params: &BinauralFrameParams,
        chan_pos: &[[f64; 3]],
        chan_gain: &[f32],
        chan_direct: &[bool],
        out: &mut [f32],
    ) {
        self.render_frame_trajectories(
            input_pcm,
            input_channel_count,
            sample_length,
            params,
            chan_pos,
            chan_pos,
            chan_gain,
            chan_direct,
            out,
        );
    }

    /// Render one frame while consuming canonical start/end object positions on
    /// the audio sample timeline. The legacy `render_frame` wrapper above passes
    /// identical endpoints for stationary/unit tests.
    #[allow(clippy::too_many_arguments)]
    pub fn render_frame_trajectories(
        &mut self,
        input_pcm: &[f32],
        input_channel_count: usize,
        sample_length: usize,
        params: &BinauralFrameParams,
        chan_pos_start: &[[f64; 3]],
        chan_pos_end: &[[f64; 3]],
        chan_gain: &[f32],
        chan_direct: &[bool],
        out: &mut [f32],
    ) {
        let BinauralFrameParams {
'''
          replace_exact(binaural, old_sig, new_sig, "trajectory-aware binaural entry point")

          replace_exact(
              binaural,
              "            let pos = chan_pos.get(c).copied().unwrap_or([0.0, 1.0, 0.0]);\n\n            // World → head-relative direction, then spherical angles.\n",
              "            let pos_start = chan_pos_start\n                .get(c)\n                .copied()\n                .unwrap_or([0.0, 1.0, 0.0]);\n            let pos_end = chan_pos_end.get(c).copied().unwrap_or(pos_start);\n            let moving = pos_start != pos_end;\n            // Room/air targets remain block-updated for now. Direct HRTF/ITD\n            // motion below consumes the exact sample-time segment.\n            let pos = pos_start;\n\n            // World → head-relative direction, then spherical angles.\n",
              "binaural position segment consumption",
          )

          old_hrir = '''            // Per-frame HRIR + ITD update (continuous: delay/convolver state persists).
            self.hrir.at(
                az_rad.to_degrees(),
                el_rad.to_degrees(),
                &mut self.hrir_scratch,
            );
            let (itd_l, itd_r) = itd::ear_delays_seconds(az_rad, el_rad, head_radius_m);

            let dsp = self.channels[c].get_or_insert_with(|| ChannelDsp::new(self.sample_rate));
            // Kernel changes (moving object / head) crossfade over the block
            // — capped at HRIR_LEN samples for large offline blocks — so the
            // transfer function never jumps at a block boundary (issue #155).
            let fade = sample_length.min(HRIR_LEN);
            dsp.conv_l.set_coeffs_smooth(&self.hrir_scratch.left, fade);
            dsp.conv_r.set_coeffs_smooth(&self.hrir_scratch.right, fade);
            dsp.delay_l.set_target_ms(itd_l * 1000.0, self.sample_rate);
            dsp.delay_r.set_target_ms(itd_r * 1000.0, self.sample_rate);
'''
          new_hrir = '''            let dsp = self.channels[c].get_or_insert_with(|| ChannelDsp::new(self.sample_rate));
            if !moving {
                // Preserve the established block crossfade for stationary objects
                // and head-pose updates. Moving object trajectories use the exact
                // per-sample path below instead of an arbitrary callback staircase.
                self.hrir.at(
                    az_rad.to_degrees(),
                    el_rad.to_degrees(),
                    &mut self.hrir_scratch,
                );
                let (itd_l, itd_r) = itd::ear_delays_seconds(az_rad, el_rad, head_radius_m);
                let fade = sample_length.min(HRIR_LEN);
                dsp.conv_l.set_coeffs_smooth(&self.hrir_scratch.left, fade);
                dsp.conv_r.set_coeffs_smooth(&self.hrir_scratch.right, fade);
                dsp.delay_l.set_target_ms(itd_l * 1000.0, self.sample_rate);
                dsp.delay_r.set_target_ms(itd_r * 1000.0, self.sample_rate);
            }
'''
          replace_exact(binaural, old_hrir, new_hrir, "stationary versus moving HRTF update")

          old_loop = '''            let air = dsp.air_coeff;
            for s in 0..sample_length {
                // Reconstruct the exact linear gain segment between the previous
'''
          new_loop = '''            let air = dsp.air_coeff;
            for s in 0..sample_length {
                if moving {
                    let t = s as f64 / sample_length as f64;
                    let motion_pos = [
                        pos_start[0] + (pos_end[0] - pos_start[0]) * t,
                        pos_start[1] + (pos_end[1] - pos_start[1]) * t,
                        pos_start[2] + (pos_end[2] - pos_start[2]) * t,
                    ];
                    let hp = head_pose.rotate(motion_pos);
                    let (hx, hy, hz) = (hp[0] as f32, hp[1] as f32, hp[2] as f32);
                    let motion_az = hx.atan2(hy);
                    let motion_horiz = (hx * hx + hy * hy).sqrt();
                    let motion_el = hz.atan2(motion_horiz);
                    self.hrir.at(
                        motion_az.to_degrees(),
                        motion_el.to_degrees(),
                        &mut self.hrir_scratch,
                    );
                    // The coefficient path itself is now sampled from the
                    // canonical object trajectory every audio sample. FIR history
                    // persists; a one-sample smooth update avoids a second motion
                    // state machine while keeping callback partition irrelevant.
                    dsp.conv_l.set_coeffs_smooth(&self.hrir_scratch.left, 1);
                    dsp.conv_r.set_coeffs_smooth(&self.hrir_scratch.right, 1);
                    let (itd_l, itd_r) =
                        itd::ear_delays_seconds(motion_az, motion_el, head_radius_m);
                    dsp.delay_l.set_target_ms(itd_l * 1000.0, self.sample_rate);
                    dsp.delay_r.set_target_ms(itd_r * 1000.0, self.sample_rate);
                }

                // Reconstruct the exact linear gain segment between the previous
'''
          replace_exact(binaural, old_loop, new_loop, "per-sample moving HRTF/ITD trajectory")

          old_test = '''/// Position is the remaining half of the same portability bug family.
///
/// At present the binaural branch evaluates the canonical object ramp once at
/// the *start* of each callback, sends that single position to the HRTF stage,
/// then advances the ramp by the callback length. A 40-sample caller therefore
/// supplies many directional updates while a 960-sample caller holds the start
/// direction for the entire 20 ms move. HRTF coefficient crossfades smooth those
/// steps but cannot recover the missing sample-time trajectory.
///
/// This defect-presence test stays ignored until the parent renderer publishes a
/// real position trajectory segment. Once repaired, invert it exactly like the
/// gain gate above and remove `#[ignore]`.
#[test]
#[ignore = "known defect: binaural position/HRTF trajectory is still quantized to callback boundaries"]
fn known_defect_binaural_position_is_block_quantized() {
    let fine = render_position_motion(40);
    let medium = render_position_motion(240);
    let whole_motion = render_position_motion(TOTAL_SAMPLES);

    assert_eq!(fine.len(), medium.len());
    assert_eq!(fine.len(), whole_motion.len());

    let fine_vs_medium = peak_residual_dbfs(&fine, &medium);
    let fine_vs_whole = peak_residual_dbfs(&fine, &whole_motion);
    eprintln!(
        "known binaural motion block dependence: 40-vs-240={fine_vs_medium:.2} dBFS, 40-vs-960={fine_vs_whole:.2} dBFS"
    );

    assert!(
        fine_vs_medium > -60.0 || fine_vs_whole > -60.0,
        "the known position/HRTF block-quantization defect no longer reproduces; convert this into the positive invariance gate"
    );
}
'''
          new_test = '''/// Object movement belongs to the canonical audio timeline, not the host callback.
/// The same 20 ms front→right trajectory must therefore render equivalently for
/// fine, medium and whole-ramp caller partitions.
#[test]
fn binaural_position_is_invariant_to_host_block_size() {
    let fine = render_position_motion(40);
    let medium = render_position_motion(240);
    let whole_motion = render_position_motion(TOTAL_SAMPLES);

    assert_eq!(fine.len(), medium.len());
    assert_eq!(fine.len(), whole_motion.len());

    let fine_vs_medium = peak_residual_dbfs(&fine, &medium);
    let fine_vs_whole = peak_residual_dbfs(&fine, &whole_motion);
    eprintln!(
        "binaural motion callback invariance: 40-vs-240={fine_vs_medium:.2} dBFS, 40-vs-960={fine_vs_whole:.2} dBFS"
    );

    const MAX_RESIDUAL_DBFS: f32 = -80.0;
    assert!(
        fine_vs_medium <= MAX_RESIDUAL_DBFS && fine_vs_whole <= MAX_RESIDUAL_DBFS,
        "binaural position/HRTF trajectory depends on host callback size: 40-vs-240={fine_vs_medium:.2} dBFS, 40-vs-960={fine_vs_whole:.2} dBFS (required <= {MAX_RESIDUAL_DBFS:.1})"
    );
}
'''
          replace_exact(fixture, old_test, new_test, "motion invariance regression gate")

      - name: Format patched Rust
        working-directory: omniphony-renderer
        run: cargo fmt --all

      - name: Test renderer core
        working-directory: omniphony-renderer
        run: cargo test -p renderer

      - name: Test binaural gain callback invariance
        working-directory: omniphony-renderer
        run: cargo test -p dsp_fixtures binaural_gain_is_invariant_to_host_block_size -- --nocapture

      - name: Test binaural motion callback invariance
        working-directory: omniphony-renderer
        run: cargo test -p dsp_fixtures binaural_position_is_invariant_to_host_block_size -- --nocapture

      - name: Show exact patch
        run: git diff --check && git diff --stat && git diff -- omniphony-renderer/renderer/src/spatial_renderer/mod.rs omniphony-renderer/renderer/src/spatial_renderer/construction.rs omniphony-renderer/renderer/src/binaural/mod.rs omniphony-renderer/dsp_fixtures/src/binaural_block_size.rs

      - name: Commit only after tests pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            omniphony-renderer/renderer/src/spatial_renderer/mod.rs \
            omniphony-renderer/renderer/src/spatial_renderer/construction.rs \
            omniphony-renderer/renderer/src/binaural/mod.rs \
            omniphony-renderer/dsp_fixtures/src/binaural_block_size.rs
          git diff --cached --quiet && { echo "no patch produced"; exit 1; }
          git commit -m "fix(binaural): move object HRTF on the sample timeline"
          git push origin HEAD:main
