name: Spatial Windows endpoint

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-endpoint.yml'
      - 'omniphony-renderer/windows_endpoint/**'

permissions:
  contents: read

jobs:
  build-windows11-x64:
    name: Build Windows 11 x64 endpoint
    # The pinned SysVAD-derived driver is a VS2022-era WDK project. Keep the
    # Windows adapter on that known-compatible toolchain instead of teaching the
    # project to impersonate a kernel-driver build under VS2026.
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout Omniphony host repository
        uses: actions/checkout@v4
        with:
          path: omniphony

      - name: Checkout pinned virtual-audio bootstrap source
        uses: actions/checkout@v4
        with:
          repository: VirtualDrivers/Virtual-Audio-Driver
          ref: bb34fba15faf569a6ae9bdea360bc1cf4821354e
          path: endpoint-upstream

      - name: Verify pinned upstream revision
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\endpoint-upstream"
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne 'bb34fba15faf569a6ae9bdea360bc1cf4821354e') {
            throw "Unexpected endpoint bootstrap revision: $head"
          }

      - name: Prepare Spatial-only endpoint source
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\omniphony\omniphony-renderer\windows_endpoint\Prepare-SpatialEndpoint.ps1" `
            -SourceRoot "$env:GITHUB_WORKSPACE\endpoint-upstream"

      - name: Validate self-contained endpoint installer
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\omniphony\omniphony-renderer\windows_endpoint\SpatialEndpoint.ps1" -Action Validate

      - name: Setup VS2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Ensure Windows 11 WDK
        shell: pwsh
        run: |
          choco install windowsdriverkit11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "WDK installation failed with exit code $LASTEXITCODE" }

          $kitsRoot = 'C:\Program Files (x86)\Windows Kits\10'
          $wdkVersions = Get-ChildItem "$kitsRoot\Include" -Directory -ErrorAction Stop |
            Where-Object {
              $_.Name -match '^10\.0\.\d+\.\d+$' -and
              (Test-Path (Join-Path $_.FullName 'km\portcls.h')) -and
              (Test-Path "$kitsRoot\Lib\$($_.Name)\km\x64\portcls.lib")
            } |
            Sort-Object { [version]$_.Name } -Descending
          $wdk = $wdkVersions | Select-Object -First 1
          if (-not $wdk) { throw 'Installed WDK exposes no x64 PortCls development surface' }
          "SPATIAL_WDK_VERSION=$($wdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "WDK=$($wdk.Name)"

          $driverTargets = Get-ChildItem $kitsRoot -Recurse -Filter 'WindowsDriver.Common.targets' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $driverTargets) { throw 'WDK installed but WindowsDriver.Common.targets is missing' }
          Write-Host "Driver targets=$($driverTargets.FullName)"

      - name: Probe upstream signed bridge against kernel policy
        id: signed_bridge
        shell: pwsh
        run: |
          $url = 'https://github.com/VirtualDrivers/Virtual-Audio-Driver/releases/download/25.7.14/Virtual.Audio.Driver.Signed.-.25.7.14.zip'
          $zip = "$env:RUNNER_TEMP\VirtualAudioDriver-Signed-25.7.14.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip

          $expected = 'dd10560994de65a7e587fb8b93c0d7e9838292d9c3566a0976c2786d727292bd'
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Signed bridge release hash mismatch: expected $expected got $actual"
          }

          $extract = "$env:RUNNER_TEMP\signed-vad"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          Write-Host 'Signed release contents:'
          Get-ChildItem $extract -Recurse -File | Select-Object FullName, Length

          $cat = Get-ChildItem $extract -Recurse -Filter '*.cat' -File | Select-Object -First 1
          $sys = Get-ChildItem $extract -Recurse -Filter '*.sys' -File | Select-Object -First 1
          $inf = Get-ChildItem $extract -Recurse -Filter '*.inf' -File | Select-Object -First 1
          if (-not $cat -or -not $sys -or -not $inf) {
            throw 'Signed bridge release is missing INF/CAT/SYS package files'
          }

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter 'signtool.exe' -File |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found after WDK installation' }

          Write-Host "Kernel-policy verification using $($signtool.FullName)"
          & $signtool.FullName verify /kp /v $cat.FullName
          $kernelPolicy = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          $status = Get-AuthenticodeSignature $cat.FullName
          Write-Host "Catalog Authenticode status=$($status.Status) signer=$($status.SignerCertificate.Subject)"

          if ($kernelPolicy -eq 0) {
            Write-Host 'Upstream signed bridge satisfies signtool kernel-policy verification.'
            "SPATIAL_SIGNED_BRIDGE_OK=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "SPATIAL_SIGNED_BRIDGE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Warning 'Upstream signed bridge does not satisfy kernel-policy verification; it will not be offered as the Secure-Boot P0 shortcut.'
            "SPATIAL_SIGNED_BRIDGE_OK=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build Spatial endpoint package
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\endpoint-upstream"
          # The WDK's in-MSBuild InfVerif host is broken on the current hosted
          # image because its managed task requests a DLL that the kit does not
          # install. Disable only that host task. The next step runs the real
          # standalone WDK InfVerif.exe in /w mode and remains a hard gate.
          msbuild 'VirtualAudioDriver.sln' /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RunCodeAnalysis=false `
            /p:InfVerif_Enable=false `
            /p:UseInfVerifierEx=false
          if ($LASTEXITCODE -ne 0) { throw "Spatial endpoint build failed with exit code $LASTEXITCODE" }

      - name: Validate built INF with standalone WDK InfVerif
        shell: pwsh
        run: |
          $package = "$env:GITHUB_WORKSPACE\endpoint-upstream\x64\Release\package"
          $inf = Get-ChildItem $package -Filter '*.inf' -File | Select-Object -First 1
          if (-not $inf) { throw 'Endpoint build produced no INF for validation' }

          $kitsRoot = 'C:\Program Files (x86)\Windows Kits\10'
          $infverif = Get-ChildItem "$kitsRoot\Tools" -Recurse -Filter 'InfVerif.exe' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\InfVerif\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $infverif) {
            $infverif = Get-ChildItem "$kitsRoot\bin" -Recurse -Filter 'InfVerif.exe' -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\InfVerif\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $infverif) { throw 'Standalone x64 WDK InfVerif.exe was not found' }

          Write-Host "Validating $($inf.FullName) with $($infverif.FullName)"
          & $infverif.FullName /w /v $inf.FullName
          if ($LASTEXITCODE -ne 0) { throw "Standalone InfVerif /w failed with exit code $LASTEXITCODE" }

      - name: Verify endpoint package identity
        shell: pwsh
        run: |
          $package = "$env:GITHUB_WORKSPACE\endpoint-upstream\x64\Release\package"
          if (-not (Test-Path $package)) { throw "Endpoint package directory was not produced: $package" }

          $inf = Get-ChildItem $package -Filter '*.inf' | Select-Object -First 1
          $sys = Get-ChildItem $package -Filter '*.sys' | Select-Object -First 1
          if (-not $inf) { throw 'Endpoint build produced no INF' }
          if (-not $sys) { throw 'Endpoint build produced no SYS' }

          $infText = Get-Content -Raw $inf.FullName
          if ($infText -notmatch 'Spatial') { throw 'Built INF does not contain Spatial endpoint identity' }
          if ($infText -notmatch 'ROOT\\SpatialAudioEndpoint') { throw 'Built INF does not contain Spatial hardware ID' }
          if ($infText -match '(?m)^AddInterface=.*WaveMicArray1') {
            throw 'Built Spatial P0 INF still exposes the sample microphone endpoint'
          }

          Write-Host "Built endpoint INF: $($inf.FullName)"
          Write-Host "Built endpoint SYS: $($sys.FullName)"

      - name: Assemble development artifact
        shell: pwsh
        run: |
          $dist = "$env:GITHUB_WORKSPACE\dist\SpatialEndpoint"
          $release = "$env:GITHUB_WORKSPACE\endpoint-upstream\x64\Release"
          $package = "$release\package"
          $certificate = "$release\package.cer"
          if (-not (Test-Path $certificate)) {
            throw "WDK development signing certificate was not exported: $certificate"
          }

          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "$package\*" $dist -Recurse -Force
          Copy-Item $certificate "$dist\SpatialEndpoint-Development.cer" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\omniphony\omniphony-renderer\windows_endpoint\SpatialEndpoint.ps1" "$dist\SpatialEndpoint.ps1" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\endpoint-upstream\LICENSE" "$dist\UPSTREAM-LICENSE.txt" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\endpoint-upstream\THIRD_PARTY_NOTICES.md" "$dist\THIRD_PARTY_NOTICES.md" -Force
          @"
          Spatial endpoint development build
          ==================================
          Target: Windows 11 x64
          Endpoint hardware ID: ROOT\SpatialAudioEndpoint
          Endpoint role: silent render sink only
          Upstream: VirtualDrivers/Virtual-Audio-Driver
          Upstream commit: bb34fba15faf569a6ae9bdea360bc1cf4821354e
          WDK: $env:SPATIAL_WDK_VERSION
          Omniphony commit: $env:GITHUB_SHA

          This driver contains no Omniphony DSP. It exists only to give Windows
          a real render destination. Spatial's user-mode host captures external
          application audio with endpoint-independent process loopback, excludes
          its own process tree, renders through the portable core, and writes
          binaural stereo to the physical output.

          SpatialEndpoint.ps1 creates/removes only ROOT\SpatialAudioEndpoint and
          uses Windows' built-in PnPUtil to stage/bind the INF. It does not carry
          DevCon or DevGen and it does not alter the portable renderer.

          DEVELOPMENT SIGNING BOUNDARY:
          This custom CI artifact is WDK development/test signed, not production
          Microsoft-signed. SpatialEndpoint-Development.cer is the public test
          certificate exported by this exact build so the package remains
          inspectable and testable. Nothing in this artifact changes Secure Boot,
          BitLocker, boot configuration, or Windows test-signing state.
          "@ | Set-Content -Encoding utf8 "$dist\BUILD-METADATA.txt"

      - name: Upload Spatial endpoint development package
        uses: actions/upload-artifact@v4
        with:
          name: spatial-endpoint-windows11-x64-${{ github.sha }}
          path: dist/SpatialEndpoint
          if-no-files-found: error
          retention-days: 14

      - name: Upload kernel-policy-valid signed bridge
        if: env.SPATIAL_SIGNED_BRIDGE_OK == '1'
        uses: actions/upload-artifact@v4
        with:
          name: spatial-temporary-signed-bridge-${{ github.sha }}
          path: ${{ env.SPATIAL_SIGNED_BRIDGE_ZIP }}
          if-no-files-found: error
          retention-days: 14
