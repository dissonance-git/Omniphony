name: Promote MDAP wide energy gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-mdap-wide-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measure-and-promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup override set 1.88.0
        working-directory: omniphony-renderer

      # Re-run the historical deferral against today's virtual-pole/downmix path.
      - name: Run currently ignored wide MDAP sweep
        id: probe
        shell: bash
        run: |
          set +e
          cargo test -p renderer --release --features wide-matrix vbap_conserves_energy_over_the_sphere_wide -- --ignored --nocapture 2>&1 | tee /tmp/mdap-wide.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: omniphony-renderer

      - name: Record surviving deferral
        if: steps.probe.outputs.status != '0'
        run: |
          {
            echo "MDAP_WIDE_DEFERRAL_STILL_LIVE"
            echo "head=${GITHUB_SHA}"
            echo
            tail -n 300 /tmp/mdap-wide.log
          } > .github/ci/mdap-wide-probe.txt
          git config user.name "omniphony-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/ci/mdap-wide-probe.txt
          git commit -m "ci: record current MDAP wide defect"
          git push origin HEAD:main

      - name: Stop if defect remains
        if: steps.probe.outputs.status != '0'
        run: exit 1

      - name: Promote the sweep to a live gate
        run: python3 .github/ci/promote_mdap_wide_gate.py

      - name: Format touched validation module
        run: rustfmt --edition 2024 omniphony-renderer/renderer/src/spatial_vbap/panner/native_validation.rs

      - name: Verify patch scope
        run: |
          git diff --check
          git diff --stat
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "omniphony-renderer/renderer/src/spatial_vbap/panner/native_validation.rs"

      - name: Prove the promoted gate runs normally
        run: cargo test -p renderer --release --features wide-matrix vbap_conserves_energy_over_the_sphere_wide -- --nocapture
        working-directory: omniphony-renderer

      - name: Re-run Current-shell product geometry gates
        run: cargo test -p renderer current_headphone_shell_ -- --nocapture
        working-directory: omniphony-renderer

      - name: Publish promotion
        run: |
          git config user.name "omniphony-ci"
          git config user.email "actions@users.noreply.github.com"
          git add omniphony-renderer/renderer/src/spatial_vbap/panner/native_validation.rs
          git commit -m "test(dsp): promote wide MDAP energy sweep to live gate"
          git push origin HEAD:main
