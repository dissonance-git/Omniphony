name: One-shot wire diffuse compensation

on:
  push:
    paths:
      - '.github/workflows/oneshot-wire-diffuse-comp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire support-only compensation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('omniphony-renderer/windows_host/src/music_worker_evidence.rs')
          s = p.read_text()
          old = 'use renderer::music_field::{MUSIC_FIELD_CHANNELS, MusicFieldProcessor, MusicFieldSnapshot};'
          new = '''use renderer::binaural::diffuse_compensation::DiffuseFieldCompensator;
use renderer::music_field::{MUSIC_FIELD_CHANNELS, MusicFieldProcessor, MusicFieldSnapshot};'''
          if old not in s:
              raise SystemExit('music-field import anchor missing')
          s = s.replace(old, new, 1)

          old = '    let mut foundation = MusicFoundationProcessor::new(SAMPLE_RATE_HZ);'
          new = '''    let mut foundation = MusicFoundationProcessor::new(SAMPLE_RATE_HZ);
    // The protected master never passes through this stage. This is a partial
    // inverse of the measured direction-independent SAF/KEMAR HRTF colour on
    // the additive binaural support branch only.
    let mut support_compensation = DiffuseFieldCompensator::saf_kemar_partial(SAMPLE_RATE_HZ);'''
          if old not in s:
              raise SystemExit('foundation construction anchor missing')
          s = s.replace(old, new, 1)

          old = '        for block in rendered {'
          new = '        for mut block in rendered {'
          if old not in s:
              raise SystemExit('rendered-block loop anchor missing')
          s = s.replace(old, new, 1)

          old = '''            rendered_meter.observe(&block.samples);
            let mut dry = Vec::with_capacity(block.samples.len());'''
          new = '''            support_compensation.process_interleaved_stereo_in_place(&mut block.samples);
            rendered_meter.observe(&block.samples);
            let mut dry = Vec::with_capacity(block.samples.len());'''
          if old not in s:
              raise SystemExit('rendered meter anchor missing')
          s = s.replace(old, new, 1)

          old = '''    println!(
        "  acoustics: cascaded Omniphony virtual room / distance / HRTF / reflections / air cues"
    );'''
          new = '''    println!(
        "  acoustics: cascaded Omniphony virtual room / distance / HRTF / reflections / air cues"
    );
    println!("  HRTF colour: partial SAF/KEMAR diffuse-field compensation on support only");'''
          if old not in s:
              raise SystemExit('acoustics log anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cargo fmt --manifest-path omniphony-renderer/Cargo.toml --all
          cargo test --manifest-path omniphony-renderer/Cargo.toml -p renderer diffuse_compensation
      - name: Commit and self-remove
        shell: bash
        run: |
          rm .github/workflows/oneshot-wire-diffuse-comp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(audio): compensate common SAF support colour'
          git push

# trigger
