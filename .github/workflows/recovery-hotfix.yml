name: One-shot audio graph recovery hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh main
        run: |
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main

      - name: Make renderer startup and teardown nonblocking
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {n}')
              return text.replace(old, new, 1)

          # Stereo Current worker.
          p = Path('omniphony-renderer/realtime_ffi/src/lib.rs')
          s = p.read_text()
          s = replace_once(s,
              'use std::sync::{Arc, mpsc::sync_channel};',
              'use std::sync::Arc;',
              'stereo sync_channel import')
          s = replace_once(s,
              '    failed: Arc<AtomicBool>,\n    processed_blocks: Arc<AtomicU64>,',
              '    failed: Arc<AtomicBool>,\n    ready: Arc<AtomicBool>,\n    processed_blocks: Arc<AtomicU64>,',
              'stereo ready field')
          s = replace_once(s,
              '        let failed = Arc::new(AtomicBool::new(false));\n        let processed_blocks = Arc::new(AtomicU64::new(0));\n        let (init_tx, init_rx) = sync_channel::<Result<(), String>>(1);',
              '        let failed = Arc::new(AtomicBool::new(false));\n        let ready = Arc::new(AtomicBool::new(false));\n        let processed_blocks = Arc::new(AtomicU64::new(0));',
              'stereo init state')
          s = replace_once(s,
              '        let failed_worker = Arc::clone(&failed);\n        let blocks_worker = Arc::clone(&processed_blocks);',
              '        let failed_worker = Arc::clone(&failed);\n        let ready_worker = Arc::clone(&ready);\n        let blocks_worker = Arc::clone(&processed_blocks);',
              'stereo ready worker')
          s = replace_once(s,
              '''                let mut pipeline = match CurrentPipeline::new(sample_rate_hz) {
                    Ok(pipeline) => {
                        let _ = init_tx.send(Ok(()));
                        pipeline
                    }
                    Err(error) => {
                        let _ = init_tx.send(Err(error));
                        failed_worker.store(true, Ordering::Release);
                        return;
                    }
                };''',
              '''                let mut pipeline = match CurrentPipeline::new(sample_rate_hz) {
                    Ok(pipeline) => {
                        ready_worker.store(true, Ordering::Release);
                        pipeline
                    }
                    Err(_) => {
                        failed_worker.store(true, Ordering::Release);
                        return;
                    }
                };''',
              'stereo worker init')
          s = replace_once(s,
              '''        match init_rx.recv_timeout(Duration::from_secs(30)) {
            Ok(Ok(())) => Ok(Self {
                input,
                output,
                stop,
                failed,
                processed_blocks,
                worker: Some(worker),
                dry_delay: StereoDelay::new(sample_rate_hz),
                missed_current_frames: 0,
            }),
            Ok(Err(error)) => {
                stop.store(true, Ordering::Release);
                let _ = worker.join();
                Err(error)
            }
            Err(error) => {
                stop.store(true, Ordering::Release);
                let _ = worker.join();
                Err(format!("Current model initialization timed out: {error}"))
            }
        }''',
              '''        Ok(Self {
            input,
            output,
            stop,
            failed,
            ready,
            processed_blocks,
            worker: Some(worker),
            dry_delay: StereoDelay::new(sample_rate_hz),
            missed_current_frames: 0,
        })''',
              'stereo synchronous init wait')
          s = replace_once(s,
              '        let mut use_current = !self.failed.load(Ordering::Acquire);',
              '        let mut use_current = self.ready.load(Ordering::Acquire)\n            && !self.failed.load(Ordering::Acquire);',
              'stereo ready gate')
          s = replace_once(s,
              '''        if let Some(worker) = self.worker.take() {
            let _ = worker.join();
        }''',
              '''        // Never block an AudioDG graph teardown on renderer destruction.
        // Dropping JoinHandle detaches safely; the worker owns only Arc state and
        // observes `stop` as soon as any in-flight initialization/work returns.
        let _ = self.worker.take();''',
              'stereo blocking join')
          p.write_text(s)

          # Authored native-bed worker.
          p = Path('omniphony-renderer/realtime_ffi/src/native_bed_ffi.rs')
          s = p.read_text()
          s = replace_once(s,
              'use std::sync::{Arc, mpsc::sync_channel};',
              'use std::sync::Arc;',
              'bed sync_channel import')
          s = replace_once(s,
              '    failed: Arc<AtomicBool>,\n    processed_blocks: Arc<AtomicU64>,',
              '    failed: Arc<AtomicBool>,\n    ready: Arc<AtomicBool>,\n    processed_blocks: Arc<AtomicU64>,',
              'bed ready field')
          s = replace_once(s,
              '        let failed = Arc::new(AtomicBool::new(false));\n        let processed_blocks = Arc::new(AtomicU64::new(0));\n        let (init_tx, init_rx) = sync_channel::<Result<(), String>>(1);',
              '        let failed = Arc::new(AtomicBool::new(false));\n        let ready = Arc::new(AtomicBool::new(false));\n        let processed_blocks = Arc::new(AtomicU64::new(0));',
              'bed init state')
          s = replace_once(s,
              '        let failed_worker = Arc::clone(&failed);\n        let blocks_worker = Arc::clone(&processed_blocks);',
              '        let failed_worker = Arc::clone(&failed);\n        let ready_worker = Arc::clone(&ready);\n        let blocks_worker = Arc::clone(&processed_blocks);',
              'bed ready worker')
          s = replace_once(s,
              '''                let mut pipeline = match NativeBedPipeline::new(sample_rate_hz, channels, channel_mask) {
                    Ok(pipeline) => {
                        let _ = init_tx.send(Ok(()));
                        pipeline
                    }
                    Err(error) => {
                        let _ = init_tx.send(Err(error));
                        failed_worker.store(true, Ordering::Release);
                        return;
                    }
                };''',
              '''                let mut pipeline = match NativeBedPipeline::new(sample_rate_hz, channels, channel_mask) {
                    Ok(pipeline) => {
                        ready_worker.store(true, Ordering::Release);
                        pipeline
                    }
                    Err(_) => {
                        failed_worker.store(true, Ordering::Release);
                        return;
                    }
                };''',
              'bed worker init')
          s = replace_once(s,
              '''        match init_rx.recv_timeout(Duration::from_secs(30)) {
            Ok(Ok(())) => Ok(Self {
                input,
                output,
                stop,
                failed,
                processed_blocks,
                worker: Some(worker),
                fallback_layout,
                fallback_delay: StereoDelay::new(sample_rate_hz),
                missed_native_frames: 0,
                channels,
            }),
            Ok(Err(error)) => {
                stop.store(true, Ordering::Release);
                let _ = worker.join();
                Err(error)
            }
            Err(error) => {
                stop.store(true, Ordering::Release);
                let _ = worker.join();
                Err(format!("native bed initialization timed out: {error}"))
            }
        }''',
              '''        Ok(Self {
            input,
            output,
            stop,
            failed,
            ready,
            processed_blocks,
            worker: Some(worker),
            fallback_layout,
            fallback_delay: StereoDelay::new(sample_rate_hz),
            missed_native_frames: 0,
            channels,
        })''',
              'bed synchronous init wait')
          s = replace_once(s,
              '        let mut use_native = !self.failed.load(Ordering::Acquire);',
              '        let mut use_native = self.ready.load(Ordering::Acquire)\n            && !self.failed.load(Ordering::Acquire);',
              'bed ready gate')
          s = replace_once(s,
              '''        if let Some(worker) = self.worker.take() {
            let _ = worker.join();
        }''',
              '''        // Device invalidation must not make graph teardown wait for a
        // renderer worker that may still be initializing or finishing a block.
        let _ = self.worker.take();''',
              'bed blocking join')
          p.write_text(s)

      - name: Format and test recovery paths
        working-directory: omniphony-renderer
        run: |
          cargo fmt -p realtime_ffi
          cargo test -p realtime_ffi

      - name: Publish bounded hotfix and remove one-shot workflow
        run: |
          git rm .github/workflows/recovery-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add omniphony-renderer/realtime_ffi/src/lib.rs omniphony-renderer/realtime_ffi/src/native_bed_ffi.rs
          git diff --cached --check
          git commit -m 'windows: make audio graph recovery nonblocking'
          git push origin HEAD:main
