name: Bootstrap foo_input_vgm 0.31

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-foo-input-vgm.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect maintained public foo_input_vgm 0.31 download form
        shell: bash
        run: |
          set -euo pipefail
          page='https://uu.getuploader.com/foobar2000/download/249'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          curl --fail --location --retry 4 -A "$ua" -c cookies.txt -b cookies.txt "$page" -o download-page.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  if tag in {'form','input','button'}:
                      print(tag, dict(attrs))
          P().feed(open('download-page.html', encoding='utf-8', errors='replace').read())
          PY
