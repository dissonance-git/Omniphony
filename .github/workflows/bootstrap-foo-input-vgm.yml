name: Bootstrap foo_input_vgm 0.31

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-foo-input-vgm.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full

      - name: Fetch maintained public foo_input_vgm 0.31 package
        shell: bash
        run: |
          set -euo pipefail
          url='https://downloadx.getuploader.com/g/foobar2000/249/foo_input_vgm_v0.31.7z'
          curl --fail --location --retry 4 -A 'Mozilla/5.0' "$url" -o foo_input_vgm_v0.31.7z
          file foo_input_vgm_v0.31.7z
          7z t foo_input_vgm_v0.31.7z
          7z l foo_input_vgm_v0.31.7z | tee archive-list.txt

      - name: Upload public archive
        uses: actions/upload-artifact@v4
        with:
          name: foo-input-vgm-0.31-public
          path: |
            foo_input_vgm_v0.31.7z
            archive-list.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
