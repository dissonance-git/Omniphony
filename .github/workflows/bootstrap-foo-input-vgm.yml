name: Bootstrap foo_input_vgm 0.31

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-foo-input-vgm.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full

      - name: Fetch maintained public foo_input_vgm 0.31 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://ux.getuploader.com/foobar2000/download/249'
          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession

          Start-Sleep -Milliseconds 700
          $response = Invoke-WebRequest -Uri $uri -Method Get -WebSession $session
          $tokenField = $response.InputFields | Where-Object { $_.name -eq 'token' } | Select-Object -First 1
          if (-not $tokenField -or [string]::IsNullOrWhiteSpace($tokenField.value)) {
            throw 'uploader token field missing'
          }
          $token = $tokenField.value
          $md5Field = $response.InputFields | Where-Object { $_.name -match 'md5' } | Select-Object -First 1
          $expectedMd5 = if ($md5Field) { [string]$md5Field.value } else { '' }

          Start-Sleep -Milliseconds 700
          $response = Invoke-WebRequest -Uri $uri -Method Post -Body @{ token = $token } -WebSession $session
          $dlEncoded = $response.Links.href | Where-Object { $_ -match 'downloadx' } | Select-Object -First 1
          if (-not $dlEncoded) { throw 'Download Now URL missing after token POST' }
          Add-Type -AssemblyName System.Web
          $dlUrl = [System.Web.HttpUtility]::UrlDecode([System.Web.HttpUtility]::HtmlDecode($dlEncoded))
          Write-Host ('resolved tokenized file host: ' + ([Uri]$dlUrl).Host)

          Start-Sleep -Milliseconds 700
          Invoke-WebRequest -Uri $dlUrl -Method Get -WebSession $session -OutFile 'foo_input_vgm_v0.31.7z'
          if (-not (Test-Path 'foo_input_vgm_v0.31.7z')) { throw 'archive download missing' }
          if ($expectedMd5) {
            $actualMd5 = (Get-FileHash 'foo_input_vgm_v0.31.7z' -Algorithm MD5).Hash
            if ($actualMd5 -ne $expectedMd5) { throw "MD5 mismatch: $actualMd5 != $expectedMd5" }
          }

      - name: Validate public archive
        shell: bash
        run: |
          set -euo pipefail
          file foo_input_vgm_v0.31.7z
          7z t foo_input_vgm_v0.31.7z
          7z l foo_input_vgm_v0.31.7z | tee archive-list.txt

      - name: Upload public archive
        uses: actions/upload-artifact@v4
        with:
          name: foo-input-vgm-0.31-public
          path: |
            foo_input_vgm_v0.31.7z
            archive-list.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
