name: One-shot high-band coherence fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore apply high-band coherence fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove correlated high-band height shortcut
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('omniphony-renderer/renderer/src/music_field.rs')
          s = p.read_text()
          old = '                let front_height_mid = mid * control.broad * 0.08;'
          new = '''                // The protected master already carries the coherent stereo mid.\n                // Duplicating bright correlated mid directly into the top-front\n                // HRTF path can comb against that master after the cascaded room.\n                // Keep the shortcut for body/presence support, but above 5 kHz\n                // require height to come from relational/lateral/diffuse evidence.\n                let front_height_mid = if band == 3 {\n                    0.0\n                } else {\n                    mid * control.broad * 0.08\n                };'''
          if old not in s:
              raise SystemExit('expected front-height mid shortcut not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --manifest-path omniphony-renderer/Cargo.toml --all
          cd omniphony-renderer
          cargo test -p renderer music_field::tests

      - name: Commit and self-remove
        shell: bash
        run: |
          rm .github/workflows/oneshot-highband-coherence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(audio): remove correlated high-band height copy'
          git push
