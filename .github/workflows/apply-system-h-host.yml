name: Apply System H host handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_system_h_host.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply host handoff
        run: python .github/scripts/apply_system_h_host.py
      - name: Check patch
        run: |
          git diff --check
          cargo fmt --manifest-path omniphony-renderer/Cargo.toml --all -- --check
      - name: Commit source change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omniphony-renderer/windows_host/src/music_worker_evidence.rs
          git commit -m "feat(windows): render music support through System H shell"
          git push origin HEAD:main
