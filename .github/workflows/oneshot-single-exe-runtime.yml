name: One-shot single-executable runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch linked bridge and embedded runtime assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge = Path('omniphony-renderer/orender_engine/src/bridge_loader.rs')
          text = bridge.read_text()
          old = 'use std::path::{Path, PathBuf};\n'
          new = '''use std::path::{Path, PathBuf};
          use std::sync::OnceLock;

          static LINKED_BRIDGE_FACTORY: OnceLock<fn() -> BridgeLibRef> = OnceLock::new();

          pub fn register_linked_bridge(factory: fn() -> BridgeLibRef) -> Result<()> {
              LINKED_BRIDGE_FACTORY
                  .set(factory)
                  .map_err(|_| anyhow::anyhow!("a linked bridge is already registered"))
          }

          pub fn linked_bridge() -> Option<BridgeLibRef> {
              LINKED_BRIDGE_FACTORY.get().map(|factory| factory())
          }
          '''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''impl LoadedBridge {
              /// Load a bridge plugin from `path` and create one instance.
          '''
          new = '''impl LoadedBridge {
              pub fn from_library(lib: BridgeLibRef) -> Self {
                  install_bridge_host_log_sink(&lib);
                  let new_bridge = lib.new_bridge();
                  let bridge = new_bridge(false);
                  Self { lib, bridge }
              }

              /// Load a bridge plugin from `path` and create one instance.
          '''
          assert old in text
          text = text.replace(old, new, 1)
          bridge.write_text(text)

          engine = Path('omniphony-renderer/orender_engine/src/engine.rs')
          text = engine.read_text()
          old = '''        let config_bridge = render_cfg.as_ref().and_then(|c| c.bridge_path.clone());
                  let resolved_bridge = resolve_bridge(bridge_path, config_bridge.as_deref())?;

                  // The renderer's table mode/defaults come from the bridge, so load and
                  // configure it before building the renderer.
                  let t_bridge = std::time::Instant::now();
                  let mut bridge = LoadedBridge::load_with_params(&resolved_bridge)?;
          '''
          new = '''        let config_bridge = render_cfg.as_ref().and_then(|c| c.bridge_path.clone());

                  let t_bridge = std::time::Instant::now();
                  let (mut bridge, resolved_bridge) = if let Some(lib) = crate::bridge_loader::linked_bridge() {
                      (
                          LoadedBridge::from_library(lib),
                          std::path::PathBuf::from("<linked-bridge>"),
                      )
                  } else {
                      let path = resolve_bridge(bridge_path, config_bridge.as_deref())?;
                      let loaded = LoadedBridge::load_with_params(&path)?;
                      (loaded, path)
                  };
          '''
          assert old in text
          text = text.replace(old, new, 1)
          engine.write_text(text)

          worker = Path('omniphony-renderer/windows_host/src/music_worker_evidence.rs')
          text = worker.read_text()
          old = '''    let bundle = Bundle::beside_executable()?;
              let mut field_engine = Engine::from_paths(
                  Some(&bundle.field_config),
                  Some(&bundle.layout),
                  Some(&bundle.bridge),
                  None,
                  SAMPLE_RATE_HZ,
              )
          '''
          new = '''    let bundle = Bundle::embedded()?;
              orender_engine::bridge_loader::register_linked_bridge(reference_bridge::linked_library)
                  .context("failed to register linked reference PCM bridge")?;
              let mut field_engine = Engine::from_paths(
                  Some(&bundle.field_config),
                  Some(&bundle.layout),
                  None,
                  None,
                  SAMPLE_RATE_HZ,
              )
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''struct Bundle {
              bridge: PathBuf,
              field_config: PathBuf,
              layout: PathBuf,
          }

          impl Bundle {
              fn beside_executable() -> anyhow::Result<Self> {
                  let exe = std::env::current_exe().context("failed to resolve executable path")?;
                  let root = exe.parent().context("executable has no parent directory")?;
                  let reference = root.join("reference-demo");
                  let bundle = Self {
                      bridge: root.join("reference_bridge.dll"),
                      field_config: reference.join("stereo-field-prototype.yaml"),
                      layout: reference.join("7.1.4.yaml"),
                  };
                  require_file(&bundle.bridge, "reference PCM bridge")?;
                  require_file(&bundle.field_config, "music support-field Omniphony config")?;
                  require_file(&bundle.layout, "7.1.4 render layout")?;
                  Ok(bundle)
              }
          }

          fn require_file(path: &Path, label: &str) -> anyhow::Result<()> {
              if !path.is_file() {
                  bail!("missing {label}: {}", path.display());
              }
              Ok(())
          }
          '''
          new = '''struct Bundle {
              field_config: PathBuf,
              layout: PathBuf,
          }

          impl Bundle {
              fn embedded() -> anyhow::Result<Self> {
                  const FIELD_CONFIG: &str = include_str!(
                      "../../assets/binaural-baselines/stereo-field-prototype.yaml"
                  );
                  const LAYOUT: &str = include_str!("../../../layouts/7.1.4.yaml");

                  let root = std::env::var_os("LOCALAPPDATA")
                      .map(PathBuf::from)
                      .unwrap_or_else(std::env::temp_dir)
                      .join("Omniphony")
                      .join("runtime");
                  std::fs::create_dir_all(&root)
                      .context("failed to create embedded Omniphony runtime directory")?;
                  let field_config = root.join("stereo-field-prototype.yaml");
                  let layout = root.join("7.1.4.yaml");
                  write_embedded_asset(&field_config, FIELD_CONFIG)?;
                  write_embedded_asset(&layout, LAYOUT)?;
                  Ok(Self { field_config, layout })
              }
          }

          fn write_embedded_asset(path: &Path, content: &str) -> anyhow::Result<()> {
              let current = std::fs::read_to_string(path).ok();
              if current.as_deref() != Some(content) {
                  std::fs::write(path, content)
                      .with_context(|| format!("failed to materialize {}", path.display()))?;
              }
              Ok(())
          }
          '''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('Usage:\\n  omniphony_worker.exe [--output <name>] [--start-off]', 'Usage:\\n  Omniphony.exe (internal engine mode)', 1)
          worker.write_text(text)
          PY

          cargo fmt --manifest-path omniphony-renderer/Cargo.toml --all

      - name: Commit patch and remove one-shot
        shell: bash
        run: |
          rm .github/workflows/oneshot-single-exe-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(windows): embed runtime bridge and configs'
          git push
