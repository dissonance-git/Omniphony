name: One-shot gate cascade DFE

on:
  push:
    paths:
      - '.github/workflows/oneshot-gate-cascade-dfe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch script
        run: python .github/scripts/gate_cascade_dfe.py
      - name: Format and test renderer
        run: |
          cargo fmt --manifest-path omniphony-renderer/Cargo.toml --all
          cargo test --manifest-path omniphony-renderer/Cargo.toml -p renderer
      - name: Clean temporary diagnostics and commit
        run: |
          rm -f .github/workflows/oneshot-gate-cascade-dfe.yml
          rm -f .github/scripts/gate_cascade_dfe.py
          rm -f .github/workflows/diagnose-dfe.yml
          rm -f .github/dfe-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(audio): gate SAF cascade compensation'
          git push
