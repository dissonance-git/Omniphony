name: One-shot gate cascade DFE

on:
  push:
    paths:
      - '.github/workflows/oneshot-gate-cascade-dfe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Gate cascade DFE behind explicit SAF config
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Typed, future-expandable config. Absent/off preserves generic parity.
          p = Path('omniphony-renderer/renderer/src/config.rs')
          s = p.read_text()
          old = '''    /// Path to a SOFA HRTF file, used when `hrir_source = "sofa"`.
    #[serde(skip_serializing_if = "Option::is_none")]
    pub hrtf_sofa_path: Option<PathBuf>,'''
          new = '''    /// Path to a SOFA HRTF file, used when `hrir_source = "sofa"`.
    #[serde(skip_serializing_if = "Option::is_none")]
    pub hrtf_sofa_path: Option<PathBuf>,
    /// Cascade-only common HRTF colour compensation. Absent / "off" keeps
    /// generic direct↔cascade parity; "saf_partial" opts into the measured,
    /// bounded SAF/KEMAR diffuse-field correction used by the music host.
    #[serde(skip_serializing_if = "Option::is_none")]
    pub spectral_compensation: Option<String>,'''
          if old not in s:
              raise SystemExit('BinauralConfig insertion anchor missing')
          p.write_text(s.replace(old, new, 1))

          # Store the static opt-in in SpatialRenderer, outside generic LiveParams.
          p = Path('omniphony-renderer/renderer/src/spatial_renderer/mod.rs')
          s = p.read_text()
          old = '''    /// Scratch per-channel world positions for the binaural path (reused).
    binaural_pos_buf: Vec<[f64; 3]>,'''
          new = '''    /// Explicit host/config opt-in for cascade-only spectral compensation.
    /// Defaults false so generic cascade remains numerically comparable to the
    /// direct binaural path; the music topology opts in for SAF/KEMAR only.
    cascade_spectral_compensation: bool,

    /// Scratch per-channel world positions for the binaural path (reused).
    binaural_pos_buf: Vec<[f64; 3]>,'''
          if old not in s:
              raise SystemExit('SpatialRenderer field anchor missing')
          s = s.replace(old, new, 1)

          old = '''    pub fn auto_gain_triggered(&self) -> bool {
        self.auto_gain_triggered
            .load(std::sync::atomic::Ordering::Relaxed)
    }
'''
          new = '''    pub fn auto_gain_triggered(&self) -> bool {
        self.auto_gain_triggered
            .load(std::sync::atomic::Ordering::Relaxed)
    }

    /// Enable/disable the cascade-only common HRTF spectral compensation.
    /// This is intentionally a construction/host policy rather than a generic
    /// binaural default: direct mode and unconfigured cascades remain untouched.
    pub fn set_cascade_spectral_compensation(&mut self, enabled: bool) {
        self.cascade_spectral_compensation = enabled;
    }
'''
          if old not in s:
              raise SystemExit('SpatialRenderer method anchor missing')
          s = s.replace(old, new, 1)

          old = '''            let (binaural_params, ears) = {
                let g = self.control.live.read();'''
          new = '''            let (binaural_params, ears, saf_cascade_compensation) = {
                let g = self.control.live.read();'''
          if old not in s:
              raise SystemExit('binaural snapshot tuple anchor missing')
          s = s.replace(old, new, 1)

          old = '''                    },
                    g.binaural.ears,
                )
            };'''
          new = '''                    },
                    g.binaural.ears,
                    self.cascade_spectral_compensation
                        && matches!(g.binaural.hrir_source, crate::binaural::HrirSource::SafKemar),
                )
            };'''
          if old not in s:
              raise SystemExit('binaural snapshot tuple close anchor missing')
          s = s.replace(old, new, 1)

          old = '''                    live.speaker_params,
                    &binaural_params,
                    &mut output,
                );'''
          new = '''                    live.speaker_params,
                    &binaural_params,
                    saf_cascade_compensation,
                    &mut output,
                );'''
          if old not in s:
              raise SystemExit('cascade call anchor missing')
          p.write_text(s.replace(old, new, 1))

          # Seed the static renderer field to OFF in all generic constructors.
          p = Path('omniphony-renderer/renderer/src/spatial_renderer/construction.rs')
          s = p.read_text()
          old = '''            binaural: crate::binaural::BinauralRenderer::new(sample_rate),
            cascade: None,
            last_mix_num_speakers: 0,
            binaural_pos_buf: Vec::new(),'''
          new = '''            binaural: crate::binaural::BinauralRenderer::new(sample_rate),
            cascade: None,
            last_mix_num_speakers: 0,
            cascade_spectral_compensation: false,
            binaural_pos_buf: Vec::new(),'''
          if old not in s:
              raise SystemExit('construction field anchor missing')
          p.write_text(s.replace(old, new, 1))

          # The cascade receives an explicit per-frame permission bit.
          p = Path('omniphony-renderer/renderer/src/spatial_renderer/cascade.rs')
          s = p.read_text()
          old = '''    speaker_params: &[crate::live_params::SpeakerLiveParams],
    binaural_params: &crate::binaural::BinauralFrameParams,
    output: &mut [f32],'''
          new = '''    speaker_params: &[crate::live_params::SpeakerLiveParams],
    binaural_params: &crate::binaural::BinauralFrameParams,
    spectral_compensation: bool,
    output: &mut [f32],'''
          if old not in s:
              raise SystemExit('cascade signature anchor missing')
          s = s.replace(old, new, 1)

          old = '''    let compensation = cascade
        .diffuse_compensation
        .get_or_insert_with(|| DiffuseFieldCompensator::saf_kemar_partial(stage.sample_rate));
    compensation.process_interleaved_stereo_in_place(output);

    diag'''
          new = '''    if spectral_compensation {
        let compensation = cascade
            .diffuse_compensation
            .get_or_insert_with(|| DiffuseFieldCompensator::saf_kemar_partial(stage.sample_rate));
        compensation.process_interleaved_stereo_in_place(output);
    } else if let Some(compensation) = cascade.diffuse_compensation.as_mut() {
        // If a host turns the static policy off between streams, clear any IIR
        // history so a later opt-in begins from silence rather than old state.
        compensation.reset_runtime_state();
    }

    diag'''
          if old not in s:
              raise SystemExit('cascade unconditional DFE anchor missing')
          p.write_text(s.replace(old, new, 1))

          # Embedded/headless engine reads the explicit config. Unknown values
          # fail closed with a warning rather than silently enabling DSP.
          p = Path('omniphony-renderer/orender_engine/src/engine.rs')
          s = p.read_text()
          old = '''        let renderer = build_spatial_renderer(
            &params,
            layout,
            sample_rate,
            vbap_defaults,
            preferred,
            render_cfg.as_ref(),
        )?;

        // Seed monitoring cadences from config'''
          new = '''        let mut renderer = build_spatial_renderer(
            &params,
            layout,
            sample_rate,
            vbap_defaults,
            preferred,
            render_cfg.as_ref(),
        )?;
        let cascade_spectral_compensation = render_cfg
            .as_ref()
            .and_then(|render| render.binaural.as_ref())
            .and_then(|binaural| binaural.spectral_compensation.as_deref())
            .is_some_and(|mode| mode.eq_ignore_ascii_case("saf_partial"));
        if let Some(mode) = render_cfg
            .as_ref()
            .and_then(|render| render.binaural.as_ref())
            .and_then(|binaural| binaural.spectral_compensation.as_deref())
        {
            if !mode.eq_ignore_ascii_case("off") && !mode.eq_ignore_ascii_case("saf_partial") {
                log::warn!(
                    "unknown binaural spectral_compensation '{}'; leaving cascade compensation off",
                    mode
                );
            }
        }
        renderer.set_cascade_spectral_compensation(cascade_spectral_compensation);

        // Seed monitoring cadences from config'''
          if old not in s:
              raise SystemExit('Engine renderer construction anchor missing')
          p.write_text(s.replace(old, new, 1))

          # Our music baseline explicitly opts in; generic configs do not.
          p = Path('omniphony-renderer/assets/binaural-baselines/stereo-field-prototype.yaml')
          s = p.read_text()
          old = '''    mode: cascaded
    hrir_source: saf

    unit_scale_m: 7.25'''
          new = '''    mode: cascaded
    hrir_source: saf
    spectral_compensation: saf_partial

    unit_scale_m: 7.25'''
          if old not in s:
              raise SystemExit('music config binaural anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY

          cargo fmt --manifest-path omniphony-renderer/Cargo.toml --all
          cargo test --manifest-path omniphony-renderer/Cargo.toml -p renderer

      - name: Clean diagnostics and commit
        shell: bash
        run: |
          rm -f .github/workflows/oneshot-gate-cascade-dfe.yml
          rm -f .github/workflows/diagnose-dfe.yml
          rm -f .github/dfe-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(audio): gate SAF cascade compensation'
          git push
