name: Bootstrap clang 19

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-clang19.yml'

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - name: Install clang 19 and lld 19
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-19 lld-19
          clang-19 --version
          lld-link-19 --version
          test -x /usr/lib/llvm-19/bin/clang-cl
          test -x /usr/lib/llvm-19/bin/lld-link

      - name: Stage portable LLVM 19 tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p llvm19
          cp -a /usr/lib/llvm-19/. llvm19/
          test -x llvm19/bin/clang-cl
          test -x llvm19/bin/lld-link
          du -sh llvm19

      - name: Upload LLVM 19
        uses: actions/upload-artifact@v4
        with:
          name: llvm19-linux-x64
          path: llvm19/
          compression-level: 6
          retention-days: 1
          if-no-files-found: error
