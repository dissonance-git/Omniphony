name: One-shot finalize fatigue tuning

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-finalize-fatigue-tuning.yml

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: 1.88.0

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"

      - name: Restore fatigue-safe tuning without low-body halo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          field = Path('omniphony-renderer/renderer/src/music_field.rs')
          text = field.read_text(encoding='utf-8')
          replacements = {
              'const HIGH_BAND_SUPPORT_SCALE: f32 = 0.58;': 'const HIGH_BAND_SUPPORT_SCALE: f32 = 0.52;',
              'const PRESENCE_SUPPORT_SCALE: f32 = 0.90;': 'const PRESENCE_SUPPORT_SCALE: f32 = 0.86;',
              '(0.12, 0.045, 0.10, 0.045)': '(0.10, 0.040, 0.085, 0.040)',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}')
              text = text.replace(old, new, 1)
          field.write_text(text, encoding='utf-8')

          worker = Path('omniphony-renderer/windows_host/src/music_worker_evidence.rs')
          text = worker.read_text(encoding='utf-8')
          old = '    println!("  field:   160-320 Hz stereo-motion halo + 320+ Hz full 7.1.4 support");'
          new = '    println!("  field:   below 320 Hz protected; 320+ Hz derived 7.1.4 support");'
          if text.count(old) != 1:
              raise SystemExit('expected stale low-motion diagnostic exactly once')
          worker.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format and validate affected audio code
        working-directory: omniphony-renderer
        run: |
          cargo fmt --all
          cargo test -p renderer music_field::tests -- --nocapture
          cargo test -p renderer
          cargo check -p windows_host --bins

      - name: Commit source repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omniphony-renderer/renderer/src/music_field.rs omniphony-renderer/windows_host/src/music_worker_evidence.rs
          git diff --cached --check
          git commit -m "fix(audio): restore fatigue-safe cascade tuning"
          git push origin HEAD:main
