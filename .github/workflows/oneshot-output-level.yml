name: One-shot output level reclaim

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: apply output level reclaim' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reclaim fixed output level
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('omniphony-renderer/windows_host/src/music_worker_evidence.rs')
          s = p.read_text()
          old = 'const LINEAR_OUTPUT_GAIN: f32 = 0.72;'
          if old not in s:
              raise SystemExit('expected baseline output gain not found')
          s = s.replace(old, 'const LINEAR_OUTPUT_GAIN: f32 = 0.90;', 1)
          s = s.replace('about 2.85 dB of fixed headroom', 'about 0.9 dB of fixed headroom', 1)
          p.write_text(s)
          PY
          cargo fmt --manifest-path omniphony-renderer/Cargo.toml --all

      - name: Commit and self-remove
        shell: bash
        run: |
          rm .github/workflows/oneshot-output-level.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(audio): reclaim playback level'
          git push
