name: Windows installer script parse

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer-script-parse.yml'
      - 'omniphony-renderer/windows_installer/**/*.ps1'

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer PowerShell
        shell: powershell
        run: |
          $failed = $false
          $files = @(Get-ChildItem 'omniphony-renderer\windows_installer' -Recurse -Filter '*.ps1' -File)
          foreach ($item in $files) {
            $file = $item.FullName
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PARSE_FAILED $file"
              $errors | ForEach-Object { Write-Error $_.Message }
            } else {
              Write-Host "PARSE_OK $file"
            }
          }
          if ($failed) { exit 1 }
