name: Windows installer script parse

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer-script-parse.yml'
      - 'omniphony-renderer/windows_installer/**/*.ps1'

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer PowerShell
        shell: powershell
        run: |
          $failed = $false
          $files = @(
            'omniphony-renderer\windows_installer\endpoint_apo\Install-OmniphonyAPO.ps1',
            'omniphony-renderer\windows_installer\endpoint_apo\Uninstall-OmniphonyAPO.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PARSE_FAILED $file"
              $errors | ForEach-Object { Write-Error $_.Message }
            } else {
              Write-Host "PARSE_OK $file"
            }
          }
          if ($failed) { exit 1 }
