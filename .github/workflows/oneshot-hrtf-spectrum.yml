name: One-shot HRTF spectral measurement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  measure:
    if: "${{ github.event.head_commit.message == 'chore run HRTF spectral measurement' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add and run diffuse-spectrum fingerprint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('omniphony-renderer/renderer/src/binaural/hrir.rs')
          s = p.read_text()
          marker = '''    #[test]\n    fn pinna_depth_zero_matches_synthetic() {'''
          insert = r'''    /// Direction-weighted diffuse spectral fingerprint of the active SAF
    /// KEMAR grid. Broadband energy normalization alone cannot reveal a common
    /// frequency-dependent HRTF colour; this metric is the reference a future
    /// support-only diffuse-field compensation stage should flatten.
    #[test]
    fn saf_diffuse_spectral_profile_is_measurable() {
        fn power_at(pair: &HrirPair, frequency_hz: f64, sample_rate: f64) -> f64 {
            let omega = std::f64::consts::TAU * frequency_hz / sample_rate;
            let ear_power = |h: &[f32; HRIR_LEN]| -> f64 {
                let mut re = 0.0f64;
                let mut im = 0.0f64;
                for (n, &x) in h.iter().enumerate() {
                    let phase = omega * n as f64;
                    re += x as f64 * phase.cos();
                    im -= x as f64 * phase.sin();
                }
                re * re + im * im
            };
            0.5 * (ear_power(&pair.left) + ear_power(&pair.right))
        }

        fn diffuse_power_db(set: &HrirSet, frequency_hz: f64) -> f64 {
            let mut weighted = 0.0f64;
            let mut weights = 0.0f64;
            for ei in 0..set.el_count {
                let el = HrirSet::EL_MIN_DEG + ei as f32 * HrirSet::EL_STEP_DEG;
                let w = el.to_radians().cos().max(0.0) as f64;
                for ai in 0..set.az_count {
                    weighted += w * power_at(
                        &set.grid[ei * set.az_count + ai],
                        frequency_hz,
                        48_000.0,
                    );
                    weights += w;
                }
            }
            let p = (weighted / weights.max(1.0e-12)).max(1.0e-20);
            10.0 * p.log10()
        }

        let set = HrirSet::new(
            &crate::binaural::measured::MeasuredHrirData::saf_kemar(),
            48_000,
        );
        let frequencies = [
            500.0, 1_000.0, 2_000.0, 3_000.0, 4_000.0, 5_000.0, 6_000.0,
            8_000.0, 10_000.0, 12_000.0, 14_000.0, 16_000.0,
        ];
        let reference_db = diffuse_power_db(&set, 1_000.0);
        let mut min_relative = f64::INFINITY;
        let mut max_relative = f64::NEG_INFINITY;
        eprintln!("SAF KEMAR diffuse spectral profile, relative to 1 kHz:");
        for frequency in frequencies {
            let relative = diffuse_power_db(&set, frequency) - reference_db;
            assert!(relative.is_finite(), "non-finite profile at {frequency} Hz");
            min_relative = min_relative.min(relative);
            max_relative = max_relative.max(relative);
            eprintln!("  {frequency:>7.0} Hz  {relative:+7.2} dB");
        }
        let span = max_relative - min_relative;
        eprintln!("  sampled diffuse spectral span: {span:.2} dB");
        assert!(span < 40.0, "implausible SAF diffuse spectral span: {span:.2} dB");
    }

'''
          if marker not in s:
              raise SystemExit('HRIR test insertion marker missing')
          p.write_text(s.replace(marker, insert + marker, 1))
          PY
          cargo fmt --manifest-path omniphony-renderer/Cargo.toml --all
          cd omniphony-renderer
          cargo test -p renderer saf_diffuse_spectral_profile_is_measurable -- --nocapture

      - name: Commit measurement and self-remove
        shell: bash
        run: |
          rm .github/workflows/oneshot-hrtf-spectrum.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(audio): fingerprint SAF diffuse spectrum'
          git push
