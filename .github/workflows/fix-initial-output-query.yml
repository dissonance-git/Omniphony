name: Fix pre-render output query

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-initial-output-query.yml

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"

      - name: Apply patch
        shell: bash
        run: |
          python scripts/ci/fix_initial_output_query.py
          git diff --check

      - name: Verify Current initialization and mode safety
        working-directory: omniphony-renderer
        shell: bash
        run: |
          cargo test -p realtime_ffi current_reports_fixed_host_latency --lib -- --nocapture
          cargo test -p renderer completed_frame_keeps_its_own_width_after_live_flip --lib
          cargo test -p renderer output_mode_switch_fades_and_every_frame_describes_itself --lib

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "dissonance"
          git config user.email "ustreamusa@aim.com"
          git add omniphony-renderer/renderer/src/spatial_renderer/mod.rs
          git commit -m "fix(renderer): honor requested mode before first frame"
          git pull --rebase origin main
          git push origin HEAD:main
