name: One-shot baseline renderer repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-baseline-renderer-repair.yml

permissions:
  contents: write

concurrency:
  group: oneshot-baseline-renderer-repair
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  repair-test-report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact triggering main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Repair, test, and publish one bounded result
        shell: bash
        run: |
          set +e
          base_sha=$(git rev-parse HEAD)
          failed_stage=""
          mkdir -p /tmp/omniphony-baseline

          python .github/ci/baseline_renderer_repair.py > /tmp/omniphony-baseline/patch.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then failed_stage="apply_patch"; fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo fmt --all) > /tmp/omniphony-baseline/fmt.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="cargo_fmt"; fi
          fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo test -p renderer measured_hrir_direct_arrivals_are_time_aligned -- --nocapture) > /tmp/omniphony-baseline/hrir.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="measured_hrir_alignment"; fi
          fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && OMNIPHONY_BLESS_GOLDENS=1 cargo test -p renderer null_binaural_kemar -- --nocapture) > /tmp/omniphony-baseline/bless.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="bless_binaural_kemar"; fi
          fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo test -p dsp_fixtures -- --nocapture) > /tmp/omniphony-baseline/dsp.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="dsp_fixtures"; fi
          fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo test -p renderer) > /tmp/omniphony-baseline/renderer.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="renderer_tests"; fi
          fi

          if [ -z "$failed_stage" ]; then
            git diff --check > /tmp/omniphony-baseline/diff.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="git_diff_check"; fi
          fi

          git fetch origin main > /tmp/omniphony-baseline/fetch.log 2>&1
          remote_sha=$(git rev-parse origin/main)
          if [ "$remote_sha" != "$base_sha" ]; then
            failed_stage="stale_head_${base_sha}_to_${remote_sha}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$failed_stage" ]; then
            git add \
              omniphony-renderer/renderer/src/binaural/measured.rs \
              omniphony-renderer/renderer/src/binaural/validation.rs \
              omniphony-renderer/dsp_fixtures/goldens/binaural_kemar.f32
            if git diff --cached --quiet; then
              failed_stage="no_baseline_repair_produced"
            else
              git commit -m "fix(binaural): align measured HRIR validation and KEMAR baseline"
              git push origin HEAD:main
              exit $?
            fi
          fi

          git reset --hard "$base_sha"
          mkdir -p ci-diagnostics
          report=ci-diagnostics/baseline-renderer-repair.txt
          {
            echo "Omniphony guarded baseline renderer repair"
            echo "base_sha=$base_sha"
            echo "failed_stage=$failed_stage"
            echo "rust_toolchain=$RUST_TOOLCHAIN"
            echo
            for log in patch fmt hrir bless dsp renderer diff fetch; do
              path="/tmp/omniphony-baseline/${log}.log"
              if [ -f "$path" ]; then
                echo "===== ${log}.log (last 260 lines) ====="
                tail -n 260 "$path"
                echo
              fi
            done
          } > "$report"
          git add "$report"
          git commit -m "ci: record baseline renderer repair failure"
          git push origin HEAD:main
          exit 1
