name: One-shot finalize output-device recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-finalize-device-recovery.yml

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: 1.88.0

jobs:
  patch-test-commit:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
          rustup override set $env:RUST_TOOLCHAIN

      - name: Make playback-device failure restartable
        shell: python
        run: |
          from pathlib import Path

          path = Path('omniphony-renderer/windows_host/src/music_worker_evidence.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''    let playback_underrun_frames = Arc::new(AtomicU64::new(0));
    let (play_tx, play_rx) = sync_channel::<Vec<f32>>(PLAYBACK_QUEUE_BLOCKS);
''',
                  '''    let playback_underrun_frames = Arc::new(AtomicU64::new(0));
    let playback_failed = Arc::new(AtomicBool::new(false));
    let (play_tx, play_rx) = sync_channel::<Vec<f32>>(PLAYBACK_QUEUE_BLOCKS);
'''
              ),
              (
                  '''        play_rx,
        Arc::clone(&playback_underrun_frames),
    )?;
''',
                  '''        play_rx,
        Arc::clone(&playback_underrun_frames),
        Arc::clone(&playback_failed),
    )?;
'''
              ),
              (
                  '''    while !quit.load(Ordering::Relaxed) {
        let Some(input) = loopback.next_block()? else {
''',
                  '''    while !quit.load(Ordering::Relaxed) {
        if playback_failed.load(Ordering::Acquire) {
            bail!("WASAPI playback stream failed; supervisor will restart the audio engine");
        }
        let Some(input) = loopback.next_block()? else {
'''
              ),
              (
                  '''    rx: Receiver<Vec<f32>>,
    underrun_frames: Arc<AtomicU64>,
) -> anyhow::Result<cpal::Stream> {
''',
                  '''    rx: Receiver<Vec<f32>>,
    underrun_frames: Arc<AtomicU64>,
    stream_failed: Arc<AtomicBool>,
) -> anyhow::Result<cpal::Stream> {
'''
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one source fragment: {old[:80]!r}')
              text = text.replace(old, new, 1)

          for ty in ['i8', 'i16', 'i32', 'i64', 'u8', 'u16', 'u32', 'u64', 'f32', 'f64']:
              old = f'build_typed_playback::<{ty}>(device, config, rx, underrun_frames)'
              new = f'build_typed_playback::<{ty}>(device, config, rx, underrun_frames, stream_failed)'
              if text.count(old) != 1:
                  raise SystemExit(f'expected one playback dispatch for {ty}')
              text = text.replace(old, new, 1)

          old = '''    rx: Receiver<Vec<f32>>,
    underrun_frames: Arc<AtomicU64>,
) -> anyhow::Result<cpal::Stream>
where
'''
          new = '''    rx: Receiver<Vec<f32>>,
    underrun_frames: Arc<AtomicU64>,
    stream_failed: Arc<AtomicBool>,
) -> anyhow::Result<cpal::Stream>
where
'''
          if text.count(old) != 1:
              raise SystemExit('typed playback signature not found exactly once')
          text = text.replace(old, new, 1)

          old = '    let err_fn = |err| eprintln!("WASAPI playback stream error: {err}");\n'
          new = '''    let err_fn = move |err| {
        eprintln!("WASAPI playback stream error: {err}");
        stream_failed.store(true, Ordering::Release);
    };
'''
          if text.count(old) != 1:
              raise SystemExit('playback error callback not found exactly once')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Format and validate Windows host
        working-directory: omniphony-renderer
        run: |
          cargo fmt --all
          cargo check -p windows_host --bins
          cargo test -p windows_host

      - name: Commit source repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omniphony-renderer/windows_host/src/music_worker_evidence.rs
          git diff --cached --check
          git commit -m "fix(windows): restart after playback device failure"
          git push origin HEAD:main
