name: Fix HRIR fixture determinism

on:
  push:
    paths:
      - '.github/workflows/fix-hrir-fixture-determinism.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        working-directory: omniphony-renderer
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0
      - name: Apply fixture repair
        run: |
          python .github/scripts/fix_hrir_fixture_determinism.py
          git diff --check
      - name: Stress exact determinism
        working-directory: omniphony-renderer
        run: |
          for i in $(seq 1 25); do
            echo "determinism pass $i/25"
            cargo test -q -p dsp_fixtures repeated_synthetic_binaural_fixture_is_deterministic
          done
      - name: Validate ITD gates
        working-directory: omniphony-renderer
        run: |
          cargo test -q -p renderer binaural::validation::itd_is_antisymmetric_about_the_median_plane
          cargo test -q -p renderer binaural::validation::itd_magnitude_tracks_the_model
          cargo test -q -p renderer binaural::validation::itd_magnitude_grows_toward_the_interaural_axis
      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add omniphony-renderer/dsp_fixtures/src/scene.rs
          git commit -m 'test(dsp): canonicalize state after HRIR handoff'
          git push origin HEAD:main
