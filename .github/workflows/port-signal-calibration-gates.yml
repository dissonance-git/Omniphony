name: Port diagnostic signal calibration gates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/port-signal-calibration-gates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup override set 1.88.0
        working-directory: omniphony-renderer

      - name: Add signal calibration gates
        run: python3 .github/ci/port_signal_calibration_gates.py

      - name: Format touched fixture
        run: rustfmt --edition 2024 omniphony-renderer/dsp_fixtures/src/diagnostic_signals.rs

      - name: Verify patch scope
        run: |
          git diff --check
          git diff --stat
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "omniphony-renderer/dsp_fixtures/src/diagnostic_signals.rs"

      - name: Run signal calibration gates
        id: focused
        shell: bash
        run: |
          set +e
          cargo test -p dsp_fixtures diagnostic_signals::tests:: -- --nocapture 2>&1 | tee /tmp/signal-calibration.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: omniphony-renderer

      - name: Record focused failure breadcrumb
        if: steps.focused.outputs.status != '0'
        run: |
          {
            echo "SIGNAL_CALIBRATION_FOCUSED_FAILURE"
            echo "head=${GITHUB_SHA}"
            echo
            tail -n 240 /tmp/signal-calibration.log
          } > .github/ci/signal-calibration-failure.txt
          git config user.name "omniphony-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/ci/signal-calibration-failure.txt
          git commit -m "ci: record signal calibration focused failure"
          git push origin HEAD:main

      - name: Stop after focused failure
        if: steps.focused.outputs.status != '0'
        run: exit 1

      - name: Run full DSP fixture suite
        id: full
        shell: bash
        run: |
          set +e
          cargo test -p dsp_fixtures 2>&1 | tee /tmp/signal-calibration-full.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: omniphony-renderer

      - name: Record full-suite failure breadcrumb
        if: steps.full.outputs.status != '0'
        run: |
          {
            echo "SIGNAL_CALIBRATION_FULL_SUITE_FAILURE"
            echo "head=${GITHUB_SHA}"
            echo
            tail -n 240 /tmp/signal-calibration-full.log
          } > .github/ci/signal-calibration-failure.txt
          git config user.name "omniphony-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/ci/signal-calibration-failure.txt
          git commit -m "ci: record signal calibration full-suite failure"
          git push origin HEAD:main

      - name: Stop after full-suite failure
        if: steps.full.outputs.status != '0'
        run: exit 1

      - name: Publish validated gates
        run: |
          git config user.name "omniphony-ci"
          git config user.email "actions@users.noreply.github.com"
          git add omniphony-renderer/dsp_fixtures/src/diagnostic_signals.rs
          git commit -m "test(dsp): calibrate diagnostic pink-noise stimulus"
          git push origin HEAD:main
