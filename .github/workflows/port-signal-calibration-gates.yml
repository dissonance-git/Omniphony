name: Port diagnostic signal calibration gates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/port-signal-calibration-gates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup override set 1.88.0
        working-directory: omniphony-renderer

      - name: Add signal calibration gates
        run: python3 .github/ci/port_signal_calibration_gates.py

      - name: Format touched fixture
        run: rustfmt --edition 2024 omniphony-renderer/dsp_fixtures/src/diagnostic_signals.rs

      - name: Verify patch scope
        run: |
          git diff --check
          git diff --stat
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "omniphony-renderer/dsp_fixtures/src/diagnostic_signals.rs"

      - name: Run signal calibration gates
        run: cargo test -p dsp_fixtures diagnostic_signals::tests:: -- --nocapture
        working-directory: omniphony-renderer

      - name: Run full DSP fixture suite
        run: cargo test -p dsp_fixtures
        working-directory: omniphony-renderer

      - name: Publish validated gates
        run: |
          git config user.name "omniphony-ci"
          git config user.email "actions@users.noreply.github.com"
          git add omniphony-renderer/dsp_fixtures/src/diagnostic_signals.rs
          git commit -m "test(dsp): calibrate diagnostic pink-noise stimulus"
          git push origin HEAD:main
