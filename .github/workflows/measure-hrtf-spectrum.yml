name: Temporary HRTF spectral measurement

on:
  push:
    paths:
      - '.github/workflows/measure-hrtf-spectrum.yml'

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Print SAF diffuse spectrum
        run: cargo test --manifest-path omniphony-renderer/Cargo.toml -p renderer --test hrtf_diffuse_spectrum -- --nocapture
