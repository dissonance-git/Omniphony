name: Omniphony for Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'docs/omniphony-for-windows.md'
      - 'omniphony-renderer/windows_installer/**'
      - 'omniphony-renderer/windows_endpoint/**'
      - 'omniphony-renderer/windows_host/**'
      - 'omniphony-renderer/renderer/**'
      - 'omniphony-renderer/realtime_ffi/**'
      - 'omniphony-renderer/Cargo.toml'
      - 'omniphony-renderer/Cargo.lock'

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.88.0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-installer:
    name: Build Windows 11 x64 single EXE installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout Omniphony fork
        uses: actions/checkout@v4
        with:
          path: omniphony

      - name: Record source revision
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\omniphony"
          Write-Host "Omniphony for Windows source=$(git rev-parse HEAD)"
          git status --short

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
          Set-Location "$env:GITHUB_WORKSPACE\omniphony\omniphony-renderer"
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Prepare personal Omniphony for Windows host
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\omniphony\omniphony-renderer\windows_installer\Prepare-OmniphonyForWindows.ps1" `
            -Mode Host `
            -SourceRoot "$env:GITHUB_WORKSPACE\omniphony\omniphony-renderer"

      - name: Validate installer control plane
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP 'omniphony-installer-validate'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          & "$env:GITHUB_WORKSPACE\omniphony\omniphony-renderer\windows_installer\Install-OmniphonyForWindows.ps1" `
            -Action Validate `
            -AppRoot $scratch
          if ($LASTEXITCODE -ne 0) { throw "Installer control-plane validation failed: $LASTEXITCODE" }

      - name: Test portable renderer and host contracts
        shell: pwsh
        working-directory: omniphony/omniphony-renderer
        run: |
          cargo fmt --all
          cargo test -p audio_contract
          cargo test -p realtime_ffi
          cargo test -p source_ffi
          cargo test -p dsp_fixtures
          cargo test -p renderer -- --skip binaural::tests::hrir_source_switch_lands_asynchronously_without_blocking_render
          cargo test -p reference_bridge -p orender_engine
          cargo test -p windows_host --bin omniphony_app music_early_reflections::tests
          cargo test -p windows_host --bin omniphony_app music_engine::tests

      - name: Build Omniphony Windows host
        shell: pwsh
        working-directory: omniphony/omniphony-renderer
        run: |
          cargo build --profile release-deploy -p windows_host --bin omniphony_app
          if ($LASTEXITCODE -ne 0) { throw "Omniphony Windows host build failed: $LASTEXITCODE" }

      - name: Checkout pinned virtual-audio endpoint source
        uses: actions/checkout@v4
        with:
          repository: VirtualDrivers/Virtual-Audio-Driver
          ref: bb34fba15faf569a6ae9bdea360bc1cf4821354e
          path: endpoint-upstream

      - name: Prepare Omniphony endpoint source
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\endpoint-upstream"
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne 'bb34fba15faf569a6ae9bdea360bc1cf4821354e') {
            throw "Unexpected endpoint bootstrap revision: $head"
          }

          & "$env:GITHUB_WORKSPACE\omniphony\omniphony-renderer\windows_endpoint\Prepare-SpatialEndpoint.ps1" `
            -SourceRoot "$env:GITHUB_WORKSPACE\endpoint-upstream"
          & "$env:GITHUB_WORKSPACE\omniphony\omniphony-renderer\windows_installer\Prepare-OmniphonyForWindows.ps1" `
            -Mode Endpoint `
            -SourceRoot "$env:GITHUB_WORKSPACE\endpoint-upstream"

      - name: Setup VS2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Ensure Windows 11 WDK
        shell: pwsh
        run: |
          choco install windowsdriverkit11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "WDK installation failed: $LASTEXITCODE" }

          $kitsRoot = 'C:\Program Files (x86)\Windows Kits\10'
          $wdkVersions = Get-ChildItem "$kitsRoot\Include" -Directory -ErrorAction Stop |
            Where-Object {
              $_.Name -match '^10\.0\.\d+\.\d+$' -and
              (Test-Path (Join-Path $_.FullName 'km\portcls.h')) -and
              (Test-Path "$kitsRoot\Lib\$($_.Name)\km\x64\portcls.lib")
            } |
            Sort-Object { [version]$_.Name } -Descending
          $wdk = $wdkVersions | Select-Object -First 1
          if (-not $wdk) { throw 'Installed WDK exposes no x64 PortCls development surface' }
          "OMNIPHONY_WDK_VERSION=$($wdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "WDK=$($wdk.Name)"

      - name: Build Omniphony virtual endpoint
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\endpoint-upstream"
          msbuild 'VirtualAudioDriver.sln' /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RunCodeAnalysis=false `
            /p:InfVerif_Enable=false `
            /p:UseInfVerifierEx=false
          if ($LASTEXITCODE -ne 0) { throw "Omniphony endpoint build failed: $LASTEXITCODE" }

      - name: Validate endpoint INF with WDK InfVerif
        shell: pwsh
        run: |
          $package = "$env:GITHUB_WORKSPACE\endpoint-upstream\x64\Release\package"
          $inf = Get-ChildItem $package -Filter '*.inf' -File | Select-Object -First 1
          if (-not $inf) { throw 'Endpoint build produced no INF' }

          $kitsRoot = 'C:\Program Files (x86)\Windows Kits\10'
          $infverif = Get-ChildItem "$kitsRoot\Tools" -Recurse -Filter 'InfVerif.exe' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\InfVerif\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $infverif) {
            $infverif = Get-ChildItem "$kitsRoot\bin" -Recurse -Filter 'InfVerif.exe' -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\InfVerif\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $infverif) { throw 'Standalone x64 WDK InfVerif.exe not found' }

          & $infverif.FullName /w /v $inf.FullName
          if ($LASTEXITCODE -ne 0) { throw "InfVerif /w failed: $LASTEXITCODE" }

          $infText = Get-Content -Raw $inf.FullName
          if ($infText -notmatch 'ROOT\\SpatialAudioEndpoint') { throw 'Stable development hardware ID missing' }
          if ($infText -notmatch 'WaveSpeaker\.szPname="Omniphony"') { throw 'Omniphony endpoint friendly name missing' }
          if ($infText -match '(?m)^AddInterface=.*WaveMicArray1') { throw 'Sample microphone endpoint unexpectedly exposed' }

      - name: Assemble installer payload
        shell: pwsh
        run: |
          $payload = "$env:GITHUB_WORKSPACE\payload"
          $app = Join-Path $payload 'app'
          $driver = Join-Path $payload 'driver'
          $support = Join-Path $payload 'support'
          New-Item -ItemType Directory -Force $app, $driver, $support | Out-Null

          Copy-Item "$env:GITHUB_WORKSPACE\omniphony\omniphony-renderer\target\release-deploy\omniphony_app.exe" "$app\Omniphony.exe" -Force

          $release = "$env:GITHUB_WORKSPACE\endpoint-upstream\x64\Release"
          $package = "$release\package"
          $certificate = "$release\package.cer"
          if (-not (Test-Path $certificate)) { throw "WDK development certificate missing: $certificate" }
          Copy-Item "$package\*" $driver -Recurse -Force
          Copy-Item $certificate "$driver\SpatialEndpoint-Development.cer" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\omniphony\omniphony-renderer\windows_endpoint\SpatialEndpoint.ps1" "$driver\SpatialEndpoint.ps1" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\endpoint-upstream\LICENSE" "$driver\UPSTREAM-LICENSE.txt" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\endpoint-upstream\THIRD_PARTY_NOTICES.md" "$driver\THIRD_PARTY_NOTICES.md" -Force

          Copy-Item "$env:GITHUB_WORKSPACE\omniphony\omniphony-renderer\windows_installer\Install-OmniphonyForWindows.ps1" "$support\Install-OmniphonyForWindows.ps1" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\omniphony\LICENSE" "$payload\LICENSE" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\omniphony\docs\omniphony-for-windows.md" "$payload\PRODUCT-CONTEXT.md" -Force

          Get-ChildItem $payload -Recurse -File | Select-Object FullName, Length

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          "ISCC_EXE=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build OmniphonySetup.exe
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\dist"
          New-Item -ItemType Directory -Force $out | Out-Null
          $iss = "$env:GITHUB_WORKSPACE\omniphony\omniphony-renderer\windows_installer\OmniphonySetup.iss"
          & $env:ISCC_EXE "/DPayloadDir=$env:GITHUB_WORKSPACE\payload" "/DOutputDir=$out" $iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed: $LASTEXITCODE" }

          $setup = Join-Path $out 'OmniphonySetup.exe'
          if (-not (Test-Path $setup)) { throw 'OmniphonySetup.exe was not produced' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "OMNIPHONY_SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "OmniphonySetup.exe SHA256=$hash"
          Get-Item $setup | Format-List FullName, Length, LastWriteTimeUtc

      - name: Upload single EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: omniphony-for-windows-setup-${{ github.sha }}
          path: dist/OmniphonySetup.exe
          if-no-files-found: error
          retention-days: 14
