name: Repair v0.5 drift fixture

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-v050-drift-scene.yml

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Restore exact fixture and add only drift_events
        shell: bash
        run: |
          git checkout c6334a6dc0005e0d117e721d8d9acc2c84f17210 -- omniphony-renderer/dsp_fixtures/src/scene.rs
          python - <<'PY'
          from pathlib import Path
          p = Path('omniphony-renderer/dsp_fixtures/src/scene.rs')
          s = p.read_text()
          anchor = '''pub fn move_events(n_objects: usize, seed_round: u64) -> Vec<SpatialChannelEvent> {
    (0..n_objects)
        .map(|ch| {
            let p = ch as u64 + seed_round.wrapping_mul(2_654_435_761);
            SpatialChannelEvent {
                channel_idx: ch,
                is_bed: false,
                gain_db: Some(0),
                ramp_length: Some(BLOCK_SAMPLES as u32),
                size: Some([0.0, 0.0, 0.0]),
                position: Some([
                    pseudo(p) as f64,
                    pseudo(p ^ 0x1111) as f64,
                    (pseudo(p ^ 0x2222).abs()) as f64,
                ]),
                sample_pos: Some(0),
            }
        })
        .collect()
}
'''
          addition = anchor + '''
/// One movement event per object on a continuous trajectory.
///
/// This is the realistic counterpart to [`move_events`], which redraws every
/// position at random each round. Random redraw remains a useful pathological
/// bound, but real content moves coherently. Rates span 12°/s to 96°/s; at
/// 1200 forty-sample blocks per second that is 0.01° to 0.08° per block.
pub fn drift_events(n_objects: usize, seed_round: u64) -> Vec<SpatialChannelEvent> {
    (0..n_objects)
        .map(|ch| {
            let deg_per_block = (12.0 + (ch % 8) as f64 * 12.0) / 1200.0;
            let az = (ch as f64 * 37.0 + seed_round as f64 * deg_per_block).to_radians();
            SpatialChannelEvent {
                channel_idx: ch,
                is_bed: false,
                gain_db: Some(0),
                ramp_length: Some(BLOCK_SAMPLES as u32),
                size: Some([0.0, 0.0, 0.0]),
                position: Some([az.sin(), az.cos(), (ch % 5) as f64 * 0.25]),
                sample_pos: Some(0),
            }
        })
        .collect()
}
'''
          if s.count(anchor) != 1:
              raise SystemExit(f'expected one move_events anchor, found {s.count(anchor)}')
          p.write_text(s.replace(anchor, addition, 1))
          PY
          git diff --check
          git diff --stat
      - name: Verify fixture consumers
        working-directory: omniphony-renderer
        run: |
          cargo check -p dsp_fixtures
          cargo check -p renderer
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "dissonance"
          git config user.email "ustreamusa@aim.com"
          git add omniphony-renderer/dsp_fixtures/src/scene.rs
          git commit -m "test(dsp): add coherent drift fixture without collateral"
          git pull --rebase origin main
          git push origin HEAD:main
