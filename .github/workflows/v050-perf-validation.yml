name: v0.5 realtime perf validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v050-perf-validation.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Run realtime deadline gates alone
        working-directory: omniphony-renderer
        shell: bash
        run: |
          cargo test --release -p renderer --features perf-gate -- spatial_renderer::perf_gate --test-threads=1 --nocapture
