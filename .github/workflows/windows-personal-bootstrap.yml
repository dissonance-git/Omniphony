name: Omniphony personal Windows bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-personal-bootstrap.yml'
      - 'omniphony-renderer/realtime_ffi/**'
      - 'omniphony-renderer/windows_host/eapo_vst_bridge/**'

permissions:
  contents: read

concurrency:
  group: omniphony-personal-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.88.0
  CARGO_TERM_COLOR: always

jobs:
  identity-bridge:
    name: x64 identity bridge
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup override set $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Test realtime ABI
        shell: pwsh
        working-directory: omniphony-renderer
        run: cargo test -p realtime_ffi

      - name: Build realtime ABI DLL
        shell: pwsh
        working-directory: omniphony-renderer
        run: cargo build --profile release-deploy -p realtime_ffi

      - name: Configure VST bridge
        shell: pwsh
        run: >-
          cmake -S omniphony-renderer/windows_host/eapo_vst_bridge
          -B build/personal-bootstrap
          -A x64

      - name: Build VST bridge and smoke host
        shell: pwsh
        run: cmake --build build/personal-bootstrap --config Release --parallel

      - name: Assemble smoke-test directory
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'build\personal-bootstrap\smoke'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item 'build\personal-bootstrap\Release\OmniphonyVstBridge.dll' $dir -Force
          Copy-Item 'build\personal-bootstrap\Release\omniphony_vst_bridge_smoke.exe' $dir -Force
          Copy-Item 'omniphony-renderer\target\release-deploy\omniphony_realtime.dll' $dir -Force
          Get-ChildItem $dir | Format-Table Name, Length

      - name: Prove VST to Rust identity path
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'build\personal-bootstrap\smoke'
          & (Join-Path $dir 'omniphony_vst_bridge_smoke.exe') (Join-Path $dir 'OmniphonyVstBridge.dll')
          if ($LASTEXITCODE -ne 0) {
            throw "Identity bridge smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Assemble personal bootstrap artifact
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist\omniphony-personal-bootstrap'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item 'build\personal-bootstrap\Release\OmniphonyVstBridge.dll' $dist -Force
          Copy-Item 'omniphony-renderer\target\release-deploy\omniphony_realtime.dll' $dist -Force
          $source = 'omniphony-renderer\windows_host\eapo_vst_bridge'
          foreach ($file in @(
              'install-personal-bootstrap.ps1',
              'uninstall-personal-bootstrap.ps1',
              'README.txt',
              'THIRD_PARTY_NOTICES.txt'
          )) {
            Copy-Item (Join-Path $source $file) $dist -Force
          }

          $files = @(Get-ChildItem $dist -File)
          if ($files.Count -ne 6) {
            throw "Personal bootstrap artifact must contain exactly six files; found $($files.Count)"
          }
          Get-ChildItem $dist | Format-Table Name, Length

      - name: Upload personal bootstrap artifact
        uses: actions/upload-artifact@v6
        with:
          name: omniphony-personal-bootstrap-windows-x64-${{ github.sha }}
          path: dist/omniphony-personal-bootstrap/
          if-no-files-found: error
          retention-days: 14
