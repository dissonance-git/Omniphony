name: Clean v0.5 format churn

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-v050-format-churn.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore unrelated files from pre-port parent
        shell: bash
        run: |
          BASE=b95e1a25c70f99e33f64d02a488132e4ad61432f
          PORT=82edbcd548cec1491ddf8d2cfbc49615638436bc
          KEEP_HRIR=omniphony-renderer/renderer/src/binaural/hrir.rs
          KEEP_MOD=omniphony-renderer/renderer/src/binaural/mod.rs
          while IFS= read -r file; do
            if [ "$file" = "$KEEP_HRIR" ] || [ "$file" = "$KEEP_MOD" ]; then
              continue
            fi
            git checkout "$BASE" -- "$file"
          done < <(git diff --name-only "$BASE" "$PORT")

          echo "Remaining semantic diff versus pre-port parent:"
          git diff --stat
          git diff --check
          git config user.name "dissonance"
          git config user.email "ustreamusa@aim.com"
          git add -A
          git commit -m "chore: remove unrelated v0.5 rustfmt churn"
          git pull --rebase origin main
          git push origin HEAD:main
