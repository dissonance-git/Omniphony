name: One-shot stream reset stabilization v6

# Finalize the independently verified stream-lifetime reset before tackling the
# separate measured-HRTF/golden stabilization frontier.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-stream-reset-stabilization-v6.yml

permissions:
  contents: write

concurrency:
  group: oneshot-stream-reset-stabilization-v6
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch-test-report:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Patch, test, and publish stream reset
        shell: bash
        run: |
          set +e
          base_sha=$(git rev-parse HEAD)
          failed_stage=""
          mkdir -p /tmp/omniphony-stabilize

          python .github/ci/stream_reset_patch.py > /tmp/omniphony-stabilize/patch.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then failed_stage="apply_stream_reset_patch"; fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo fmt --all) > /tmp/omniphony-stabilize/fmt.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="cargo_fmt"; fi
          fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo test -p dsp_fixtures binaural_gain_is_invariant_to_host_block_size -- --nocapture) > /tmp/omniphony-stabilize/gain.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="binaural_gain_callback_invariance"; fi
          fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo test -p dsp_fixtures -- --nocapture) > /tmp/omniphony-stabilize/dsp.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="dsp_fixtures"; fi
          fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo test -p renderer spatial_renderer::golden_tests::reset_runtime_state_erases_the_previous_stream -- --nocapture) > /tmp/omniphony-stabilize/reset.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="renderer_stream_reset_regression"; fi
          fi

          # The two skips are pre-existing, separately isolated KEMAR timing/golden
          # failures. They are not allowed to block a stream-reset patch whose own
          # end-to-end, gain, groove and renderer reset gates are green.
          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo test -p renderer -- \
              --skip binaural::validation::measured_hrir_direct_arrivals_are_time_aligned \
              --skip spatial_renderer::golden_tests::null_binaural_kemar) > /tmp/omniphony-stabilize/renderer.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="renderer_tests_unrelated_exclusions"; fi
          fi

          if [ -z "$failed_stage" ]; then
            git diff --check > /tmp/omniphony-stabilize/diff.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="git_diff_check"; fi
          fi

          git fetch origin main > /tmp/omniphony-stabilize/fetch.log 2>&1
          remote_sha=$(git rev-parse origin/main)
          if [ "$remote_sha" != "$base_sha" ]; then
            failed_stage="stale_head_${base_sha}_to_${remote_sha}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$failed_stage" ]; then
            git add \
              omniphony-renderer/renderer/src/delay_line.rs \
              omniphony-renderer/renderer/src/binaural/convolver.rs \
              omniphony-renderer/renderer/src/binaural/reflections.rs \
              omniphony-renderer/renderer/src/binaural/reverb.rs \
              omniphony-renderer/renderer/src/binaural/mod.rs \
              omniphony-renderer/renderer/src/spatial_renderer/components.rs \
              omniphony-renderer/renderer/src/spatial_renderer/mod.rs \
              omniphony-renderer/dsp_fixtures/src/lib.rs \
              omniphony-renderer/dsp_fixtures/src/stream_reset.rs
            git diff --cached --quiet && { echo "no stream-reset patch produced"; exit 1; }
            git commit -m "fix(rt): reset stream-lifetime DSP state in place"
            git push origin HEAD:main
            exit $?
          fi

          git reset --hard "$base_sha"
          mkdir -p ci-diagnostics
          report=ci-diagnostics/stream-reset-stabilization-v6.txt
          {
            echo "Omniphony guarded stream-reset stabilization"
            echo "base_sha=$base_sha"
            echo "failed_stage=$failed_stage"
            echo "rust_toolchain=$RUST_TOOLCHAIN"
            echo
            for log in patch fmt gain dsp reset renderer diff fetch; do
              path="/tmp/omniphony-stabilize/${log}.log"
              if [ -f "$path" ]; then
                echo "===== ${log}.log (last 240 lines) ====="
                tail -n 240 "$path"
                echo
              fi
            done
          } > "$report"
          git add "$report"
          git commit -m "ci: record stream-reset finalization failure"
          git push origin HEAD:main
          exit 1
