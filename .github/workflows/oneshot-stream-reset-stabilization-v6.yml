name: One-shot stream reset stabilization v6

# Guarded always-on stabilization pass: stream reset, binaural timing, measured HRIR alignment.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-stream-reset-stabilization-v6.yml

permissions:
  contents: write

concurrency:
  group: oneshot-stream-reset-stabilization-v6
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.88.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch-test-report:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Patch, test, and publish one bounded result
        shell: bash
        run: |
          set +e
          base_sha=$(git rev-parse HEAD)
          failed_stage=""
          mkdir -p /tmp/omniphony-stabilize

          python .github/ci/stream_reset_patch.py > /tmp/omniphony-stabilize/patch.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then failed_stage="apply_stream_reset_patch"; fi

          if [ -z "$failed_stage" ]; then
            python .github/ci/hrir_alignment_patch.py >> /tmp/omniphony-stabilize/patch.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="apply_hrir_alignment_patch"; fi
          fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo fmt --all) > /tmp/omniphony-stabilize/fmt.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="cargo_fmt"; fi
          fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo test -p dsp_fixtures binaural_gain_is_invariant_to_host_block_size -- --nocapture) > /tmp/omniphony-stabilize/gain.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="binaural_gain_callback_invariance"; fi
          fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo test -p dsp_fixtures -- --nocapture) > /tmp/omniphony-stabilize/dsp.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="dsp_fixtures"; fi
          fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo test -p renderer binaural::validation::measured_hrir_direct_arrivals_are_time_aligned -- --nocapture) > /tmp/omniphony-stabilize/hrir.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="measured_hrir_alignment"; fi
          fi

          # Run every renderer test except the intentionally stale KEMAR golden.
          # Only if all behavioral/invariant tests pass do we permit that one
          # binary reference to be regenerated from the corrected renderer.
          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo test -p renderer -- --skip spatial_renderer::golden_tests::null_binaural_kemar) > /tmp/omniphony-stabilize/renderer_prebless.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="renderer_tests_before_golden"; fi
          fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && OMNIPHONY_BLESS_GOLDENS=1 cargo test -p renderer spatial_renderer::golden_tests::null_binaural_kemar -- --nocapture) > /tmp/omniphony-stabilize/bless.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="bless_binaural_kemar_golden"; fi
          fi

          if [ -z "$failed_stage" ]; then
            (cd omniphony-renderer && cargo test -p renderer) > /tmp/omniphony-stabilize/renderer.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="renderer_tests_after_golden"; fi
          fi

          if [ -z "$failed_stage" ]; then
            git diff --check > /tmp/omniphony-stabilize/diff.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then failed_stage="git_diff_check"; fi
          fi

          git fetch origin main > /tmp/omniphony-stabilize/fetch.log 2>&1
          remote_sha=$(git rev-parse origin/main)
          if [ "$remote_sha" != "$base_sha" ]; then
            failed_stage="stale_head_${base_sha}_to_${remote_sha}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$failed_stage" ]; then
            git add \
              omniphony-renderer/renderer/src/delay_line.rs \
              omniphony-renderer/renderer/src/binaural/convolver.rs \
              omniphony-renderer/renderer/src/binaural/reflections.rs \
              omniphony-renderer/renderer/src/binaural/reverb.rs \
              omniphony-renderer/renderer/src/binaural/mod.rs \
              omniphony-renderer/renderer/src/binaural/measured.rs \
              omniphony-renderer/renderer/src/spatial_renderer/components.rs \
              omniphony-renderer/renderer/src/spatial_renderer/mod.rs \
              omniphony-renderer/dsp_fixtures/src/lib.rs \
              omniphony-renderer/dsp_fixtures/src/stream_reset.rs \
              omniphony-renderer/dsp_fixtures/goldens/binaural_kemar.f32
            if git diff --cached --quiet; then
              failed_stage="no_stabilization_patch_produced"
            else
              git commit -m "fix(rt): harden stream reset and measured binaural timing"
              git push origin HEAD:main
              exit $?
            fi
          fi

          git reset --hard "$base_sha"
          mkdir -p ci-diagnostics
          report=ci-diagnostics/stream-reset-stabilization-v6.txt
          {
            echo "Omniphony guarded always-on stabilization"
            echo "base_sha=$base_sha"
            echo "failed_stage=$failed_stage"
            echo "rust_toolchain=$RUST_TOOLCHAIN"
            echo
            for log in patch fmt gain dsp hrir renderer_prebless bless renderer diff fetch; do
              path="/tmp/omniphony-stabilize/${log}.log"
              if [ -f "$path" ]; then
                echo "===== ${log}.log (last 240 lines) ====="
                tail -n 240 "$path"
                echo
              fi
            done
          } > "$report"
          git add "$report"
          git commit -m "ci: record always-on stabilization failure"
          git push origin HEAD:main
          exit 1
