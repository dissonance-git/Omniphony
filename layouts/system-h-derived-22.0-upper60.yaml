# Headphone-listening experiment derived from ITU-R BS.2051 System H.
#
# This is intentionally NOT a normative System H layout. The canonical
# `itu-r-bs2051-system-h-22.0.yaml` remains untouched and standards-correct.
# The only geometric change here is that the eight regular upper-layer
# directions move from +30 degrees to +60 degrees; the horizontal layer,
# zenith, and -30-degree lower layer remain identical.
#
# Why: Omniphony's current stereo music-field TFL/TFR evidence sits near
# +57 degrees elevation. Sending that evidence through a +30-degree ring plus
# zenith requires VBAP to synthesize the intended elevation before the HRTF
# stage. For this controlled headphone A/B, the +60-degree ring lets those
# static height lanes arrive at the binaural stage close to their intended
# direction, preserving more direction-specific pinna/HRTF spectral structure.
#
# Coordinates use Omniphony's convention:
#   x = right (+), y = front (+), z = up (+)
name: "System-H-derived 22.0 shell, +60-degree upper ring"
radius_m: 1
speakers:
  # Middle layer: unchanged from System H.
  - name: "FC"
    coord_mode: "cartesian"
    x: 0.0
    y: 1.0
    z: 0.0
    spatialize: true
    delay_ms: 0
  - name: "FLc"
    coord_mode: "cartesian"
    x: -0.500000
    y: 0.866025
    z: 0.0
    spatialize: true
    delay_ms: 0
  - name: "FRc"
    coord_mode: "cartesian"
    x: 0.500000
    y: 0.866025
    z: 0.0
    spatialize: true
    delay_ms: 0
  - name: "FL"
    coord_mode: "cartesian"
    x: -0.866025
    y: 0.500000
    z: 0.0
    spatialize: true
    delay_ms: 0
  - name: "FR"
    coord_mode: "cartesian"
    x: 0.866025
    y: 0.500000
    z: 0.0
    spatialize: true
    delay_ms: 0
  - name: "SiL"
    coord_mode: "cartesian"
    x: -1.0
    y: 0.0
    z: 0.0
    spatialize: true
    delay_ms: 0
  - name: "SiR"
    coord_mode: "cartesian"
    x: 1.0
    y: 0.0
    z: 0.0
    spatialize: true
    delay_ms: 0
  - name: "BL"
    coord_mode: "cartesian"
    x: -0.707107
    y: -0.707107
    z: 0.0
    spatialize: true
    delay_ms: 0
  - name: "BR"
    coord_mode: "cartesian"
    x: 0.707107
    y: -0.707107
    z: 0.0
    spatialize: true
    delay_ms: 0
  - name: "BC"
    coord_mode: "cartesian"
    x: 0.0
    y: -1.0
    z: 0.0
    spatialize: true
    delay_ms: 0

  # Experimental upper layer: eight directions at +60 degrees plus zenith.
  - name: "TpFC"
    coord_mode: "cartesian"
    x: 0.0
    y: 0.500000
    z: 0.866025
    spatialize: true
    delay_ms: 0
  - name: "TpFL"
    coord_mode: "cartesian"
    x: -0.353553
    y: 0.353553
    z: 0.866025
    spatialize: true
    delay_ms: 0
  - name: "TpFR"
    coord_mode: "cartesian"
    x: 0.353553
    y: 0.353553
    z: 0.866025
    spatialize: true
    delay_ms: 0
  - name: "TpSiL"
    coord_mode: "cartesian"
    x: -0.500000
    y: 0.0
    z: 0.866025
    spatialize: true
    delay_ms: 0
  - name: "TpSiR"
    coord_mode: "cartesian"
    x: 0.500000
    y: 0.0
    z: 0.866025
    spatialize: true
    delay_ms: 0
  - name: "TpBL"
