# COMPATIBILITY PATH FOR THE CURRENT HEADPHONE LISTENING A/B.
#
# The Windows prototype currently embeds this historical path directly. For the
# height experiment below it carries a System-H-derived shell whose eight regular
# upper directions are moved from +30 degrees to +60 degrees. The normative
# System H geometry is preserved unchanged at:
#   layouts/reference/itu-r-bs2051-system-h-22.0.yaml
#
# This experiment changes no horizontal/lower geometry, levels, room settings,
# extraction, protected master, or HRTF data. It exists to test whether giving
# the ~57-degree music-height evidence an almost direct elevated virtual speaker
# preserves stronger pinna/HRTF elevation structure than synthesizing it between
# the +30-degree ring and zenith.
#
# Coordinates are unit-sphere Cartesian values in Omniphony's convention:
#   x = right (+), y = front (+), z = up (+)
name: "System-H-derived 22.0 shell, +60-degree upper ring"
radius_m: 1
speakers:
  # Middle layer: unchanged.
  - name: "FC"
    coord_mode: "cartesian"
    x: 0.0
    y: 1.0
    z: 0.0
    spatialize: true
    delay_ms: 0
  - name: "FLc"
    coord_mode: "cartesian"
    x: -0.500000
    y: 0.866025
    z: 0.0
    spatialize: true
    delay_ms: 0
  - name: "FRc"
    coord_mode: "cartesian"
    x: 0.500000
    y: 0.866025
    z: 0.0
    spatialize: true
    delay_ms: 0
