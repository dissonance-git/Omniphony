[package]
name = "orender_ffi"
version = "0.4.3"
# Edition 2021 (not 2024) so cbindgen sees plain #[no_mangle] and unsafe fn
# bodies stay implicitly unsafe — simpler for a thin C ABI shim.
edition = "2021"
license = "GPL-3.0-or-later"
description = "C ABI for the Omniphony headless renderer engine"
repository = "https://github.com/dissonance-git/Omniphony"

[lib]
# Produces liborender.so / orender.dll
name = "orender"
crate-type = ["cdylib"]

[dependencies]
orender_engine = { version = "0.2.2", path = "../orender_engine" }
# For build_fingerprint() (orender_build_id): the git-describe stamp lives in
# runtime_control, which both hosts already link — one source of truth.
runtime_control = { version = "0.2.4", path = "../runtime_control" }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
# The OrenderChannelLabel ↔ RChannelLabel discriminant-parity unit test.
bridge_api = { version = "0.3.0", path = "../bridge_api" }

[features]
# SOFA (personalised HRTF) support, on by default for the headless engine
# artifact; embedded builds can use --no-default-features.
default = ["sofa"]
sofa = ["orender_engine/sofa"]

[build-dependencies]
cbindgen = "0.27"
