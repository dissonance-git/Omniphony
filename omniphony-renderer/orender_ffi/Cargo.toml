[package]
name = "orender_ffi"
version = "0.1.0"
# Edition 2021 (not 2024) so cbindgen sees plain #[no_mangle] and unsafe fn
# bodies stay implicitly unsafe — simpler for a thin C ABI shim.
edition = "2021"
license = "GPL-3.0-only"
description = "C ABI for the orender Atmos renderer (produces liborender.so)"
repository = "https://github.com/mgth/Omniphony"

[lib]
# Produces liborender.so / orender.dll
name = "orender"
crate-type = ["cdylib"]

[dependencies]
orender_engine = { version = "0.1.0", path = "../orender_engine" }
renderer = { version = "0.2.4", path = "../renderer" }
bridge_api = { version = "0.2.0", path = "../bridge_api" }
anyhow = "1.0"
log = "0.4"

[build-dependencies]
cbindgen = "0.27"
