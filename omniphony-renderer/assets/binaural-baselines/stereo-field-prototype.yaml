# Protected-master stereo support-field prototype.
#
# The finished stereo master never enters this scene. The portable music-field
# processor analyzes real L/R magnitude + phase by frequency and emits a derived
# logical 7.1.4 support bed in canonical bridge order:
#
#   L/R         broad front/front-side extent
#   C/LFE       zero (center authority + bass remain in the direct master)
#   Ls/Rs       wide lateral continuity / balance
#   Lb/Rb       real rear depth without rear dominance
#   Tfl/Tfr     dominant front-height distance / canopy
#   Tbl/Tbr     upper-rear closure and depth
#
# Baseline 1 established cascaded binaural as the active headphone architecture:
# the derived support bed runs through Omniphony's full virtual-speaker stage and
# the resulting virtual room is then binauralised by the inherited HRTF/ITD core.
#
# This post-baseline frontier deliberately pushes geometry while the renderer's
# early-reflection implementation gains frequency-dependent wall / extra-path HF
# loss. Larger is no longer allowed to mean spectrally shinier.
#
# The protected master and coherent foundation remain outside the virtual room.
# They are summed with rendered support later in the Windows host.
render:
  master_gain: 0.0
  auto_gain: false
  auto_gain_ceiling_db: -2.0

  # Native speaker EFFECT SPACE. Front/back/height provide most radial scale;
  # sides remain extremely wide for continuity rather than becoming the only
  # source of apparent size.
  room_width_m: 15.5
  room_front_m: 13.0
  room_rear_m: 10.5
  room_height_m: 14.5
  room_lower_m: 5.0
  room_ratio_center_blend: 0.30

  # A little more source extent lets neighbouring virtual loudspeakers knit into
  # a continuous shell. The direct stereo master remains untouched outside it.
  spread_from_distance: false
  vbap_spread_min: 0.09
  vbap_spread_max: 0.36

  # Broadband phantom extraction operates only on the already-derived support
  # bed. The stronger frontier value encourages authored pans / correlated motion
  # to travel through the virtual room while leaving the protected master intact.
  synthetic_objects_enabled: true
  phantom_extract_mode: broadband
  phantom_params:
    strength: 0.28
    passes: 1.0
    lift: 0.0
    center: 0.0
    sides: 0.0

  virtual_bed:
    radius_m: 1.0
    speakers:
      - name: "L"
        coord_mode: "cartesian"
        x: -1.0
        y: 1.0
        z: 0.10
        spatialize: true
        delay_ms: 0
      - name: "R"
        coord_mode: "cartesian"
        x: 1.0
        y: 1.0
        z: 0.10
        spatialize: true
        delay_ms: 0

      - name: "C"
        coord_mode: "cartesian"
        x: 0.0
        y: 1.0
        z: 0.0
        spatialize: true
        delay_ms: 0
      - name: "LFE"
        coord_mode: "cartesian"
        x: 0.0
        y: 0.0
        z: 0.0
        spatialize: false
        delay_ms: 0

      - name: "Ls"
        coord_mode: "cartesian"
        x: -1.15
        y: 0.0
        z: 0.14
        spatialize: true
        delay_ms: 0
      - name: "Rs"
        coord_mode: "cartesian"
        x: 1.15
        y: 0.0
        z: 0.14
        spatialize: true
        delay_ms: 0

      - name: "Lb"
        coord_mode: "cartesian"
        x: -0.97
        y: -0.97
        z: 0.14
        spatialize: true
        delay_ms: 0
      - name: "Rb"
        coord_mode: "cartesian"
        x: 0.97
        y: -0.97
        z: 0.14
        spatialize: true
        delay_ms: 0

      - name: "TFL"
        coord_mode: "cartesian"
        x: -0.96
        y: 1.0
        z: 1.65
        spatialize: true
        delay_ms: 0
      - name: "TFR"
        coord_mode: "cartesian"
        x: 0.96
        y: 1.0
        z: 1.65
        spatialize: true
        delay_ms: 0

      - name: "TBL"
        coord_mode: "cartesian"
        x: -0.92
        y: -0.96
        z: 1.50
        spatialize: true
        delay_ms: 0
      - name: "TBR"
        coord_mode: "cartesian"
        x: 0.92
        y: -0.96
        z: 1.50
        spatialize: true
        delay_ms: 0

  binaural:
    output_mode: binaural
    mode: cascaded
    hrir_source: saf
    spectral_compensation: saf_partial

    unit_scale_m: 7.25

    # The reflection room can now exceed the old hidden 20 m per-axis clamp.
    # Its extra scale is paired with frequency-dependent wall / path HF loss in
    # the renderer so bright material does not receive six perfect mirror copies.
    reflections:
      enabled: true
      room_width_m: 17.0
      room_depth_m: 27.0
      room_height_m: 15.5
      level: 0.38

    # Late field remains glue, not the source of the bubble.
    reverb:
      enabled: true
      level: 0.035
      rt60_s: 0.17
      predelay_ms: 28.0

    # Native distance-dependent HF attenuation touches only the derived support
    # scene. The authoritative stereo master stays full-band outside this scene.
    air_absorption: true
