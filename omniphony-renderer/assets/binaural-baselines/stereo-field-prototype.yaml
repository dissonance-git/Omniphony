# Preserved-master stereo support-field prototype.
#
# Unlike stereo-music-prototype.yaml, this config is NOT asked to render the
# finished stereo master. The Windows listening worker keeps the original L/R
# samples authoritative and feeds only a derived, bass-protected side field
# through this Omniphony binaural scene.
#
# The first preserved-master experiments established the important safety floor:
# ON can remain effectively as clean as OFF without the former tinny/hallway
# failure. The previous ~30% effective support produced at most a subtle lushness.
# We no longer need tiny audibility steps, so this pass intentionally makes the
# support field unmistakable while keeping every preservation mechanism intact.
#
# The host-side support coefficient remains 0.14. +14 dB here is about a 5.0x
# field increase, giving roughly a 70% effective contribution before the final
# master-first headroom veto. This is a high-contrast listening experiment, not
# a declaration that 70% is the final product strength.
#
# The support scene remains intentionally dry: no early reflections, no late
# reverb, no air absorption. Any audible spatial change should therefore come
# from the Omniphony-rendered field itself rather than an added room effect.
render:
  master_gain: 14.0
  virtual_bed:
    radius_m: 1.0
    speakers:
      - name: "L"
        coord_mode: "cartesian"
        x: -1.0
        y: -0.35
        z: 0.15
        spatialize: true
        delay_ms: 0
      - name: "R"
        coord_mode: "cartesian"
        x: 1.0
        y: -0.35
        z: 0.15
        spatialize: true
        delay_ms: 0
  binaural:
    output_mode: binaural
    hrir_source: saf
    unit_scale_m: 3.0
    reflections:
      enabled: false
    reverb:
      enabled: false
    air_absorption: false
