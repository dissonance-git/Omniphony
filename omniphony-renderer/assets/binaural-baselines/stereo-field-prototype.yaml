# Protected-master stereo support-field prototype.
#
# This config is NOT asked to render the finished stereo master. The Windows
# listening worker keeps the original L/R samples authoritative and feeds only
# a derived, bass-protected relational field through this Omniphony scene.
#
# Early experiments used a pure (L-R)/2 side field and then tried increasingly
# large render.master_gain values. Listening established that the architecture
# could remain transparent, but the side-only evidence stayed effectively
# inaudible. The current worker therefore owns the support amount explicitly and
# derives a richer center-reduced L/R field.
#
# Keep this renderer itself unity-gain so runtime meters are interpretable:
# extracted evidence -> Omniphony render -> explicit host support coefficient.
#
# The support scene remains intentionally dry: no early reflections, no late
# reverb, no air absorption. Audible spatial change should come from geometry /
# HRTF / ITD rather than a room effect.
render:
  master_gain: 0.0
  virtual_bed:
    radius_m: 1.0
    speakers:
      - name: "L"
        coord_mode: "cartesian"
        x: -1.0
        y: -0.35
        z: 0.15
        spatialize: true
        delay_ms: 0
      - name: "R"
        coord_mode: "cartesian"
        x: 1.0
        y: -0.35
        z: 0.15
        spatialize: true
        delay_ms: 0
  binaural:
    output_mode: binaural
    hrir_source: saf
    unit_scale_m: 3.0
    reflections:
      enabled: false
    reverb:
      enabled: false
    air_absorption: false
