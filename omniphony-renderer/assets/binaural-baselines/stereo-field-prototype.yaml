# Protected-master stereo support-field prototype.
#
# The finished stereo master never enters this scene. The portable music-field
# processor analyzes real L/R magnitude + phase by frequency and emits a derived
# logical 7.1.4 support bed in canonical bridge order:
#
#   L/R         broad front/front-side extent
#   C/LFE       zero (center authority + bass remain in the direct master)
#   Ls/Rs       wide lateral continuity / balance
#   Lb/Rb       real rear depth without rear dominance
#   Tfl/Tfr     dominant front-height distance / canopy
#   Tbl/Tbr     upper-rear closure and depth
#
# The support scene deliberately relies on Omniphony's inherited binaural core
# for the spatial acoustics. Our stereo layer decides what evidence may enter the
# field; HRTF/ITD, metric distance cues, first-order reflections, the short FDN
# tail and clipping protection remain native renderer mechanisms.
#
# Current development law: push physical acoustic volume until the next increase
# causes blur, anchor loss, transient softening, bass timing loss or fatigue. The
# last clean point before that failure is the current perceptual frontier.
#
# Current perceptual weighting from physical listening:
#
#   DISTANCE / BUBBLE SCALE
#     front        primary
#     rear         primary, but must not dominate
#     height       primary
#     sides        fully wide and continuous; radial reach is secondary
#
# This is intentionally not a narrow front/back tunnel. Side width remains large;
# the stronger *distance* impression is concentrated on the front/back/z axes
# because those dimensions contribute most strongly to the target bubble percept.
render:
  master_gain: 0.0
  auto_gain: true
  auto_gain_ceiling_db: -2.0
  virtual_bed:
    radius_m: 1.0
    speakers:
      # Front field reaches the full front corners. At the 5.25 m scene scale
      # these broad-support positions sit roughly 7.4 m from the listener.
      - name: "L"
        coord_mode: "cartesian"
        x: -1.0
        y: 1.0
        z: 0.08
        spatialize: true
        delay_ms: 0
      - name: "R"
        coord_mode: "cartesian"
        x: 1.0
        y: 1.0
        z: 0.08
        spatialize: true
        delay_ms: 0

      # These channels are deliberately silent in the derived support bed.
      - name: "C"
        coord_mode: "cartesian"
        x: 0.0
        y: 1.0
        z: 0.0
        spatialize: true
        delay_ms: 0
      - name: "LFE"
        coord_mode: "cartesian"
        x: 0.0
        y: 0.0
        z: 0.0
        spatialize: false
        delay_ms: 0

      # Sides stay at maximum width. They are closer radially than the diagonal
      # front/rear/height axes, but still scale outward with the whole scene.
      - name: "Ls"
        coord_mode: "cartesian"
        x: -1.0
        y: 0.0
        z: 0.12
        spatialize: true
        delay_ms: 0
      - name: "Rs"
        coord_mode: "cartesian"
        x: 1.0
        y: 0.0
        z: 0.12
        spatialize: true
        delay_ms: 0

      # Rear is a primary depth axis and is brought close to the full diagonal,
      # while staying slightly shorter than front so rear never becomes gravity.
      - name: "Lb"
        coord_mode: "cartesian"
        x: -0.94
        y: -0.94
        z: 0.12
        spatialize: true
        delay_ms: 0
      - name: "Rb"
        coord_mode: "cartesian"
        x: 0.94
        y: -0.94
        z: 0.12
        spatialize: true
        delay_ms: 0

      # Upper-front is the longest radial axis and should form a canopy clearly
      # away from the skull rather than merely sounding brighter or taller.
      - name: "TFL"
        coord_mode: "cartesian"
        x: -0.94
        y: 1.0
        z: 1.0
        spatialize: true
        delay_ms: 0
      - name: "TFR"
        coord_mode: "cartesian"
        x: 0.94
        y: 1.0
        z: 1.0
        spatialize: true
        delay_ms: 0

      # Upper-rear closes the canopy deeply while remaining a little shorter
      # than upper-front, preserving the desired front-biased centre of gravity.
      - name: "TBL"
        coord_mode: "cartesian"
        x: -0.90
        y: -0.94
        z: 0.98
        spatialize: true
        delay_ms: 0
      - name: "TBR"
        coord_mode: "cartesian"
        x: 0.90
        y: -0.94
        z: 0.98
        spatialize: true
        delay_ms: 0

  binaural:
    output_mode: binaural
    hrir_source: saf

    # Frontier pass: increase native metric scale aggressively. Omniphony does
    # not apply inverse-distance attenuation to the direct support channels, so
    # this expands acoustic distance cues without simply making the field weak.
    unit_scale_m: 5.25

    # Grow the native image-source environment substantially and bring first-
    # order reflections close to the upstream demo's 0.4 strength. Bubble size
    # should come from direction + propagation delay, not a long reverb wash.
    reflections:
      enabled: true
      room_width_m: 12.0
      room_depth_m: 18.0
      room_height_m: 8.0
      level: 0.38

    # As physical/reflection scale rises, *reduce* the late field. This is an
    # intentional anti-blur trade: keep a little continuity but make geometry,
    # HRTF/ITD and first-order reflections do nearly all the enlargement work.
    reverb:
      enabled: true
      level: 0.05
      rt60_s: 0.20
      predelay_ms: 24.0

    # Native distance-dependent HF attenuation touches only the derived support
    # scene. The authoritative stereo master stays full-band outside this scene.
    air_absorption: true
