# Protected-master stereo support-field prototype.
#
# The finished stereo master never enters this scene. The portable music-field
# processor analyzes real L/R magnitude + phase by frequency and emits a derived
# logical 7.1.4 support bed in canonical bridge order:
#
#   L/R         broad front/front-side extent
#   C/LFE       zero (center authority + bass remain in the direct master)
#   Ls/Rs       wide lateral continuity / balance
#   Lb/Rb       real rear depth without rear dominance
#   Tfl/Tfr     dominant front-height distance / canopy
#   Tbl/Tbr     upper-rear closure and depth
#
# The support scene deliberately relies on Omniphony's inherited binaural core
# for the spatial acoustics. Our stereo layer decides what evidence may enter the
# field; HRTF/ITD, metric distance cues, first-order reflections, the short FDN
# tail and clipping protection remain native renderer mechanisms.
#
# Current perceptual weighting from physical listening:
#
#   DISTANCE / BUBBLE SCALE
#     front        primary
#     rear         primary, but must not dominate
#     height       primary
#     sides        wide and continuous, but not the main radial-distance cue
#
# This is intentionally not a narrow front/back tunnel. Side width remains large;
# the stronger *distance* impression is simply concentrated on the front/back/z
# axes because that is where the target listener gets most of the bubble percept.
render:
  master_gain: 0.0
  auto_gain: true
  auto_gain_ceiling_db: -2.0
  virtual_bed:
    radius_m: 1.0
    speakers:
      # Front field: push the derived broad field fully into the front corners.
      # With the 3.25 m binaural scene scale these sit about 4.6 m from the
      # listener, materially farther than the side continuity lanes.
      - name: "L"
        coord_mode: "cartesian"
        x: -1.0
        y: 1.0
        z: 0.08
        spatialize: true
        delay_ms: 0
      - name: "R"
        coord_mode: "cartesian"
        x: 1.0
        y: 1.0
        z: 0.08
        spatialize: true
        delay_ms: 0

      # These channels are deliberately silent in the derived support bed.
      - name: "C"
        coord_mode: "cartesian"
        x: 0.0
        y: 1.0
        z: 0.0
        spatialize: true
        delay_ms: 0
      - name: "LFE"
        coord_mode: "cartesian"
        x: 0.0
        y: 0.0
        z: 0.0
        spatialize: false
        delay_ms: 0

      # Sides stay fully wide, but sit closer radially than front/rear/height.
      # They stitch the sphere together rather than becoming its centre of mass.
      - name: "Ls"
        coord_mode: "cartesian"
        x: -1.0
        y: 0.0
        z: 0.10
        spatialize: true
        delay_ms: 0
      - name: "Rs"
        coord_mode: "cartesian"
        x: 1.0
        y: 0.0
        z: 0.10
        spatialize: true
        delay_ms: 0

      # Rear remains a real radial dimension, but is deliberately shorter than
      # the front corners so it cannot pull the perceived bubble behind the head.
      - name: "Lb"
        coord_mode: "cartesian"
        x: -0.82
        y: -0.82
        z: 0.12
        spatialize: true
        delay_ms: 0
      - name: "Rb"
        coord_mode: "cartesian"
        x: 0.82
        y: -0.82
        z: 0.12
        spatialize: true
        delay_ms: 0

      # Explicit height poses matter in binaural mode because metric distance is
      # derived directly from the virtual-object coordinates. Top-front is the
      # longest axis in the current music presentation and should provide the
      # strongest sense of an acoustic canopy away from the skull.
      - name: "TFL"
        coord_mode: "cartesian"
        x: -0.92
        y: 1.0
        z: 1.0
        spatialize: true
        delay_ms: 0
      - name: "TFR"
        coord_mode: "cartesian"
        x: 0.92
        y: 1.0
        z: 1.0
        spatialize: true
        delay_ms: 0

      # Upper-rear closes the sphere with real distance while remaining shorter
      # and less dominant than the upper-front canopy.
      - name: "TBL"
        coord_mode: "cartesian"
        x: -0.80
        y: -0.82
        z: 0.90
        spatialize: true
        delay_ms: 0
      - name: "TBR"
        coord_mode: "cartesian"
        x: 0.80
        y: -0.82
        z: 0.90
        spatialize: true
        delay_ms: 0

  binaural:
    output_mode: binaural
    hrir_source: saf

    # Upstream Omniphony's real demo uses 3.0 m. The music field now goes a
    # little farther because physical listening says radial distance, especially
    # front/back/height, is the strongest contributor to the desired giant bubble.
    # Direct support gain is not attenuated by this scale; Omniphony uses it for
    # metric acoustic cues such as reflection geometry, air and room send.
    unit_scale_m: 3.25

    # Native six-image first-order reflection bank. Keep this below the upstream
    # demo's 0.4 while using a substantially larger room so the reflections act
    # as distance/externalization evidence rather than a small audible room.
    reflections:
      enabled: true
      room_width_m: 7.0
      room_depth_m: 10.0
      room_height_m: 4.8
      level: 0.30

    # Native FDN tail remains deliberately short and low. It supplies continuity
    # and acoustic volume, never the main spatial effect.
    reverb:
      enabled: true
      level: 0.07
      rt60_s: 0.24
      predelay_ms: 20.0

    # Native distance-dependent HF attenuation touches only the derived support
    # scene. The authoritative stereo master stays full-band outside this scene.
    air_absorption: true
