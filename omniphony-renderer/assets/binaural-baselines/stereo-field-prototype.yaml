# Protected-master stereo support-field prototype.
#
# The finished stereo master never enters this scene. The portable music-field
# processor analyzes real L/R magnitude + phase by frequency and emits a derived
# logical 7.1.4 support bed in canonical bridge order:
#
#   L/R         broad front/front-side extent
#   C/LFE       zero (center authority + bass remain in the direct master)
#   Ls/Rs       wide lateral continuity / balance
#   Lb/Rb       real rear depth without rear dominance
#   Tfl/Tfr     dominant front-height distance / canopy
#   Tbl/Tbr     upper-rear closure and depth
#
# The support scene deliberately relies on Omniphony's inherited binaural core
# for HRTF/ITD, metric distance, reflections, short FDN ambience and air cues.
# Our stereo layer decides what evidence may enter the field.
#
# Important topology rule: this renderer is an additive SUPPORT branch, not the
# final program output. Omniphony's native auto-gain is therefore disabled here.
# In the standalone renderer it protects the final stereo bus by permanently
# lowering master gain after an overload; on an additive support branch that can
# sound like spatial/high-frequency energy suddenly sliding downward while the
# protected direct master stays unchanged. Final-bus headroom/measurement belongs
# to the host combiner instead.
#
# Current development law: push physical acoustic volume until the next increase
# causes blur, anchor loss, transient softening, bass timing loss or fatigue. The
# last clean point before that failure is the current perceptual frontier.
render:
  master_gain: 0.0
  auto_gain: false
  # Retained as a documented standalone-renderer reference; inactive while
  # auto_gain is false for this support-only scene.
  auto_gain_ceiling_db: -2.0
  virtual_bed:
    radius_m: 1.0
    speakers:
      - name: "L"
        coord_mode: "cartesian"
        x: -1.0
        y: 1.0
        z: 0.10
        spatialize: true
        delay_ms: 0
      - name: "R"
        coord_mode: "cartesian"
        x: 1.0
        y: 1.0
        z: 0.10
        spatialize: true
        delay_ms: 0

      - name: "C"
        coord_mode: "cartesian"
        x: 0.0
        y: 1.0
        z: 0.0
        spatialize: true
        delay_ms: 0
      - name: "LFE"
        coord_mode: "cartesian"
        x: 0.0
        y: 0.0
        z: 0.0
        spatialize: false
        delay_ms: 0

      # Sides stay maximally wide. Their role is width and continuity rather than
      # being the longest radial axis.
      - name: "Ls"
        coord_mode: "cartesian"
        x: -1.0
        y: 0.0
        z: 0.14
        spatialize: true
        delay_ms: 0
      - name: "Rs"
        coord_mode: "cartesian"
        x: 1.0
        y: 0.0
        z: 0.14
        spatialize: true
        delay_ms: 0

      # Rear impact stays close to the full diagonal without becoming gravity.
      - name: "Lb"
        coord_mode: "cartesian"
        x: -0.97
        y: -0.97
        z: 0.14
        spatialize: true
        delay_ms: 0
      - name: "Rb"
        coord_mode: "cartesian"
        x: 0.97
        y: -0.97
        z: 0.14
        spatialize: true
        delay_ms: 0

      # Height is the current frontier. Extend top-front vertically beyond the
      # floor speaker radius so the canopy grows in distance, not treble level.
      - name: "TFL"
        coord_mode: "cartesian"
        x: -0.96
        y: 1.0
        z: 1.18
        spatialize: true
        delay_ms: 0
      - name: "TFR"
        coord_mode: "cartesian"
        x: 0.96
        y: 1.0
        z: 1.18
        spatialize: true
        delay_ms: 0

      - name: "TBL"
        coord_mode: "cartesian"
        x: -0.92
        y: -0.96
        z: 1.10
        spatialize: true
        delay_ms: 0
      - name: "TBR"
        coord_mode: "cartesian"
        x: 0.92
        y: -0.96
        z: 1.10
        spatialize: true
        delay_ms: 0

  binaural:
    output_mode: binaural
    hrir_source: saf

    unit_scale_m: 6.0

    # First-order propagation does the enlargement work. Late-room energy stays
    # tiny so increasing the physical volume does not become a reverb wash.
    reflections:
      enabled: true
      room_width_m: 13.5
      room_depth_m: 21.0
      room_height_m: 10.0
      level: 0.40

    reverb:
      enabled: true
      level: 0.04
      rt60_s: 0.18
      predelay_ms: 26.0

    # Native distance-dependent HF attenuation touches only the derived support
    # scene. The authoritative stereo master stays full-band outside this scene.
    air_absorption: true
