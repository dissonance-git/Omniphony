# Protected-master stereo support-field prototype.
#
# The finished stereo master never enters this scene. The portable music-field
# processor analyzes real L/R magnitude + phase by frequency and emits a derived
# logical 7.1.4 support bed in canonical bridge order:
#
#   L/R         broad front/front-side extent
#   C/LFE       zero (center authority + bass remain in the direct master)
#   Ls/Rs       wide lateral continuity / balance
#   Lb/Rb       real rear depth without rear dominance
#   Tfl/Tfr     dominant front-height distance / canopy
#   Tbl/Tbr     upper-rear closure and depth
#
# The support scene deliberately relies on Omniphony's inherited binaural core
# for the spatial acoustics. Our stereo layer decides what evidence may enter the
# field; HRTF/ITD, metric distance cues, first-order reflections, the short FDN
# tail and clipping protection remain native renderer mechanisms.
#
# Current development law: push physical acoustic volume until the next increase
# causes blur, anchor loss, transient softening, bass timing loss or fatigue. The
# last clean point before that failure is the current perceptual frontier.
#
# Current perceptual weighting from physical listening:
#
#   DISTANCE / BUBBLE SCALE
#     front        primary
#     rear         primary and impactful, but must not dominate
#     height       primary and currently the highest-value frontier
#     sides        fully wide and continuous; radial reach is secondary
#
# This is intentionally not a narrow front/back tunnel. Side width remains large;
# the strongest *distance* impression is concentrated on front/back/z because
# those dimensions contribute most strongly to the target bubble percept.
render:
  master_gain: 0.0
  auto_gain: true
  auto_gain_ceiling_db: -2.0
  virtual_bed:
    radius_m: 1.0
    speakers:
      # Front stays at the full diagonal and scales outward with the scene.
      - name: "L"
        coord_mode: "cartesian"
        x: -1.0
        y: 1.0
        z: 0.10
        spatialize: true
        delay_ms: 0
      - name: "R"
        coord_mode: "cartesian"
        x: 1.0
        y: 1.0
        z: 0.10
        spatialize: true
        delay_ms: 0

      # These channels are deliberately silent in the derived support bed.
      - name: "C"
        coord_mode: "cartesian"
        x: 0.0
        y: 1.0
        z: 0.0
        spatialize: true
        delay_ms: 0
      - name: "LFE"
        coord_mode: "cartesian"
        x: 0.0
        y: 0.0
        z: 0.0
        spatialize: false
        delay_ms: 0

      # Sides stay maximally wide. Their role is width and continuity rather than
      # being the longest radial axis.
      - name: "Ls"
        coord_mode: "cartesian"
        x: -1.0
        y: 0.0
        z: 0.14
        spatialize: true
        delay_ms: 0
      - name: "Rs"
        coord_mode: "cartesian"
        x: 1.0
        y: 0.0
        z: 0.14
        spatialize: true
        delay_ms: 0

      # Rear impact was slightly too polite in the previous frontier. Bring it
      # almost to the full rear diagonal while still leaving front/top-front as
      # the perceptual lead.
      - name: "Lb"
        coord_mode: "cartesian"
        x: -0.97
        y: -0.97
        z: 0.14
        spatialize: true
        delay_ms: 0
      - name: "Rb"
        coord_mode: "cartesian"
        x: 0.97
        y: -0.97
        z: 0.14
        spatialize: true
        delay_ms: 0

      # Height is the current frontier. Extend top-front vertically beyond the
      # floor speaker radius so the canopy grows in *distance*, not loudness.
      - name: "TFL"
        coord_mode: "cartesian"
        x: -0.96
        y: 1.0
        z: 1.18
        spatialize: true
        delay_ms: 0
      - name: "TFR"
        coord_mode: "cartesian"
        x: 0.96
        y: 1.0
        z: 1.18
        spatialize: true
        delay_ms: 0

      # Upper-rear also grows so the canopy closes behind, but remains shorter
      # than upper-front to avoid returning to rear gravity.
      - name: "TBL"
        coord_mode: "cartesian"
        x: -0.92
        y: -0.96
        z: 1.10
        spatialize: true
        delay_ms: 0
      - name: "TBR"
        coord_mode: "cartesian"
        x: 0.92
        y: -0.96
        z: 1.10
        spatialize: true
        delay_ms: 0

  binaural:
    output_mode: binaural
    hrir_source: saf

    # Continue the native distance frontier, but let explicit top coordinates do
    # extra vertical work rather than using frequency gain as a height shortcut.
    unit_scale_m: 6.0

    # Expand first-order propagation again, especially vertically. Reflection
    # strength reaches the known upstream reference level, while late-room energy
    # is reduced so the larger world does not become a wash.
    reflections:
      enabled: true
      room_width_m: 13.5
      room_depth_m: 21.0
      room_height_m: 10.0
      level: 0.40

    reverb:
      enabled: true
      level: 0.04
      rt60_s: 0.18
      predelay_ms: 26.0

    # Native distance-dependent HF attenuation touches only the derived support
    # scene. The authoritative stereo master stays full-band outside this scene.
    air_absorption: true
