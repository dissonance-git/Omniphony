# Protected-master stereo support-field prototype.
#
# The finished stereo master never enters this scene. The portable music-field
# processor analyzes real L/R magnitude + phase by frequency and emits a derived
# logical 7.1.4 support bed in canonical bridge order:
#
#   L/R         broad front/front-side extent
#   C/LFE       zero (center authority + bass remain in the direct master)
#   Ls/Rs       wide lateral continuity / balance
#   Lb/Rb       real rear depth without rear dominance
#   Tfl/Tfr     dominant front-height distance / canopy
#   Tbl/Tbr     upper-rear closure and depth
#
# The support scene deliberately relies on Omniphony's inherited binaural core
# for the spatial acoustics. Our stereo layer decides what evidence may enter the
# field; HRTF/ITD, metric distance cues, first-order reflections, the short FDN
# tail and clipping protection remain native renderer mechanisms.
#
# Current perceptual weighting from physical listening:
#
#   DISTANCE / BUBBLE SCALE
#     front        primary
#     rear         primary, but must not dominate
#     height       primary
#     sides        fully wide and continuous; radial reach is secondary
#
# This is intentionally not a narrow front/back tunnel. Side width remains large;
# the stronger *distance* impression is concentrated on the front/back/z axes
# because those dimensions contribute most strongly to the target bubble percept.
render:
  master_gain: 0.0
  auto_gain: true
  auto_gain_ceiling_db: -2.0
  virtual_bed:
    radius_m: 1.0
    speakers:
      # Front field reaches the full front corners. At the 4 m scene scale these
      # broad-support positions sit about 5.7 m from the listener.
      - name: "L"
        coord_mode: "cartesian"
        x: -1.0
        y: 1.0
        z: 0.08
        spatialize: true
        delay_ms: 0
      - name: "R"
        coord_mode: "cartesian"
        x: 1.0
        y: 1.0
        z: 0.08
        spatialize: true
        delay_ms: 0

      # These channels are deliberately silent in the derived support bed.
      - name: "C"
        coord_mode: "cartesian"
        x: 0.0
        y: 1.0
        z: 0.0
        spatialize: true
        delay_ms: 0
      - name: "LFE"
        coord_mode: "cartesian"
        x: 0.0
        y: 0.0
        z: 0.0
        spatialize: false
        delay_ms: 0

      # Sides remain maximally wide but deliberately closer in radial distance.
      # They provide width and continuity without becoming the main scale cue.
      - name: "Ls"
        coord_mode: "cartesian"
        x: -1.0
        y: 0.0
        z: 0.10
        spatialize: true
        delay_ms: 0
      - name: "Rs"
        coord_mode: "cartesian"
        x: 1.0
        y: 0.0
        z: 0.10
        spatialize: true
        delay_ms: 0

      # Rear is again a primary depth axis, but remains shorter than front so
      # the acoustic centre of gravity stays around/in front of the listener.
      - name: "Lb"
        coord_mode: "cartesian"
        x: -0.90
        y: -0.90
        z: 0.12
        spatialize: true
        delay_ms: 0
      - name: "Rb"
        coord_mode: "cartesian"
        x: 0.90
        y: -0.90
        z: 0.12
        spatialize: true
        delay_ms: 0

      # Upper-front remains the longest radial axis and supplies the large canopy.
      - name: "TFL"
        coord_mode: "cartesian"
        x: -0.92
        y: 1.0
        z: 1.0
        spatialize: true
        delay_ms: 0
      - name: "TFR"
        coord_mode: "cartesian"
        x: 0.92
        y: 1.0
        z: 1.0
        spatialize: true
        delay_ms: 0

      # Upper-rear has substantial real distance so the canopy closes behind,
      # while remaining slightly shorter than upper-front.
      - name: "TBL"
        coord_mode: "cartesian"
        x: -0.86
        y: -0.90
        z: 0.95
        spatialize: true
        delay_ms: 0
      - name: "TBR"
        coord_mode: "cartesian"
        x: 0.86
        y: -0.90
        z: 0.95
        spatialize: true
        delay_ms: 0

  binaural:
    output_mode: binaural
    hrir_source: saf

    # Push the inherited metric-distance machinery harder. Direct support gain is
    # not reduced by this scale: distance drives Omniphony's acoustic cues such
    # as reflection geometry, air absorption and room send.
    unit_scale_m: 4.0

    # A larger native first-order reflection room increases propagation distance
    # and externalization. Level rises only slightly; bubble size should come from
    # geometry/delay rather than an obviously wetter presentation.
    reflections:
      enabled: true
      room_width_m: 9.0
      room_depth_m: 14.0
      room_height_m: 6.5
      level: 0.34

    # Native FDN remains short and low. Keep the tail subordinate to direct HRTF,
    # metric distance and first-order reflection cues.
    reverb:
      enabled: true
      level: 0.07
      rt60_s: 0.24
      predelay_ms: 22.0

    # Native distance-dependent HF attenuation touches only the derived support
    # scene. The authoritative stereo master stays full-band outside this scene.
    air_absorption: true
