# Preserved-master stereo support-field prototype.
#
# Unlike stereo-music-prototype.yaml, this config is NOT asked to render the
# finished stereo master. The Windows listening worker keeps the original L/R
# samples authoritative and feeds only a derived, bass-protected side field
# through this Omniphony binaural scene.
#
# The first experiment proved that this architecture can be effectively
# transparent at the old low support level: ON and OFF were reported as nearly
# indistinguishable, with none of the former tinny/hallway failure. This pass
# intentionally raises only the support-field gain so spatial audibility can be
# tested without changing extraction, bass protection, alignment, or room cues.
#
# The host-side support coefficient remains conservative. +6.6 dB here is about
# a 2.14x field increase, moving the effective contribution from roughly 14%
# toward roughly 30% before the final master-first headroom veto.
#
# The support scene remains intentionally dry: no early reflections, no late
# reverb, no air absorption. If this creates useful outside-the-head structure,
# richer field analysis can be added later as an independent variable.
render:
  master_gain: 6.6
  virtual_bed:
    radius_m: 1.0
    speakers:
      - name: "L"
        coord_mode: "cartesian"
        x: -1.0
        y: -0.35
        z: 0.15
        spatialize: true
        delay_ms: 0
      - name: "R"
        coord_mode: "cartesian"
        x: 1.0
        y: -0.35
        z: 0.15
        spatialize: true
        delay_ms: 0
  binaural:
    output_mode: binaural
    hrir_source: saf
    unit_scale_m: 3.0
    reflections:
      enabled: false
    reverb:
      enabled: false
    air_absorption: false
