# Stereo-music presentation prototype.
#
# This is intentionally separate from upstream-demo-reference.yaml. The upstream
# demo is a known-spatial 7.1.4 control; ordinary stereo music needs a different
# presentation contract that preserves the mastered stereo image and tonal body.
#
# Current conservative choices:
# - no late reverb: a music default must not sound like an audible room effect;
# - very light first-order reflections only, as externalization support;
# - no distance air-absorption on the direct path;
# - L/R are presented wider than a conventional +/-45 degree virtual speaker pair
#   while remaining in the frontal hemisphere.
render:
  virtual_bed:
    radius_m: 1.0
    speakers:
      - name: "L"
        coord_mode: "cartesian"
        x: -1.0
        y: 0.55
        z: 0.0
        spatialize: true
        delay_ms: 0
      - name: "R"
        coord_mode: "cartesian"
        x: 1.0
        y: 0.55
        z: 0.0
        spatialize: true
        delay_ms: 0
  binaural:
    output_mode: binaural
    hrir_source: saf
    unit_scale_m: 3.0
    reflections:
      enabled: true
      level: 0.12
    reverb:
      enabled: false
    air_absorption: false
