# Frozen fork room-assisted comparison.
#
# This preserves the fork's current 3 m + early-reflection + short-FDN tuning
# for controlled A/B work. It is NOT the upstream perceptual ancestor and must
# not silently replace `upstream-demo-reference.yaml` as the product floor.
#
# Static listener by design: no head-tracking source is configured here.
render:
  binaural:
    output_mode: binaural
    hrir_source: saf
    unit_scale_m: 3.0
    air_absorption: true
    reflections:
      enabled: true
      room_width_m: 4.0
      room_depth_m: 5.0
      room_height_m: 2.7
      level: 0.4
    reverb:
      enabled: true
      level: 0.2
      rt60_s: 0.3
      predelay_ms: 20
