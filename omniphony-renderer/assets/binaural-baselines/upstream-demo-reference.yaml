# Upstream Omniphony bundled-demo perceptual reference.
#
# Keep this control aligned with mgth/Omniphony's actual
# omniphony-renderer/assets/demo/demo.yaml rather than an inferred approximation.
# The upstream demo uses the embedded SAF/KEMAR HRTF, a 3 m scene scale,
# modest first-order reflections, and a short low-level late-reverb tail.
#
# This is the protected perceptual ancestor for the fork. New DSP,
# libaural-informed policy, stereo inference, calibration, and other experiments
# must use separate controls and must preserve or beat this reference by listening.
render:
  binaural:
    output_mode: binaural
    hrir_source: saf
    unit_scale_m: 3.0
    reflections:
      enabled: true
      level: 0.4
    reverb:
      enabled: true
      level: 0.2
      rt60_s: 0.3
