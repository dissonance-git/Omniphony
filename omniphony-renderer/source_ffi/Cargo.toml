[package]
name = "source_ffi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "C ABI for rendering already-separated causal sources through Omniphony"

[lib]
name = "omniphony_source"
crate-type = ["cdylib", "rlib"]

[dependencies]
orender_engine = { version = "0.2.3", path = "../orender_engine" }
renderer = { version = "0.2.4", path = "../renderer" }
